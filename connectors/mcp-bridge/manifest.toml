[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "mcp.tools.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "mcp.tools.write"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "mcp.resources.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "mcp.prompts.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "mcp.sampling.handle"
requests = 10
window_ms = 60000
burst = 2
scope = "instance"

[[rate_limits.pools]]
id = "mcp.server.metrics"
requests = 120
window_ms = 60000
burst = 20
scope = "instance"

[rate_limits.operation_pools]
"mcp.prompts.get" = ["mcp.prompts.read"]
"mcp.resources.templates.list" = ["mcp.resources.read"]
"mcp.sampling.handle" = ["mcp.sampling.handle"]
"mcp.tools.call" = ["mcp.tools.write"]
"mcp.prompts.list" = ["mcp.prompts.read"]
"mcp.resources.read" = ["mcp.resources.read"]
"mcp.server.metrics" = ["mcp.server.metrics"]
"mcp.tools.list" = ["mcp.tools.read"]
"mcp.resources.list" = ["mcp.resources.read"]

[security]
description_scan = "warn"

[sampling]
enabled = false
max_rpm = 10
timeout_secs = 30
max_tokens_cap = 4096
max_tool_rounds = 5
