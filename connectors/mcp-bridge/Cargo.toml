[package]
name = "fcp-mcp-bridge"
description = "MCP Bridge connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_mcp_bridge"
path = "src/lib.rs"

[[bin]]
name = "fcp-mcp-bridge"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
anyhow.workspace = true
async-trait.workspace = true
reqwest.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
wiremock.workspace = true
