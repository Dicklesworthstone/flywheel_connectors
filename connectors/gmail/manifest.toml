[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:7f4ef7a7b43dc780b07c3ea681e3c4de89d1b5b6631dc5d7ea5ca586289acb58"

[connector]
id = "fcp.gmail"
name = "Gmail Connector"
version = "0.1.0"
description = "FCP connector for Gmail (messages, threads, labels, drafts, attachments)"
archetypes = ["operational", "streaming", "knowledge"]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:private"]
forbidden = ["z:public", "z:work"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = [
    "media.download",
    "media.upload",
    "gmail.send",
    "gmail.read",
    "gmail.history.read",
    "gmail.write",
    "gmail.delete",
]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."gmail.send_message"]
description = "Send an email message"
capability = "gmail.send"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "none"
revocation_freshness = "critical"

[provides.operations."gmail.send_message".input_schema]
type = "object"
anyOf = [{ required = ["raw"] }, { required = ["to", "subject", "body"] }]
[provides.operations."gmail.send_message".input_schema.properties.raw]
type = "string"
[provides.operations."gmail.send_message".input_schema.properties.to]
type = "string"
[provides.operations."gmail.send_message".input_schema.properties.subject]
type = "string"
[provides.operations."gmail.send_message".input_schema.properties.body]
type = "string"

[provides.operations."gmail.send_message".output_schema]
required = ["message"]
type = "object"
[provides.operations."gmail.send_message".output_schema.properties.message]
type = "object"

[provides.operations."gmail.send_message".network_constraints]
host_allow = ["gmail.googleapis.com", "www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gmail.send_message".ai_hints]
when_to_use = "Send an email. This sends a real email to the recipient."
common_mistakes = ["Sending to wrong recipients", "Not encoding body as base64url"]
examples = ['{"to": "user@example.com", "subject": "Hello", "body": "Message body"}']
related = ["gmail.create_draft"]

