# ── Events ──────────────────────────────────────────────────────

[event_caps]
streaming = true
replay = false
min_buffer_events = 50

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "gmail.read"
requests = 250
window_ms = 1000
burst = 25
scope = "instance"

[[rate_limits.pools]]
id = "gmail.history.read"
requests = 250
window_ms = 1000
burst = 25
scope = "instance"

[[rate_limits.pools]]
id = "gmail.write"
requests = 250
window_ms = 1000
burst = 25
scope = "instance"

[[rate_limits.pools]]
id = "gmail.send"
requests = 100
window_ms = 1000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "gmail.delete"
requests = 250
window_ms = 1000
burst = 25
scope = "instance"

[rate_limits.operation_pools]
"gmail.send_message" = ["gmail.send"]
"gmail.get_message" = ["gmail.read"]
"gmail.get_attachment" = ["gmail.read"]
"gmail.list_messages" = ["gmail.read"]
"gmail.sync_history" = ["gmail.history.read"]
"gmail.modify_message" = ["gmail.write"]
"gmail.list_labels" = ["gmail.read"]
"gmail.trash_message" = ["gmail.delete"]
"gmail.get_thread" = ["gmail.read"]
"gmail.get_draft" = ["gmail.write"]
"gmail.create_draft" = ["gmail.write"]
"gmail.send_draft" = ["gmail.send"]
