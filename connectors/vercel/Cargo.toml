[package]
name = "fcp-vercel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Vercel connector for projects, deployments, domains, and environment variables"

[[bin]]
name = "fcp-vercel"
path = "src/main.rs"

[lib]
name = "fcp_vercel"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
fcp-testkit = { path = "../../crates/fcp-testkit" }
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true
