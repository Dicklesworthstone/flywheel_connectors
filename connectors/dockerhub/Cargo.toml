[package]
name = "fcp-dockerhub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Docker Hub connector for Repositories, Tags, and Organizations"

[[bin]]
name = "fcp-dockerhub"
path = "src/main.rs"

[lib]
name = "fcp_dockerhub"
path = "src/lib.rs"

[dependencies]
chrono.workspace = true
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true
