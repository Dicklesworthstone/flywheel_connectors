[package]
name = "fcp-openrouter"
description = "OpenRouter API connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_openrouter"
path = "src/lib.rs"

[[bin]]
name = "fcp-openrouter"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
base64.workspace = true
thiserror.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
chrono.workspace = true
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-e2e = { path = "../../crates/fcp-e2e", default-features = false }
fcp-testkit = { path = "../../crates/fcp-testkit" }
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true
