[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = ["streaming"]
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:02a066009bda107727ef5c6d2d36f7fcbac926a8f39545fe54a514860000c29b"

[connector]
id = "fcp.microsoft-foundry"
name = "Microsoft Foundry"
version = "0.1.0"
description = "Microsoft Foundry / Azure OpenAI v1 connector with deployment-aware chat, streaming, Responses API, embeddings, and Entra/API-key auth policy"
archetypes = ["operational", "streaming"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stores no durable state. Configuration is limited to base_url, api_key or entra_access_token or credential_id, default_model, timeout, model cache TTL, and rate-limit retry policy."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work", "z:project:*"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["microsoft_foundry.responses", "microsoft_foundry.chat", "microsoft_foundry.embeddings", "microsoft_foundry.deployments.read", "microsoft_foundry.health"]
forbidden = ["system.exec", "network.listen"]

[sandbox]
profile = "strict"
memory_mb = 160
cpu_percent = 25
wall_clock_timeout_ms = 300000
deny_exec = true
deny_ptrace = true

[provides.operations."microsoft_foundry.responses.create"]
description = "Create a Microsoft Foundry Responses API result through POST /openai/v1/responses. The model field is the Azure deployment name."
capability = "microsoft_foundry.responses"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["input"], properties = { model = { type = "string", description = "Foundry deployment name", default = "gpt-4o" }, input = {}, instructions = { type = "string" }, include = { type = "array", items = { type = "string" } }, tools = { type = "array" }, tool_choice = {}, max_output_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, store = { type = "boolean" }, background = { type = "boolean" }, previous_response_id = { type = "string" }, metadata = { type = "object" }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["*.openai.azure.com", "*.services.ai.azure.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 300000, max_response_bytes = 10485760 }

[provides.operations."microsoft_foundry.responses.create".ai_hints]
when_to_use = "Use for Azure OpenAI Foundry deployments when Responses API features, background mode, or input-item tracking are needed."
common_mistakes = ["Use the deployment name in model; do not pass an Azure resource path.", "Do not log prompts, completions, bearer tokens, API keys, tenant IDs, or full resource hostnames."]
examples = ['{"model":"prod-gpt4o","input":[{"role":"user","content":"Summarize this incident."}],"max_output_tokens":256}']
related = ["microsoft_foundry.responses.cancel", "microsoft_foundry.responses.input_items.list", "microsoft_foundry.deployments.list"]

[provides.operations."microsoft_foundry.responses.cancel"]
description = "Cancel a background Responses API response through POST /openai/v1/responses/{response_id}/cancel."
capability = "microsoft_foundry.responses"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "best_effort"
input_schema = { type = "object", required = ["response_id"], properties = { response_id = { type = "string" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["*.openai.azure.com", "*.services.ai.azure.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 10485760 }

[provides.operations."microsoft_foundry.responses.cancel".ai_hints]
when_to_use = "Use to stop a no-longer-needed background Responses API job."
common_mistakes = ["Do not log raw response IDs if they are tenant-sensitive; hash them in audit logs."]
examples = ['{"response_id":"resp_abc123"}']
related = ["microsoft_foundry.responses.create"]

[provides.operations."microsoft_foundry.responses.input_items.list"]
description = "List input items for a Responses API response through GET /openai/v1/responses/{response_id}/input_items."
