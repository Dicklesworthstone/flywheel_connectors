# -- Events -------------------------------------------------------------------

[event_caps]
streaming = false
replay = true
min_buffer_events = 50

# -- Sandbox ------------------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# -- Rate Limits --------------------------------------------------------------

[[rate_limits.pools]]
id = "chat.read"
requests = 300
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "chat.write"
requests = 60
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "chat.webhook"
requests = 600
window_ms = 60000
burst = 60
scope = "instance"

[rate_limits.operation_pools]
"chat.ingest_webhook" = ["chat.webhook"]
"chat.list_spaces" = ["chat.read"]
"chat.get_space" = ["chat.read"]
"chat.send_message" = ["chat.write"]
"chat.reply_message" = ["chat.write"]
"chat.send_media_message" = ["chat.write"]
"chat.list_messages" = ["chat.read"]
"chat.get_message" = ["chat.read"]
"chat.add_reaction" = ["chat.write"]
"chat.list_members" = ["chat.read"]
