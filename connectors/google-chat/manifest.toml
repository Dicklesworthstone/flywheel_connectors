[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:6660a557a9840cb3617f92eb97849a8e47ed2d87ab1a333c61db905413248d53"

[connector]
id = "fcp.google_chat"
name = "Google Chat Connector"
version = "0.1.0"
description = "FCP connector for Google Chat (spaces, messages, members)"
archetypes = ["operational"]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "network.listen"]

# -- Operations ---------------------------------------------------------------

[provides.operations."chat.ingest_webhook"]
description = "Process a host-forwarded Google Chat webhook request"
capability = "chat.webhook"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."chat.ingest_webhook".input_schema]
required = ["method", "headers", "body"]
type = "object"
[provides.operations."chat.ingest_webhook".input_schema.properties.method]
type = "string"
[provides.operations."chat.ingest_webhook".input_schema.properties.headers]
type = "object"
[provides.operations."chat.ingest_webhook".input_schema.properties.body]
description = "Raw JSON string or parsed JSON object forwarded by the FCP host request region"
[provides.operations."chat.ingest_webhook".input_schema.properties.body_size_bytes]
type = "integer"
[provides.operations."chat.ingest_webhook".input_schema.properties.body_read_elapsed_ms]
type = "integer"
[provides.operations."chat.ingest_webhook".input_schema.properties.delivery_id]
type = "string"
[provides.operations."chat.ingest_webhook".input_schema.properties.source_id]
type = "string"
[provides.operations."chat.ingest_webhook".input_schema.properties.command_authorized]
type = "boolean"
[provides.operations."chat.ingest_webhook".input_schema.properties.dispatch_outcome]
type = "string"
enum = ["commit", "retryable_error", "nonretryable_error"]

[provides.operations."chat.ingest_webhook".output_schema]
required = ["accepted", "event_emitted", "status_code", "reason_code", "reason"]
type = "object"
[provides.operations."chat.ingest_webhook".output_schema.properties.accepted]
type = "boolean"
[provides.operations."chat.ingest_webhook".output_schema.properties.event_emitted]
type = "boolean"
[provides.operations."chat.ingest_webhook".output_schema.properties.status_code]
type = "integer"
[provides.operations."chat.ingest_webhook".output_schema.properties.reason_code]
type = "string"
[provides.operations."chat.ingest_webhook".output_schema.properties.reason]
type = "string"
[provides.operations."chat.ingest_webhook".output_schema.properties.event]
type = "object"
[provides.operations."chat.ingest_webhook".output_schema.properties.auth]
type = "object"
[provides.operations."chat.ingest_webhook".output_schema.properties.policy]
type = "object"
[provides.operations."chat.ingest_webhook".output_schema.properties.replay]
type = "object"
[provides.operations."chat.ingest_webhook".output_schema.properties.ingress]
type = "object"

[provides.operations."chat.ingest_webhook".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 1000
total_timeout_ms = 3000
max_response_bytes = 65536

[provides.operations."chat.ingest_webhook".ai_hints]
when_to_use = "Handle a Google Chat callback that the FCP host has already accepted into a request region. The connector does not open a listener."
common_mistakes = ["Letting the connector listen directly instead of using host-forwarded ingress", "Logging bearer tokens or raw webhook bodies", "Dropping Workspace Add-on payloads instead of normalizing chat.messagePayload"]
examples = ['{"method":"POST","headers":{"Authorization":"Bearer <token>","Content-Type":"application/json"},"body":"{\"type\":\"MESSAGE\",\"space\":{\"name\":\"spaces/AAAA\",\"spaceType\":\"ROOM\"},\"message\":{\"name\":\"spaces/AAAA/messages/msg1\",\"text\":\"@flywheel hi\",\"sender\":{\"name\":\"users/123\"}}}"}']
related = ["chat.reply_message"]

