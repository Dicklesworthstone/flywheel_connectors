[package]
name = "fcp-wecom"
description = "WeCom enterprise messaging connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_wecom"
path = "src/lib.rs"

[[bin]]
name = "fcp-wecom"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-async-core.workspace = true
fcp-sdk.workspace = true

aes = "0.8"
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
cbc = "0.1"
chrono.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
quick-xml = "0.41"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url.workspace = true
hex.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-testkit.workspace = true
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true
