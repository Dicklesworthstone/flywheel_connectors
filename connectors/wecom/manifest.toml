[provides.operations.departments_list.ai_hints]
when_to_use = "Use to discover the visible WeCom department hierarchy before targeting department-scoped messages or directory workflows."
common_mistakes = ["The optional id is a numeric WeCom department id, not a department name.", "Tenant app visibility controls which departments appear in the response.", "Do not treat this as a user search; use users_get when you already know a userid."]
examples = ['{"id":42}']

[provides.operations.callback_verify_url]
summary = "Verify a host-forwarded WeCom callback URL challenge"
capability = "wecom.events.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", required = ["msg_signature", "timestamp", "nonce", "echostr"], additionalProperties = false, properties = { msg_signature = { type = "string", minLength = 1, pattern = "\\S" }, timestamp = { type = "string", minLength = 1, pattern = "\\S" }, nonce = { type = "string", minLength = 1, pattern = "\\S" }, echostr = { type = "string", minLength = 1, pattern = "\\S" } } }
output_schema = { type = "object", required = ["verified", "transport", "receive_id", "challenge", "http_response"], additionalProperties = false, properties = { verified = { type = "boolean" }, transport = { type = "string", enum = ["callback_http_get"] }, receive_id = { type = "string", minLength = 1 }, challenge = { type = "string" }, http_response = { type = "object", required = ["status", "content_type", "body"], additionalProperties = false, properties = { status = { type = "integer", minimum = 100, maximum = 599 }, content_type = { type = "string" }, body = { type = "string" } } } } }
network_constraints = { host_allow = ["none.invalid"], port_allow = [0], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 0, max_redirects = 0, connect_timeout_ms = 1000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.callback_verify_url.ai_hints]
when_to_use = "Use only when the host has received WeCom's callback verification GET and needs the decrypted challenge response."
common_mistakes = ["The connector does not own a public listener; the host must forward the GET query fields.", "echostr is an encrypted challenge from WeCom, not arbitrary caller text.", "Do not use this for ordinary callback POST events; use callback_ingest_event instead."]
examples = ['{"msg_signature":"sha1-signature","timestamp":"1710000000","nonce":"nonce-123","echostr":"encrypted-challenge"}']

[provides.operations.callback_ingest_event]
summary = "Verify, decrypt, replay-check, policy-gate, and normalize one host-forwarded WeCom callback event"
capability = "wecom.events.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", required = ["msg_signature", "timestamp", "nonce"], anyOf = [{ required = ["body"] }, { required = ["body_xml"] }], additionalProperties = false, properties = { msg_signature = { type = "string", minLength = 1, pattern = "\\S" }, timestamp = { type = "string", minLength = 1, pattern = "\\S" }, nonce = { type = "string", minLength = 1, pattern = "\\S" }, body = { type = "string", minLength = 1, description = "Raw XML body from the WeCom HTTP POST callback" }, body_xml = { type = "string", minLength = 1, description = "Alias for body when the host already labels the payload as XML" } } }
output_schema = { type = "object", required = ["delivery", "callback", "policy", "event"], additionalProperties = false, properties = { delivery = { type = "object", required = ["id", "transport", "verified", "msg_signature_hash", "timestamp", "timestamp_skew_secs", "nonce_hash", "nonce_key_hash", "receive_id_hash", "replay"], additionalProperties = false, properties = { id = { type = "string", minLength = 1 }, transport = { type = "string", enum = ["callback_http"] }, verified = { type = "boolean" }, msg_signature_hash = { type = "string", pattern = "^sha256:[0-9a-f]{16}$" }, timestamp = { type = "string" }, timestamp_skew_secs = { type = "integer", minimum = 0 }, nonce_hash = { type = "string", pattern = "^sha256:[0-9a-f]{16}$" }, nonce_key_hash = { type = "string", pattern = "^sha256:[0-9a-f]{16}$" }, message_key_hash = { type = ["string", "null"], pattern = "^sha256:[0-9a-f]{16}$" }, receive_id_hash = { type = "string", pattern = "^sha256:[0-9a-f]{16}$" }, replay = { type = "boolean" } } }, callback = { type = "object", required = ["outer", "message", "plaintext_xml"], additionalProperties = false, properties = { outer = { type = ["object", "null"], additionalProperties = { type = "string" } }, message = { type = ["object", "null"], additionalProperties = { type = "string" } }, plaintext_xml = { type = ["string", "null"] } } }, policy = { type = "object", required = ["model", "decision", "reason", "sender_user_hash", "external_user_hash", "room_hash", "persisted_replay_state", "redaction_status"], additionalProperties = false, properties = { model = { type = "string", enum = ["host_forwarded_callback_replay_and_policy"] }, decision = { type = "string", enum = ["accepted", "rejected", "duplicate"] }, reason = { type = "string" }, sender_user_hash = { type = ["string", "null"], pattern = "^sha256:[0-9a-f]{16}$" }, external_user_hash = { type = ["string", "null"], pattern = "^sha256:[0-9a-f]{16}$" }, room_hash = { type = ["string", "null"], pattern = "^sha256:[0-9a-f]{16}$" }, persisted_replay_state = { type = "boolean" }, redaction_status = { type = "string" } } }, event = { anyOf = [{ type = "object", additionalProperties = true }, { type = "null" }] } } }
network_constraints = { host_allow = ["none.invalid"], port_allow = [0], ip_allow = [], cidr_deny = [], require_sni = false, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 0, max_redirects = 0, connect_timeout_ms = 1000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.callback_ingest_event.ai_hints]
when_to_use = "Use when the host forwards one signed WeCom callback POST and the agent needs replay-checked, policy-gated event normalization."
common_mistakes = ["The host must forward the raw XML body or body_xml with query fields intact.", "Duplicate or disallowed callbacks can return an acknowledged policy result without emitting an event.", "Do not bypass sender, room, or mention policy just because the provider signature is valid."]
examples = ['{"msg_signature":"sha1-signature","timestamp":"1710000000","nonce":"nonce-123","body_xml":"<xml><Encrypt>encrypted-payload</Encrypt></xml>"}']

[provides.operations.health]
summary = "Verify WeCom credentials and token issuance"
capability = "wecom.health.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "token_issuance_probe", "details"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, token_issuance_probe = { type = "string", enum = ["GET /cgi-bin/gettoken"] }, details = { type = "object", additionalProperties = true } } }
network_constraints = { host_allow = ["qyapi.weixin.qq.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.health.ai_hints]
when_to_use = "Use for a bounded WeCom credential and reachability check before starting a workflow that depends on the bound enterprise app."
common_mistakes = ["A healthy credential probe does not prove a particular user, department, tag, or media_id is deliverable.", "Do not call this as a webhook validation helper; callback_verify_url and callback_ingest_event cover callback paths.", "Treat the response as diagnostics, not as durable connector state."]
examples = ['{}']

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 30
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
