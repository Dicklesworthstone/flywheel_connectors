[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.wecom"
name = "WeCom Enterprise Messaging"
version = "0.1.0"
description = "Tenant-scoped WeCom connector for enterprise app messaging, host-forwarded callback ingest, media transfer, directory lookups, and health verification"
archetype = "operational"
status = "proven"
homepage = "https://developer.work.weixin.qq.com/"

# Auth and scope model:
# - One connector instance is bound to one WeCom tenant application.
# - Authentication uses `corp_id`, `agent_id`, and `agent_secret`.
# - The operator provisions that application out of band and grants the app the
#   tenant permissions needed for outbound messaging and directory reads.
# - Optional callback verification uses a host-forwarded HTTP callback model with
#   `callback_token` and `callback_encoding_aes_key`; the connector never owns a listener socket.
# - Host-forwarded callback ingest enforces timestamp skew, nonce/MsgId replay,
#   sender/room policy, and redaction-safe decision evidence before emitting events.
# - The connector acts as the configured enterprise application; user impersonation and
#   websocket delivery remain out of scope.

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work", "z:project:*"]
allowed_targets = ["z:work", "z:project:*"]
tailscale_tag = "tag:fcp-work"

[capabilities]
required = ["network.dns", "network.outbound", "network.tls.sni"]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

[provides.operations.messages_send_text]
summary = "Send a WeCom text message"
capability = "wecom.messages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"
input_schema = { type = "object", required = ["content"], anyOf = [{ required = ["touser"] }, { required = ["toparty"] }, { required = ["totag"] }], additionalProperties = false, properties = { content = { type = "string", minLength = 1, pattern = "\\S" }, touser = { type = "string", minLength = 1, pattern = "\\S" }, toparty = { type = "string", minLength = 1, pattern = "\\S" }, totag = { type = "string", minLength = 1, pattern = "\\S" }, safe = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, enable_duplicate_check = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, duplicate_check_interval = { type = "integer", minimum = 0, maximum = 4294967295 } } }
output_schema = { type = "object", additionalProperties = true, properties = { errcode = { type = "integer" }, errmsg = { type = "string" }, msgid = { type = "string" }, invaliduser = { type = "string" }, invalidparty = { type = "string" }, invalidtag = { type = "string" }, response_code = { type = "string" }, coordination = { type = "array", description = "Redaction-safe chat thread ownership audit records", items = { type = "object" } } } }
network_constraints = { host_allow = ["qyapi.weixin.qq.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.messages_send_text.ai_hints]
when_to_use = "Use when an agent must proactively send a short plain-text notice to WeCom users, departments, or tags from the bound enterprise app."
common_mistakes = ["Provide exactly the intended WeCom target family: touser, toparty, or totag; an empty target set cannot be delivered.", "Do not use this operation for markdown, image, or file payloads; choose the matching send operation instead.", "This operation sends immediately and is not idempotent, so avoid blind retries after an unknown delivery result."]
examples = ['{"touser":"alice","content":"Release candidate is ready for review.","enable_duplicate_check":true,"duplicate_check_interval":600}']

[provides.operations.messages_send_markdown]
summary = "Send a WeCom markdown message"
capability = "wecom.messages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"
input_schema = { type = "object", required = ["content"], anyOf = [{ required = ["touser"] }, { required = ["toparty"] }, { required = ["totag"] }], additionalProperties = false, properties = { content = { type = "string", minLength = 1, pattern = "\\S" }, touser = { type = "string", minLength = 1, pattern = "\\S" }, toparty = { type = "string", minLength = 1, pattern = "\\S" }, totag = { type = "string", minLength = 1, pattern = "\\S" }, enable_duplicate_check = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, duplicate_check_interval = { type = "integer", minimum = 0, maximum = 4294967295 } } }
output_schema = { type = "object", additionalProperties = true, properties = { errcode = { type = "integer" }, errmsg = { type = "string" }, msgid = { type = "string" }, invaliduser = { type = "string" }, invalidparty = { type = "string" }, invalidtag = { type = "string" }, response_code = { type = "string" }, coordination = { type = "array", description = "Redaction-safe chat thread ownership audit records", items = { type = "object" } } } }
network_constraints = { host_allow = ["qyapi.weixin.qq.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.messages_send_markdown.ai_hints]
when_to_use = "Use when the WeCom message needs simple rich formatting that the enterprise app can render as markdown."
common_mistakes = ["Do not assume full GitHub-flavored Markdown support; WeCom renders a narrower markdown subset.", "Keep private links out of markdown bodies unless the recipient tenant can actually reach them.", "Provide one WeCom target family; mixing broad department and tag sends can over-notify."]
examples = ['{"toparty":"42","content":"**Incident update**: database failover completed."}']

[provides.operations.messages_send_image]
summary = "Send a WeCom image message"
capability = "wecom.messages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"
input_schema = { type = "object", required = ["media_id"], anyOf = [{ required = ["touser"] }, { required = ["toparty"] }, { required = ["totag"] }], additionalProperties = false, properties = { media_id = { type = "string", minLength = 1, pattern = "\\S" }, touser = { type = "string", minLength = 1, pattern = "\\S" }, toparty = { type = "string", minLength = 1, pattern = "\\S" }, totag = { type = "string", minLength = 1, pattern = "\\S" }, safe = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, enable_duplicate_check = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, duplicate_check_interval = { type = "integer", minimum = 0, maximum = 4294967295 } } }
output_schema = { type = "object", additionalProperties = true, properties = { errcode = { type = "integer" }, errmsg = { type = "string" }, msgid = { type = "string" }, invaliduser = { type = "string" }, invalidparty = { type = "string" }, invalidtag = { type = "string" }, response_code = { type = "string" }, coordination = { type = "array", description = "Redaction-safe chat thread ownership audit records", items = { type = "object" } } } }
network_constraints = { host_allow = ["qyapi.weixin.qq.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.messages_send_image.ai_hints]
when_to_use = "Use after media_upload returns an image media_id and the agent needs to deliver that image through WeCom."
common_mistakes = ["Do not pass raw bytes or base64 image data here; upload the image first and pass only media_id.", "Temporary WeCom media identifiers can expire, so do not cache them as durable asset references.", "A repeated call can send duplicate images; enable duplicate checks when the upstream workflow can retry."]
examples = ['{"touser":"alice","media_id":"media-image-123","safe":0}']

[provides.operations.messages_send_file]
summary = "Send a WeCom file message"
capability = "wecom.messages.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"
input_schema = { type = "object", required = ["media_id"], anyOf = [{ required = ["touser"] }, { required = ["toparty"] }, { required = ["totag"] }], additionalProperties = false, properties = { media_id = { type = "string", minLength = 1, pattern = "\\S" }, touser = { type = "string", minLength = 1, pattern = "\\S" }, toparty = { type = "string", minLength = 1, pattern = "\\S" }, totag = { type = "string", minLength = 1, pattern = "\\S" }, safe = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, enable_duplicate_check = { anyOf = [{ type = "boolean" }, { type = "integer", enum = [0, 1] }] }, duplicate_check_interval = { type = "integer", minimum = 0, maximum = 4294967295 } } }
output_schema = { type = "object", additionalProperties = true, properties = { errcode = { type = "integer" }, errmsg = { type = "string" }, msgid = { type = "string" }, invaliduser = { type = "string" }, invalidparty = { type = "string" }, invalidtag = { type = "string" }, response_code = { type = "string" }, coordination = { type = "array", description = "Redaction-safe chat thread ownership audit records", items = { type = "object" } } } }
network_constraints = { host_allow = ["qyapi.weixin.qq.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.messages_send_file.ai_hints]
when_to_use = "Use after media_upload returns a file media_id and the agent needs to deliver that file to a WeCom target."
common_mistakes = ["Do not pass a local path or file bytes here; upload the file first.", "Make sure the media_id came from the same tenant-bound app configuration.", "Repeated sends are visible to recipients, so avoid retrying without an idempotency decision from the caller."]
examples = ['{"toparty":"42","media_id":"media-file-123","safe":0}']

[provides.operations.media_upload]
summary = "Upload temporary media to WeCom"
capability = "wecom.media.write"
risk = "medium"
safety_tier = "risky"
idempotency = "best_effort"
input_schema = { type = "object", required = ["media_type", "file_name", "content_base64"], additionalProperties = false, properties = { media_type = { type = "string", enum = ["image", "voice", "video", "file"] }, file_name = { type = "string", minLength = 1, pattern = "\\S" }, mime_type = { type = "string", minLength = 1, pattern = "\\S" }, content_base64 = { type = "string", minLength = 1, contentEncoding = "base64" } } }
output_schema = { type = "object", additionalProperties = true, properties = { errcode = { type = "integer" }, errmsg = { type = "string" }, type = { type = "string" }, media_id = { type = "string" }, created_at = { type = "integer", minimum = 0 } } }
network_constraints = { host_allow = ["qyapi.weixin.qq.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 1048576 }

[provides.operations.media_upload.ai_hints]
when_to_use = "Use to create a temporary WeCom media_id before sending an image, voice, video, or file message."
common_mistakes = ["content_base64 must contain the file bytes encoded as base64, not a filesystem path.", "Only image, voice, video, and file are valid media_type values.", "This operation only uploads media; it does not notify recipients until a send operation uses the returned media_id."]
examples = ['{"media_type":"file","file_name":"runbook.pdf","mime_type":"application/pdf","content_base64":"JVBERi0xLjQ="}']

[provides.operations.media_download]
summary = "Download media bytes for a WeCom media_id"
capability = "wecom.media.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", required = ["media_id"], additionalProperties = false, properties = { media_id = { type = "string", minLength = 1, pattern = "\\S" } } }
output_schema = { type = "object", required = ["media_id", "content_length", "content_base64", "sha256"], additionalProperties = false, properties = { media_id = { type = "string", minLength = 1 }, file_name = { type = ["string", "null"], minLength = 1 }, mime_type = { type = ["string", "null"], minLength = 1 }, content_length = { type = "integer", minimum = 0 }, content_base64 = { type = "string", contentEncoding = "base64" }, sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" } } }
network_constraints = { host_allow = ["qyapi.weixin.qq.com"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 0, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 52428800 }

[provides.operations.media_download.ai_hints]
when_to_use = "Use when an accepted WeCom callback references a media_id and the agent needs the media bytes for inspection or downstream storage."
common_mistakes = ["Do not use this for public URLs; it only resolves provider media_id values.", "The output body is base64 plus a sha256 digest, so decode only after checking size and policy.", "Media downloaded from workplace conversations can contain sensitive data; keep logs redacted."]
examples = ['{"media_id":"media-file-123"}']

