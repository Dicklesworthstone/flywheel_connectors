[package]
name = "fcp-twitter"
description = "X/Twitter API connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_twitter"
path = "src/lib.rs"

[[bin]]
name = "fcp-twitter"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
fcp-async-core = { path = "../../crates/fcp-async-core" }

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac = "0.12"
percent-encoding.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
wiremock.workspace = true
