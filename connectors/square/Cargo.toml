[package]
name = "fcp-square"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Square connector"

[[bin]]
name = "fcp-square"
path = "src/main.rs"

[lib]
name = "fcp_square"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-prelude.workspace = true
# `connector-http` gates `transport_error_reached_service` (see client.rs).
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
wiremock.workspace = true
