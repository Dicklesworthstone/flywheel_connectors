[package]
name = "fcp-plivo"
description = "Plivo voice-call connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_plivo"
path = "src/lib.rs"

[[bin]]
name = "fcp-plivo"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
# `connector-http` gates `transport_error_reached_service` (see client.rs).
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
fcp-voice-call = { path = "../../crates/fcp-voice-call" }

base64.workspace = true
chrono.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
wiremock.workspace = true
