[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:5ad63e43198e4f2173ceee7958cda7c2a640d5222919940a61e19ea0742967fe"

[connector]
id = "fcp.synology-chat"
name = "Synology Chat"
version = "0.1.0"
description = "Synology Chat webhook connector for self-hosted chat delivery, forwarded outgoing-webhook normalization, and health checks"
archetypes = ["operational"]
format = "native"
status = "proven"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work", "z:project:*"]
allowed_targets = ["z:work", "z:project:*"]

[capabilities]
required = [
    "network.dns",
    "network.outbound",
    "synology_chat.read",
    "synology_chat.write",
    "synology_chat.webhook",
]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

# Synology Chat deployments are operator-configured and may live on public,
# private, or tailnet addresses. Per-operation egress uses the runtime webhook
# host placeholder, with LAN/tailnet/IP-literal allowances scoped to that host.

[provides.operations.send_message]
description = "Send a Synology Chat message through an incoming webhook"
capability = "synology_chat.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "none"

[provides.operations.send_message.network_constraints]
host_allow = ["${synology_chat_webhook_host}"]
port_allow = [80, 443, 5000, 5001]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = false
deny_tailnet_ranges = false
require_sni = false
spki_pins = []
deny_ip_literals = false
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 1048576

