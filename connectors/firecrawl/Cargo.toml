[package]
name = "fcp-firecrawl"
description = "Firecrawl connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_firecrawl"
path = "src/lib.rs"

[[bin]]
name = "fcp-firecrawl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-sdk = { workspace = true, features = ["connector-http"] }

anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
chrono.workspace = true
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-e2e = { path = "../../crates/fcp-e2e" }
wiremock.workspace = true
