[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:773c695a1b67edf39acc62386e4ee29c8029aea2f3f9e0c08aa38b24256d62a7"

[connector]
id = "fcp.github"
name = "GitHub Connector"
version = "0.1.0"
description = "FCP connector for GitHub (repos, issues, PRs, actions, releases)"
archetypes = ["operational", "streaming", "knowledge"]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = [
    "media.download",
    "github.read",
    "github.write",
    "github.admin",
    "github.search",
    "github.process_webhook",
]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."github.create_issue"]
description = "Create an issue in a repository"
capability = "github.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"
revocation_freshness = "risky"

[provides.operations."github.create_issue".input_schema]
required = ["owner", "repo", "title"]
type = "object"
[provides.operations."github.create_issue".input_schema.properties.owner]
