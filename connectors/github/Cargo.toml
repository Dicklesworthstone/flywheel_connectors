[package]
name = "fcp-github"
description = "GitHub API connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_github"
path = "src/lib.rs"

[[bin]]
name = "fcp-github"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-oauth = { path = "../../crates/fcp-oauth" }
# `connector-http` gates `transport_error_reached_service`, which client.rs
# uses to decide whether a failed request may be replayed. Without it this
# crate only compiles when some other workspace member happens to turn the
# feature on, so `cargo check -p fcp-github` alone fails.
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }

anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
percent-encoding.workspace = true
chrono.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
hex.workspace = true

[dev-dependencies]
ciborium.workspace = true
wiremock.workspace = true
futures-util.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-e2e = { path = "../../crates/fcp-e2e" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
