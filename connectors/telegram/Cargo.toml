[package]
name = "fcp-telegram"
description = "Telegram Bot API connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_telegram"
path = "src/lib.rs"

[features]
test-support = []

[[bin]]
name = "fcp-telegram"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
# `connector-http` gates `transport_error_reached_service` (see client.rs).
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }

percent-encoding.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["query"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
ciborium.workspace = true
wiremock.workspace = true
fcp-e2e = { path = "../../crates/fcp-e2e", default-features = false, features = ["telegram"] }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
toml.workspace = true
