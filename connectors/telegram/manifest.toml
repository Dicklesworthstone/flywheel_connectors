[provides.operations."telegram.ingest_webhook_update".output_schema.properties.resource_uris]
type = "array"

[provides.operations."telegram.ingest_webhook_update".output_schema.properties.reason]
type = "string"

[provides.operations."telegram.ingest_webhook_update".ai_hints]
when_to_use = "Process Telegram webhook deliveries forwarded by host ingress."
common_mistakes = [
    "Passing a decoded object instead of the raw payload string",
    "Omitting the required forwarded secret_token",
]

# --- Events ---

[provides.events."telegram.message.new"]
description = "New message received"
streaming = true
replay = false

[provides.events."telegram.message.edited"]
description = "Existing message was edited"
streaming = true
replay = false

[provides.events."telegram.channel_post.new"]
description = "New post in a channel the bot is a member of"
streaming = true
replay = false

[provides.events."telegram.channel_post.edited"]
description = "Existing channel post was edited"
streaming = true
replay = false

[provides.events."telegram.callback_query"]
description = "Callback query from an inline keyboard button press"
streaming = true
replay = false

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# --- Rate Limits ---

[[rate_limits.pools]]
id = "telegram.send"
description = "Telegram Bot API send rate limit (30 messages/sec globally, 1/sec per chat)"
requests = 1800
window_ms = 60000
burst = 30
scope = "instance"

[[rate_limits.pools]]
id = "telegram.read"
description = "Telegram Bot API read operations"
requests = 600
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "telegram.webhook"
description = "Telegram webhook management and host-forwarded ingest operations"
requests = 600
window_ms = 60000
burst = 100
scope = "instance"

[rate_limits.operation_pools]
"telegram.send_message" = ["telegram.send"]
"telegram.send_media" = ["telegram.send"]
"telegram.answer_callback_query" = ["telegram.send"]
"telegram.send_chat_action" = ["telegram.send"]
"telegram.set_message_reaction" = ["telegram.send"]
"telegram.get_file" = ["telegram.read"]
"telegram.set_webhook" = ["telegram.webhook"]
"telegram.delete_webhook" = ["telegram.webhook"]
"telegram.get_webhook_info" = ["telegram.webhook"]
"telegram.ingest_webhook_update" = ["telegram.webhook"]
