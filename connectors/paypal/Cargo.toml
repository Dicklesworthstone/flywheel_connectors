[package]
name = "fcp-paypal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP PayPal connector for Orders, Payments, and Invoices"

[[bin]]
name = "fcp-paypal"
path = "src/main.rs"

[lib]
name = "fcp_paypal"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk.workspace = true
fcp-async-core.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
# Generates the PayPal-Request-Id that makes a retried POST safe (br-kxd3e).
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
chrono.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
wiremock.workspace = true
