[package]
name = "fcp-nextcloud-talk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Nextcloud Talk connector"

[[bin]]
name = "fcp-nextcloud-talk"
path = "src/main.rs"

[lib]
name = "fcp_nextcloud_talk"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
anyhow.workspace = true
percent-encoding.workspace = true
url.workspace = true

[dev-dependencies]
toml.workspace = true
wiremock.workspace = true
fcp-crypto.workspace = true
chrono = { workspace = true, features = ["serde"] }
ciborium.workspace = true
