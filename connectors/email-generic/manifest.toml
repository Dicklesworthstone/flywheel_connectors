[format]
type = "fcp-connector-manifest"
schema_version = "2.1"

[connector]
id = "fcp.email-generic"
name = "Generic Email"
version = "0.1.0"
description = "Generic email connector covering IMAP mailbox inventory/search, bounded RFC822 inbound preview parsing, SMTP sending, and redacted inbound monitor policy configuration"
archetype = "operational"
homepage = "https://datatracker.ietf.org/doc/html/rfc3501"

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:private", "z:work"]
tailscale_tag = "tag:fcp-private"

[capabilities]
required = ["network.dns", "network.outbound"]
optional = []
forbidden = ["system.exec", "system.privileged", "network.listen"]

[event_caps]
streaming = true
replay = false
min_buffer_events = 128

[provides.events.inbound_preview]
description = "Accepted inbound email preview emitted after IMAP polling, sender policy, automated-mail suppression, UID dedupe, body bounding, attachment classification, and threading metadata shaping"
streaming = true
replay = false
topic = "email.inbound.preview"
requires_ack = false

# IMAP and SMTP hosts are operator-configured and may point at public, private,
# or tailnet infrastructure, so per-operation egress policy uses runtime-resolved
# host placeholders while still limiting each operation to the relevant mail
# protocol host and common protocol ports.

[provides.operations.health]
summary = "Report connector configuration, local health, and supervised inbound monitor policy state"
capability = "email_generic.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["status", "imap_host", "smtp_host", "manifest_hash", "monitor_policy", "inbound_monitor"], additionalProperties = false, properties = { status = { type = "string", enum = ["ok"] }, imap_host = { type = "string", minLength = 1 }, smtp_host = { type = "string", minLength = 1 }, manifest_hash = { type = "string", pattern = "^sha256:[0-9a-f]{64}$" }, monitor_policy = { type = "object", required = ["allowed_senders_configured", "allowed_senders_count", "mailbox_configured", "require_allowed_sender", "drop_automated", "allow_attachments", "poll_interval_secs", "max_body_chars", "seen_uid_cap"], additionalProperties = false, properties = { allowed_senders_configured = { type = "boolean" }, allowed_senders_count = { type = "integer", minimum = 0 }, mailbox_configured = { type = "boolean" }, require_allowed_sender = { type = "boolean" }, drop_automated = { type = "boolean" }, allow_attachments = { type = "boolean" }, poll_interval_secs = { type = "integer", minimum = 1 }, max_body_chars = { type = "integer", minimum = 1 }, seen_uid_cap = { type = "integer", minimum = 1 } } }, inbound_monitor = { type = "object", required = ["status", "streaming", "reason", "event_topic", "buffer_events", "poll_mailbox_configured", "polls_started", "polls_completed", "emitted_events", "dropped_events", "blocking_polls_cancelled", "last_error", "pre_emission_policy"], additionalProperties = false, properties = { status = { type = "string", enum = ["idle", "running", "stopping", "stopped", "error"] }, streaming = { type = "boolean", enum = [true] }, reason = { type = "string", minLength = 1 }, event_topic = { type = "string", enum = ["email.inbound.preview"] }, buffer_events = { type = "integer", minimum = 1 }, poll_mailbox_configured = { type = "boolean" }, polls_started = { type = "integer", minimum = 0 }, polls_completed = { type = "integer", minimum = 0 }, emitted_events = { type = "integer", minimum = 0 }, dropped_events = { type = "integer", minimum = 0 }, blocking_polls_cancelled = { type = "integer", minimum = 0 }, last_error = { type = ["string", "null"] }, pre_emission_policy = { type = "object", required = ["sender_allowlist", "automated_sender_suppression", "bounded_uid_cache", "body_length_bound", "attachment_classification", "thread_metadata"], additionalProperties = false, properties = { sender_allowlist = { type = "boolean" }, automated_sender_suppression = { type = "boolean" }, bounded_uid_cache = { type = "boolean" }, body_length_bound = { type = "boolean" }, attachment_classification = { type = "boolean" }, thread_metadata = { type = "boolean" } } } } } } }

[provides.operations.health.network_constraints]
host_allow = ["${email_imap_host}"]
port_allow = [143, 993]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = false
require_sni = true
spki_pins = []
deny_ip_literals = false
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations.health.ai_hints]
when_to_use = "Use this before mailbox search, bounded inbound preview, or SMTP send work to inspect the configured account and inbound monitor policy; use self-check for live IMAP reachability."
common_mistakes = [
    "Treating a green health response as proof that SMTP send permissions work; this operation primarily validates read-side connectivity and policy state.",
    "Ignoring monitor-policy warnings about allowed senders or automated mail filtering before relying on inbound events.",
]
examples = ['{"check":"imap_and_monitor_policy"}']
related = ["list_mailboxes", "search_messages"]

[provides.operations.list_mailboxes]
summary = "List IMAP mailboxes"
capability = "email_generic.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", additionalProperties = false }
output_schema = { type = "object", required = ["mailboxes"], additionalProperties = false, properties = { mailboxes = { type = "array", items = { type = "string" } } } }

[provides.operations.list_mailboxes.network_constraints]
host_allow = ["${email_imap_host}"]
port_allow = [143, 993]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = false
require_sni = true
spki_pins = []
deny_ip_literals = false
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations.list_mailboxes.ai_hints]
when_to_use = "Use this when an agent needs the exact provider mailbox names before searching messages, especially on accounts with localized or nested folders."
common_mistakes = [
    "Assuming every provider exposes an INBOX plus Sent folder with the same casing or delimiter.",
    "Searching an guessed mailbox name instead of listing folders first, which can produce empty results that look like no matching mail exists.",
]
examples = ['{"include_special_use":true}']
related = ["search_messages", "health"]

[provides.operations.search_messages]
summary = "Search IMAP messages and return matching UIDs"
capability = "email_generic.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", required = ["mailbox", "query"], additionalProperties = false, properties = { mailbox = { type = "string", minLength = 1 }, query = { type = "string", minLength = 1 } } }
output_schema = { type = "object", required = ["mailbox", "query", "uids"], additionalProperties = false, properties = { mailbox = { type = "string", minLength = 1 }, query = { type = "string", minLength = 1 }, uids = { type = "array", items = { type = "integer", minimum = 0 } } } }

[provides.operations.search_messages.network_constraints]
host_allow = ["${email_imap_host}"]
port_allow = [143, 993]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = false
require_sni = true
spki_pins = []
deny_ip_literals = false
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations.search_messages.ai_hints]
when_to_use = "Use this to find candidate email message UIDs in a known mailbox before a follow-up workflow fetches or acts on specific messages."
common_mistakes = [
    "Passing a natural-language request as the IMAP query instead of a provider-supported search expression.",
    "Forgetting that returned UIDs are mailbox-scoped and cannot be safely reused in a different folder.",
    "Logging full subjects or sender addresses from follow-up processing instead of keeping audit output redacted.",
]
examples = ['{"mailbox":"INBOX","query":"FROM \"alerts@example.com\" SINCE 01-May-2026"}']
related = ["list_mailboxes", "health"]

[provides.operations.poll_inbound_once]
summary = "Poll unseen inbound messages once"
capability = "email_generic.read"
risk = "low"
safety_tier = "safe"
idempotency = "strict"
input_schema = { type = "object", required = ["mailbox"], additionalProperties = false, properties = { mailbox = { type = "string", minLength = 1 }, cursor = { type = ["object", "null"], required = ["version", "account_fingerprint", "mailbox", "uid_validity", "last_uid"], additionalProperties = false, properties = { version = { type = "integer", enum = [1] }, account_fingerprint = { type = "string", pattern = "^[0-9a-f]{64}$", minLength = 64, maxLength = 64 }, mailbox = { type = "string", minLength = 1, maxLength = 1024 }, uid_validity = { type = "integer", minimum = 1, maximum = 4294967295 }, last_uid = { type = "integer", minimum = 0, maximum = 4294967295 } } }, seen_uids = { type = "array", items = { type = "string", minLength = 1 } } } }
output_schema = { type = "object", required = ["mailbox", "fetched_count", "accepted_count", "dropped_count", "cursor", "seen_uids", "messages"], additionalProperties = false, properties = { mailbox = { type = "string", minLength = 1 }, fetched_count = { type = "integer", minimum = 0 }, accepted_count = { type = "integer", minimum = 0 }, dropped_count = { type = "integer", minimum = 0 }, cursor = { type = ["object", "null"], required = ["version", "account_fingerprint", "mailbox", "uid_validity", "last_uid"], additionalProperties = false, properties = { version = { type = "integer", enum = [1] }, account_fingerprint = { type = "string", pattern = "^[0-9a-f]{64}$", minLength = 64, maxLength = 64 }, mailbox = { type = "string", minLength = 1, maxLength = 1024 }, uid_validity = { type = "integer", minimum = 1, maximum = 4294967295 }, last_uid = { type = "integer", minimum = 0, maximum = 4294967295 } } }, seen_uids = { type = "array", items = { type = "string", minLength = 1 } }, messages = { type = "array", items = { type = "object", required = ["uid", "decision", "tainted", "text", "attachments", "thread"], additionalProperties = false, properties = { uid = { type = "string", minLength = 1 }, decision = { type = "string", enum = ["accept", "drop_automated", "drop_sender_not_allowed"] }, tainted = { type = "boolean" }, text = { anyOf = [{ type = "object", required = ["text", "original_chars", "truncated"], additionalProperties = false, properties = { text = { type = "string" }, original_chars = { type = "integer", minimum = 0 }, truncated = { type = "boolean" } } }, { type = "null" }] }, attachments = { type = "array", items = { type = "object", required = ["filename", "media_type", "size_bytes", "class", "exposed", "reason"], additionalProperties = false, properties = { filename = { type = "string" }, media_type = { type = "string" }, size_bytes = { type = "integer", minimum = 0 }, class = { type = "string", enum = ["image", "document"] }, exposed = { type = "boolean" }, reason = { anyOf = [{ type = "string" }, { type = "null" }] } } } }, thread = { anyOf = [{ type = "object", required = ["subject", "message_id", "in_reply_to", "references", "reply_subject"], additionalProperties = false, properties = { subject = { type = "string" }, message_id = { anyOf = [{ type = "string" }, { type = "null" }] }, in_reply_to = { anyOf = [{ type = "string" }, { type = "null" }] }, references = { anyOf = [{ type = "string" }, { type = "null" }] }, reply_subject = { type = "string" } } }, { type = "null" }] } } } } } }

[provides.operations.poll_inbound_once.network_constraints]
host_allow = ["${email_imap_host}"]
port_allow = [143, 993]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = false
require_sni = true
spki_pins = []
deny_ip_literals = false
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations.poll_inbound_once.ai_hints]
when_to_use = "Use this to perform one bounded inbound mailbox check without starting a subscription; pass the returned cursor into the next call to retain account and UIDVALIDITY-bound progress. Explicit cursor:null starts a fresh scan."
common_mistakes = [
    "Treating this operation as a durable subscription or replay buffer; it is a one-shot IMAP read.",
    "Discarding the returned cursor or deriving one from legacy seen_uids; legacy UID lists have no account or epoch binding.",
    "Logging returned text, sender-derived thread data, or message IDs in shared evidence without redaction.",
]
examples = ['{"mailbox":"INBOX","cursor":null}']
related = ["search_messages", "health"]

[provides.operations.send_message]
summary = "Send an email through SMTP"
capability = "email_generic.write"
risk = "medium"
safety_tier = "risky"
idempotency = "none"
input_schema = { type = "object", required = ["to", "subject", "body"], additionalProperties = false, properties = { to = { type = "array", minItems = 1, items = { type = "string", minLength = 1 } }, cc = { type = "array", items = { type = "string", minLength = 1 } }, subject = { type = "string" }, body = { type = "string" } } }
output_schema = { type = "object", required = ["status", "to", "cc", "subject"], additionalProperties = false, properties = { status = { type = "string", enum = ["sent"] }, to = { type = "array", minItems = 1, items = { type = "string", minLength = 1 } }, cc = { type = "array", items = { type = "string", minLength = 1 } }, subject = { type = "string" } } }

[provides.operations.send_message.network_constraints]
host_allow = ["${email_smtp_host}"]
port_allow = [25, 465, 587]
ip_allow = []
cidr_deny = []
deny_localhost = false
deny_private_ranges = false
deny_tailnet_ranges = false
require_sni = true
spki_pins = []
deny_ip_literals = false
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 65536

[provides.operations.send_message.ai_hints]
when_to_use = "Use this only after the agent has explicit approval to send mail from the configured SMTP account to the requested recipients."
common_mistakes = [
    "Retrying a timed-out send without checking idempotency, which can deliver duplicate email.",
    "Omitting recipients or mixing To/Cc semantics when the task requires a specific audience.",
    "Including secrets, tokens, or unnecessary personal data in the body because SMTP delivery leaves the FCP trust boundary.",
]
examples = ['{"to":["ops@example.com"],"subject":"Deployment check complete","body":"The production check completed successfully."}']
related = ["health"]

[sandbox]
profile = "strict"
memory_mb = 96
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true
