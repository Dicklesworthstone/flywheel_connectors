[package]
name = "fcp-signal"
description = "Signal messenger connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_signal"
path = "src/lib.rs"

[[bin]]
name = "fcp-signal"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
fcp-streaming = { path = "../../crates/fcp-streaming" }

base64.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
toml.workspace = true
wiremock.workspace = true
