[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:cd03549985da67e28955bec8320cbf1eae5ea9fb1f0ef6eca6bff996c1b0bb4e"

[connector]
id = "fcp.google-people"
name = "Google People Connector"
version = "0.1.0"
description = "FCP connector for Google People/Contacts with explicit field-mask and approval semantics"
archetypes = ["operational"]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:private"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:private", "z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = [
    "people.contact_groups.read",
    "people.contacts.delete",
    "people.contacts.read",
    "people.contacts.write",
    "people.directory.read",
    "people.other_contacts.read",
    "people.profile.read",
]
forbidden = ["system.exec", "network.listen"]

# -- Sandbox -----------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 30000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[provides.operations."people.list_connections"]
description = "List the authenticated user's contacts"
capability = "people.contacts.read"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "policy"
idempotency = "strict"
[provides.operations."people.list_connections".ai_hints]
when_to_use = "Enumerate the authenticated user's contact corpus with an explicit field mask."
common_mistakes = [
  "Broad field masks widen privacy exposure; request only the fields you need.",
  "Use page_size and page_token for paging; do not assume the first page is complete.",
]
examples = ['{"person_fields":["names","emailAddresses"],"page_size":50}']
[provides.operations."people.list_connections".input_schema]
type = "object"
[provides.operations."people.list_connections".input_schema.properties.person_fields]
type = "array"
[provides.operations."people.list_connections".input_schema.properties.person_fields.items]
type = "string"
[provides.operations."people.list_connections".input_schema.properties.page_size]
type = "integer"
[provides.operations."people.list_connections".input_schema.properties.page_token]
type = "string"
[provides.operations."people.list_connections".input_schema.properties.sort_order]
type = "string"
[provides.operations."people.list_connections".output_schema]
type = "object"
[provides.operations."people.list_connections".output_schema.properties.connections]
type = "array"
[provides.operations."people.list_connections".network_constraints]
host_allow = ["people.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 4194304

