type = "string"
[provides.operations."people.get_person".output_schema]
type = "object"
[provides.operations."people.get_person".output_schema.properties.person]
type = "object"
[provides.operations."people.get_person".network_constraints]
host_allow = ["people.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
