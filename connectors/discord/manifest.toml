# -----------------------------------------------------------------------------
# Sandbox
# -----------------------------------------------------------------------------

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = []
deny_exec = true
deny_ptrace = true

# -----------------------------------------------------------------------------
# Rate Limits
# -----------------------------------------------------------------------------

[[rate_limits.pools]]
id = "discord.read"
requests = 100
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "discord.send"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "discord.edit"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "discord.delete"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[[rate_limits.pools]]
id = "discord.react"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "discord.threads"
requests = 30
window_ms = 60000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
