required = ["session_key", "event_kind", "channel_id", "message_id", "retention"]

[provides.events.message.schema.properties.fcp_delivery.properties.session_key]
description = "Opaque key to pass as delivery.inbound_event.session_key to discord.send_message"
type = "string"

[provides.events.message.schema.properties.fcp_delivery.properties.event_kind]
type = "string"
enum = ["room_event", "direct_message"]

[provides.events.message.schema.properties.fcp_delivery.properties.channel_id]
type = "string"

[provides.events.message.schema.properties.fcp_delivery.properties.guild_id]
type = ["string", "null"]

[provides.events.message.schema.properties.fcp_delivery.properties.message_id]
description = "Source Discord message ID"
type = "string"

[provides.events.message.schema.properties.fcp_delivery.properties.retention]
type = "string"
enum = ["pending_until_outbound_delivery"]

