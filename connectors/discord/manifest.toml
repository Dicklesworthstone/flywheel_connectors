[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = ["streaming"]
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:ecd10a5d0dff854137a581ba30a0f5ace71786e9df8fd35cf0127568426f95c8"

[connector]
id = "fcp.discord"
name = "Discord Connector"
version = "0.1.0"
description = "FCP connector for Discord with REST API and Gateway streaming support"
archetypes = [
    "operational",
    "streaming",
    "bidirectional",
]
format = "native"

[connector.state]
model = "singleton_writer"
state_schema_version = "2"
migration_hint = "Persists only consumed Gateway sequences in scope-bound v2 checkpoints with OS-locked lease fencing. Populated legacy received-sequence checkpoints require explicit recovery before starting a fresh session."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "discord.send",
    "discord.edit",
    "discord.delete",
    "discord.read",
    "discord.react",
    "discord.threads",
]
forbidden = [
    "system.exec",
    "network.listen",
]

# -----------------------------------------------------------------------------
# Operations
# -----------------------------------------------------------------------------

[provides.operations.send_message]
description = "Send a message to a Discord channel"
capability = "discord.send"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations.send_message.rate_limit]
max = 50
per_ms = 60000

[provides.operations.send_message.input_schema]
required = ["channel_id"]
type = "object"

[provides.operations.send_message.input_schema.properties.channel_id]
description = "Discord channel ID (snowflake)"
type = "string"
pattern = "^[0-9]+$"

[provides.operations.send_message.input_schema.properties.content]
description = "Message text content (max 2000 chars)"
type = "string"
maxLength = 2000

[provides.operations.send_message.input_schema.properties.embeds]
description = "Rich embed objects (max 10)"
type = "array"
maxItems = 10

[provides.operations.send_message.input_schema.properties.embeds.items]
type = "object"

[provides.operations.send_message.input_schema.properties.reply_to]
description = "Message ID to reply to"
type = "string"
pattern = "^[0-9]+$"

[provides.operations.send_message.input_schema.properties.delivery]
description = "Delivery-control metadata for visible/final accounting, hidden progress suppression, and inbound event correlation"
type = "object"

[provides.operations.send_message.input_schema.properties.delivery.properties.kind]
description = "Logical delivery kind"
type = "string"
enum = ["final", "progress", "tool", "block"]

[provides.operations.send_message.input_schema.properties.delivery.properties.visibility]
description = "Whether the delivery should create a provider-visible Discord message"
type = "string"
enum = ["visible", "hidden"]

[provides.operations.send_message.input_schema.properties.delivery.properties.label]
description = "Optional operator-facing label copied into the delivery receipt"
type = "string"
maxLength = 64

[provides.operations.send_message.input_schema.properties.delivery.properties.inbound_event]
description = "Optional inbound Discord event correlation retained until a matching visible outbound delivery succeeds"
type = "object"
required = ["session_key"]

[provides.operations.send_message.input_schema.properties.delivery.properties.inbound_event.properties.session_key]
description = "Opaque fcp_delivery.session_key from a prior discord.message event"
type = "string"
maxLength = 256

[provides.operations.send_message.output_schema]
required = ["id", "channel_id"]
type = "object"

[provides.operations.send_message.output_schema.properties.id]
description = "Created message ID, or null when a hidden non-final delivery is suppressed before REST"
type = ["string", "null"]

[provides.operations.send_message.output_schema.properties.channel_id]
type = "string"

[provides.operations.send_message.output_schema.properties.content]
type = ["string", "null"]

[provides.operations.send_message.output_schema.properties.coordination]
description = "Redacted chat coordination audit records"
type = "array"

[provides.operations.send_message.output_schema.properties.coordination.items]
type = "object"

[provides.operations.send_message.output_schema.properties.delivery]
description = "Redacted delivery receipt for Discord REST sends, hidden suppression, and inbound event correlation"
type = "object"

[provides.operations.send_message.output_schema.properties.delivery.properties.status]
description = "Connector delivery outcome"
type = "string"
enum = ["delivered", "suppressed"]

[provides.operations.send_message.output_schema.properties.delivery.properties.kind]
type = "string"
enum = ["final", "progress", "tool", "block"]

[provides.operations.send_message.output_schema.properties.delivery.properties.visibility]
type = "string"
enum = ["visible", "hidden"]

[provides.operations.send_message.output_schema.properties.delivery.properties.final]
type = "boolean"

[provides.operations.send_message.output_schema.properties.delivery.properties.visible]
type = "boolean"

[provides.operations.send_message.output_schema.properties.delivery.properties.message_id]
type = ["string", "null"]

[provides.operations.send_message.output_schema.properties.delivery.properties.reason]
type = "string"

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event]
description = "Receipt for an optional inbound_event session_key supplied on the send"
type = "object"

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.status]
description = "Inbound event retention outcome"
type = "string"
enum = ["pending", "target_mismatch", "marked_delivered", "not_found"]

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.session_key]
type = "string"

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.event_kind]
type = "string"
enum = ["room_event", "direct_message"]

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.channel_id]
type = "string"

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.guild_id]
type = ["string", "null"]

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.source_message_id]
type = "string"

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.delivered_message_id]
type = "string"

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.expected_channel_id]
type = "string"

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.actual_channel_id]
type = "string"

[provides.operations.send_message.output_schema.properties.delivery.properties.inbound_event.properties.reason]
type = "string"

[provides.operations.send_message.network_constraints]
host_allow = ["discord.com", "*.discord.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations.send_message.ai_hints]
when_to_use = "Send a message to a Discord channel. Use channel_id (numeric snowflake), not channel name."
common_mistakes = [
    "Using channel name instead of ID.",
    "Exceeding 2000 character message limit.",
    "Empty content without embeds.",
]
examples = [
    '{"channel_id": "123456789012345678", "content": "Hello!"}',
]
related = ["discord.edit_message", "discord.trigger_typing"]

