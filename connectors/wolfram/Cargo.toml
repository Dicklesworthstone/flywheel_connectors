[package]
name = "fcp-wolfram"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Wolfram Alpha computational knowledge connector"

[[bin]]
name = "fcp-wolfram"
path = "src/main.rs"

[lib]
name = "fcp_wolfram"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-manifest.workspace = true
fcp-sdk.workspace = true
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
chrono.workspace = true
url.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-e2e = { path = "../../crates/fcp-e2e", default-features = false }
fcp-crypto.workspace = true
fcp-testkit.workspace = true
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true

[lints]
workspace = true
