[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:6fc0650f7a2b1a061530b9e1a524313cb82431b90f061f24834d369152668256"

[connector]
id = "fcp.calendly"
name = "Calendly Connector"
version = "0.1.0"
description = "Calendly scheduling connector for user and organization scheduling surfaces"
archetypes = ["operational"]
format = "native"
status = "proven"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "One authenticated Calendly principal boundary, optional localhost test override, and retry/timeout settings per connector instance."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = []

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = []
forbidden = [
    "system.exec",
    "network.listen",
    "system.privileged",
]

[provides.operations."calendly.availability.list"]
description = "List availability schedules for a visible Calendly user."
capability = "calendly.scheduling.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"

[provides.operations."calendly.availability.list".input_schema]
type = "object"

[provides.operations."calendly.availability.list".input_schema.properties.user_uri]
type = "string"

[provides.operations."calendly.availability.list".output_schema]
required = ["collection"]
type = "object"

[provides.operations."calendly.availability.list".output_schema.properties.collection]
type = "array"

[provides.operations."calendly.availability.list".network_constraints]
host_allow = ["api.calendly.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."calendly.availability.list".ai_hints]
when_to_use = "When you need to check a user's availability schedules."
common_mistakes = []
examples = ['{"user_uri":"https://api.calendly.com/users/test-user"}']
related = ["calendly.event_types.list"]

