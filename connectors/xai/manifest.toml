[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = ["streaming"]
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:3d818ec34809f438dbf33b689ae12f73a6249593d44fb9e519aab8da16cf3565"

[connector]
id = "fcp.xai"
name = "xAI"
version = "0.1.0"
description = "xAI Grok connector using OpenAI-compatible chat/model endpoints plus Responses API web search and structured citation extraction"
archetypes = ["operational", "streaming"]
format = "native"
status = "proven"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Stores no durable state. Configuration is limited to api_key or credential_id, optional base_url, default_model, timeout, model cache TTL, and rate-limit retry policy."

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work", "z:project:*"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = ["xai.chat", "xai.models.read", "xai.responses.web_search", "xai.health.read"]
forbidden = ["system.exec", "network.listen"]

[sandbox]
profile = "strict"
memory_mb = 128
cpu_percent = 25
wall_clock_timeout_ms = 300000
deny_exec = true
deny_ptrace = true

[provides.operations."xai.chat.completions"]
description = "Create a bounded non-streaming xAI Grok chat completion through POST /v1/chat/completions. Web search is not enabled by default; use xai.responses.create for current web search support."
capability = "xai.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["messages"], properties = { model = { type = "string", default = "grok-4.3" }, messages = { type = "array", minItems = 1 }, max_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, stop = {}, response_format = { type = "object" }, tools = { type = "array" }, tool_choice = {}, reasoning_effort = { type = "string" }, search_parameters = { type = "object" }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.x.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 180000, max_response_bytes = 10485760 }

[provides.operations."xai.chat.completions".ai_hints]
when_to_use = "Use for direct Grok chat completions when web search is not needed."
common_mistakes = ["Do not log prompts, completions, reasoning text, tool-call arguments, or API keys.", "Use xai.responses.create for current web search and citation support instead of defaulting search on chat completions."]
examples = ['{"model":"grok-4.3","messages":[{"role":"user","content":"Summarize FCP in 3 bullets."}]}']
related = ["xai.chat.completions_stream", "xai.responses.create", "xai.models.list"]

[provides.operations."xai.chat.completions_stream"]
description = "Open an xAI SSE chat-completions stream and return redaction-safe chunk metadata plus assembled text."
capability = "xai.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["messages"], properties = { model = { type = "string", default = "grok-4.3" }, messages = { type = "array", minItems = 1 }, max_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, stop = {}, response_format = { type = "object" }, tools = { type = "array" }, tool_choice = {}, reasoning_effort = { type = "string" }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.x.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 300000, max_response_bytes = 10485760 }

[provides.operations."xai.chat.completions_stream".ai_hints]
when_to_use = "Use when lower first-token latency matters and the caller can consume incremental chunk metadata."
common_mistakes = ["Do not expect citation annotations from chat streams; use Responses API web_search when citation extraction is required.", "Handle finish_reason and tool_call deltas from the returned chunks."]
examples = ['{"model":"grok-4.3","messages":[{"role":"user","content":"Stream a one sentence answer."}],"max_tokens":64}']
related = ["xai.chat.completions", "xai.responses.create"]

[provides.operations."xai.responses.create"]
description = "Create an xAI Responses API web-search response through POST /v1/responses with tools=[{type=web_search}] and return structured citation annotations."
capability = "xai.responses.web_search"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
input_schema = { type = "object", required = ["input"], properties = { model = { type = "string", default = "grok-4.3" }, input = {}, instructions = { type = "string" }, include = { type = "array", items = { type = "string" } }, web_search = { type = "object", properties = { allowed_domains = { type = "array", maxItems = 5, items = { type = "string" } }, excluded_domains = { type = "array", maxItems = 5, items = { type = "string" } }, enable_image_understanding = { type = "boolean" } } }, tools = { type = "array" }, tool_choice = {}, max_output_tokens = { type = "integer", minimum = 1 }, temperature = { type = "number", minimum = 0, maximum = 2 }, top_p = { type = "number", minimum = 0, maximum = 1 }, store = { type = "boolean" }, previous_response_id = { type = "string" }, metadata = { type = "object" }, provider_extensions = { type = "object" } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.x.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 300000, max_response_bytes = 10485760 }

[provides.operations."xai.responses.create".ai_hints]
when_to_use = "Use for current xAI web search with citations, allowed/excluded domain filters, or image understanding during browsing."
common_mistakes = ["Do not combine allowed_domains and excluded_domains in the same web_search object.", "Do not log user query text, response text, API keys, or citation URL paths; log only citation hostnames and counts."]
examples = ['{"input":[{"role":"user","content":"What is xAI?"}],"web_search":{"allowed_domains":["x.ai"]},"include":["no_inline_citations"]}']
related = ["xai.chat.completions"]

[provides.operations."xai.models.list"]
description = "List xAI models from GET /v1/models using the shared model-cache path."
capability = "xai.models.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = { refresh = { type = "boolean", default = false } } }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.x.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 10000, total_timeout_ms = 30000, max_response_bytes = 10485760 }

[provides.operations."xai.models.list".ai_hints]
when_to_use = "Use to discover currently enabled xAI model IDs before sending chat, streaming, or Responses API requests."
common_mistakes = ["Do not assume every Grok model supports web search tools."]
examples = ["{}"]
related = ["xai.chat.completions", "xai.responses.create"]

[provides.operations."xai.health"]
description = "Probe xAI model listing with a short timeout and return connector health metadata."
capability = "xai.health.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
input_schema = { type = "object", properties = {} }
output_schema = { type = "object" }
network_constraints = { host_allow = ["api.x.ai"], port_allow = [443], ip_allow = [], cidr_deny = [], require_sni = true, spki_pins = [], deny_localhost = true, deny_private_ranges = true, deny_tailnet_ranges = true, deny_ip_literals = true, require_host_canonicalization = true, dns_max_ips = 16, max_redirects = 3, connect_timeout_ms = 5000, total_timeout_ms = 5000, max_response_bytes = 10485760 }

[provides.operations."xai.health".ai_hints]
when_to_use = "Use for a bounded readiness check before dispatching user-visible xAI operations."
common_mistakes = ["Do not treat degraded credential_id mode as a failed connector; host egress injection may be required."]
examples = ["{}"]
related = ["xai.models.list"]
