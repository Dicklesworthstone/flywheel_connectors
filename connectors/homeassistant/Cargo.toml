[package]
name = "fcp-homeassistant"
description = "Home Assistant connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_homeassistant"
path = "src/lib.rs"

[[bin]]
name = "fcp-homeassistant"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }
fcp-streaming = { path = "../../crates/fcp-streaming" }

anyhow.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
asupersync = { version = "=0.3.4", default-features = false, features = ["tls", "tls-native-roots"] }
fcp-testkit = { path = "../../crates/fcp-testkit" }
hex.workspace = true
sha2.workspace = true
uuid.workspace = true
wiremock.workspace = true
