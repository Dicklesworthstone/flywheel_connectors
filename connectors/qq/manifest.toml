[provides.operations."qq.health".ai_hints]
when_to_use = "Use when an operator or agent needs to verify QQ credentials, base URL wiring, gateway discovery, and manifest hash before other QQ operations."
common_mistakes = [
  "Treating health as a send or event operation is wrong; it only verifies connector readiness.",
