[provides.operations."qq.gateway.drain_events".ai_hints]
when_to_use = "Use after qq.gateway.project_event has accepted host-fed gateway frames and the host needs to dequeue authorized events for downstream fanout."
common_mistakes = [
  "Calling drain before projection returns an empty event list; use it after the host has fed gateway frames through qq.gateway.project_event.",
