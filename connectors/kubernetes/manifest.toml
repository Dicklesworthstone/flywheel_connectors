require_host_canonicalization = false
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 60000
max_response_bytes = 1048576

[provides.operations."kubernetes.delete_pod".ai_hints]
when_to_use = "Force-delete a pod to trigger rescheduling."
