[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:e90faeeadc7a5377ce77653b8e437e77916f71689d67e66186acddafcbff7a5c"

[connector]
id = "fcp.kubernetes"
name = "Kubernetes Connector"
version = "0.1.0"
description = "FCP connector for Kubernetes cluster management (pods, deployments, services, configmaps, secrets, events, logs)"
archetypes = [
    "operational",
    "streaming",
]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores watch resourceVersion cursors and event stream checkpoints per namespace."

[zones]
home = "z:infra"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
    "z:infra",
]
allowed_targets = [
    "z:infra",
    "z:work",
]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "network.tls.mtls",
    "kubernetes.admin",
    "kubernetes.read",
    "kubernetes.secrets",
    "kubernetes.write",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.download",
]

[provides.operations."kubernetes.delete_pod"]
description = "Delete a pod (force eviction)"
capability = "kubernetes.admin"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "best_effort"
revocation_freshness = "critical"

