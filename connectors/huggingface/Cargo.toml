[package]
name = "fcp-huggingface"
description = "Hugging Face inference router connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_huggingface"
path = "src/lib.rs"

[[bin]]
name = "fcp-huggingface"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-sdk = { workspace = true, features = ["connector-http"] }

anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
blake3.workspace = true
fcp-testkit = { path = "../../crates/fcp-testkit" }
wiremock.workspace = true
