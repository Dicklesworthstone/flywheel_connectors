[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:2de73f709e5548ef6fc473e0284995ab8aa1ba8b6d88fe785c5b0a3d643c2911"

[connector]
id = "fcp.google-calendar"
name = "Google Calendar Connector"
version = "0.1.0"
description = "FCP connector for Google Calendar (events, calendars, free/busy)"
archetypes = ["operational", "streaming"]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni", "storage.state"]
optional = [
    "gcal.write",
    "gcal.read",
    "gcal.delete",
]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."gcal.create_event"]
description = "Create a calendar event"
capability = "gcal.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."gcal.create_event".input_schema]
required = ["calendar_id", "summary", "start", "end"]
type = "object"
[provides.operations."gcal.create_event".input_schema.properties.calendar_id]
type = "string"
[provides.operations."gcal.create_event".input_schema.properties.summary]
type = "string"
[provides.operations."gcal.create_event".input_schema.properties.start]
type = "object"
[provides.operations."gcal.create_event".input_schema.properties.end]
type = "object"

[provides.operations."gcal.create_event".output_schema]
required = ["event"]
type = "object"
[provides.operations."gcal.create_event".output_schema.properties.event]
type = "object"

[provides.operations."gcal.create_event".network_constraints]
host_allow = ["www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gcal.create_event".ai_hints]
when_to_use = "Create a new calendar event."
common_mistakes = ["Not specifying timezone in start/end", "Using wrong calendar_id"]
examples = ['{"calendar_id": "primary", "summary": "Team standup", "start": {"dateTime": "2026-03-02T09:00:00-05:00"}, "end": {"dateTime": "2026-03-02T09:30:00-05:00"}}']
related = ["gcal.get_event", "gcal.list_events"]

