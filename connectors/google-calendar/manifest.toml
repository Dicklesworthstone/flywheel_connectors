# ── Events ──────────────────────────────────────────────────────

[event_caps]
streaming = true
replay = false
min_buffer_events = 50

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 120000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "gcal.read"
requests = 100
window_ms = 1000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "gcal.write"
requests = 60
window_ms = 1000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "gcal.delete"
requests = 60
window_ms = 1000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"gcal.create_event" = ["gcal.write"]
"gcal.get_event" = ["gcal.read"]
"gcal.update_event" = ["gcal.write"]
"gcal.delete_event" = ["gcal.delete"]
"gcal.list_events" = ["gcal.read"]
"gcal.list_calendars" = ["gcal.read"]
"gcal.freebusy" = ["gcal.read"]
"gcal.list_event_instances" = ["gcal.read"]
"gcal.quick_add" = ["gcal.write"]
"gcal.get_calendar" = ["gcal.read"]
"gcal.sync_events" = ["gcal.read"]
