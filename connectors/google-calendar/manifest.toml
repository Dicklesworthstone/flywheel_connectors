[provides.operations."gcal.update_event".input_schema.properties.location]
type = "string"
[provides.operations."gcal.update_event".input_schema.properties.start]
type = "string"
description = "New start time (RFC 3339 with an offset)"
[provides.operations."gcal.update_event".input_schema.properties.end]
type = "string"
description = "New end time (RFC 3339 with an offset)"
[provides.operations."gcal.update_event".input_schema.properties.attendees]
type = "array"
items = { type = "object" }
description = "Replace attendee list; [] removes all attendees. Omit to preserve existing attendees."

[provides.operations."gcal.update_event".output_schema]
required = ["event"]
type = "object"
[provides.operations."gcal.update_event".output_schema.properties.event]
type = "object"

[provides.operations."gcal.update_event".network_constraints]
host_allow = ["www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."gcal.update_event".ai_hints]
when_to_use = "Update specified fields of an existing calendar event while preserving omitted fields. Provide at least one change."
common_mistakes = ["Sending an empty attendees array removes all attendees; omit it to preserve them", "Updating a recurring event without specifying a single instance ID modifies all occurrences in the series"]
examples = ['{"calendar_id": "primary", "event_id": "abc123", "summary": "Updated standup"}']
related = ["gcal.get_event"]

