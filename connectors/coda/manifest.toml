[sandbox]
profile = "strict"
memory_mb = 64
cpu_percent = 25
wall_clock_timeout_ms = 30000
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "coda.read"
description = "General Coda read budget"
requests = 100
window_ms = 6000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "coda.docs.list"
description = "Coda docs listing budget"
requests = 4
window_ms = 6000
burst = 4
scope = "instance"

[[rate_limits.pools]]
id = "coda.write"
description = "General Coda write budget"
requests = 10
window_ms = 6000
burst = 4
scope = "instance"

[[rate_limits.pools]]
id = "coda.doc_content_write"
description = "Coda document content mutation budget"
requests = 5
window_ms = 10000
burst = 2
scope = "instance"

[rate_limits.operation_pools]
"coda.account.whoami" = ["coda.read"]
"coda.docs.list" = ["coda.read", "coda.docs.list"]
"coda.docs.get" = ["coda.read"]
"coda.pages.list" = ["coda.read"]
"coda.pages.get" = ["coda.read"]
"coda.tables.list" = ["coda.read"]
"coda.tables.get" = ["coda.read"]
"coda.columns.list" = ["coda.read"]
"coda.rows.list" = ["coda.read"]
"coda.rows.get" = ["coda.read"]
