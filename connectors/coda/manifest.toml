type = "object"

[provides.operations."coda.account.whoami".output_schema]
type = "object"

[provides.operations."coda.account.whoami".network_constraints]
host_allow = ["coda.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

