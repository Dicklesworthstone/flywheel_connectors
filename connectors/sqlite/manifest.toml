[provides.operations."sqlite.execute".ai_hints]
when_to_use = "Use when an agent must apply one mutating SQLite statement such as INSERT, UPDATE, DELETE, CREATE TABLE, or schema maintenance."
common_mistakes = [
    "Using sqlite.execute for SELECT statements; statements that return rows are rejected and should use sqlite.query.",
    "Trying to run ATTACH, DETACH, explicit BEGIN/COMMIT/ROLLBACK, or PRAGMA writes through sqlite.execute; those paths are intentionally blocked.",
    "Expecting idempotency for updates without a WHERE clause or unique key guard.",
]
examples = [
    '{"sql": "UPDATE tasks SET status = ? WHERE id = ?", "params": ["done", 42]}',
    '{"sql": "CREATE TABLE IF NOT EXISTS notes (id INTEGER PRIMARY KEY, title TEXT NOT NULL)", "params": []}',
]

