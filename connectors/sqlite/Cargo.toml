[package]
name = "fcp-sqlite"
description = "SQLite embedded database connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_sqlite"
path = "src/lib.rs"

[[bin]]
name = "fcp-sqlite"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }
fcp-manifest = { path = "../../crates/fcp-manifest" }

anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rusqlite = { version = "0.39.0", features = ["bundled", "column_decltype", "hooks"] }

[dev-dependencies]
fcp-testkit.workspace = true
tempfile = "3.15"
toml.workspace = true
