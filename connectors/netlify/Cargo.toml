[package]
name = "fcp-netlify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Netlify connector for Sites, Deploys, DNS, and Environment Variables"

[[bin]]
name = "fcp-netlify"
path = "src/main.rs"

[lib]
name = "fcp_netlify"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-manifest.workspace = true
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
chrono.workspace = true
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true

[lints]
workspace = true
