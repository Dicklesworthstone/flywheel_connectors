[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:2fa409d699f31c35749739a3bc4ed83fcad49604f7ab0ea7c7739d947c0bb32c"

[connector]
id = "fcp.netlify"
name = "Netlify"
version = "0.1.0"
description = "Netlify connector for sites, deploys, DNS zones, environment variables, and API-token verification"
archetypes = ["operational"]
format = "native"
status = "ready"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; one Netlify personal access token is injected at runtime."

[zones]
home = "z:work"
allowed_sources = ["z:work", "z:private"]
allowed_targets = ["z:work"]
forbidden = ["z:public", "z:community"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "netlify.sites.read",
    "netlify.sites.write",
    "netlify.deploys.read",
    "netlify.deploys.write",
    "netlify.dns.read",
    "netlify.env.read",
    "netlify.env.write",
]
forbidden = [
    "system.exec",
    "network.listen",
    "system.privileged",
]

[provides.operations."netlify.sites.list"]
description = "List all sites"
capability = "netlify.sites.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
