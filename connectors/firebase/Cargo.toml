[package]
name = "fcp-firebase"
description = "Firebase Firestore and Realtime Database connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_firebase"
path = "src/lib.rs"

[[bin]]
name = "fcp-firebase"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
fcp-google-discovery = { path = "../../crates/fcp-google-discovery" }

anyhow.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
fcp-testkit.workspace = true
wiremock.workspace = true
