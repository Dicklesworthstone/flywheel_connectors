[package]
name = "fcp-cloudflare"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Cloudflare connector for Workers, Pages, DNS, KV, and Zones"

[[bin]]
name = "fcp-cloudflare"
path = "src/main.rs"

[lib]
name = "fcp_cloudflare"
path = "src/lib.rs"

[dependencies]
chrono.workspace = true
fcp-core.workspace = true
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
wiremock.workspace = true
