[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:8cea1db3ef8a3b1891d2ae910a23412fd21452d2317e1da2f1c0850b852c2eac"

[connector]
id = "fcp.cloudflare"
name = "Cloudflare Connector"
version = "0.1.0"
description = "FCP connector for Cloudflare Zones, DNS, Workers, Pages, and Workers KV operations"
archetypes = [
    "operational",
    "storage",
]
format = "native"
status = "ready"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "No durable connector state; configuration and HTTP runtime live only inside the current connector instance."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "cloudflare.zones.read",
    "cloudflare.dns.read",
    "cloudflare.dns.write",
    "cloudflare.workers.read",
    "cloudflare.workers.write",
    "cloudflare.pages.read",
    "cloudflare.pages.write",
    "cloudflare.kv.read",
    "cloudflare.kv.write",
]
forbidden = [
    "system.exec",
    "network.listen",
    "system.privileged",
]

