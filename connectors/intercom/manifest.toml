[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:de759a7f23b3f0726e5cbe26dc44041c857c834e7ccda31b20873c99f2b898f9"

[connector]
id = "fcp.intercom"
name = "Intercom Connector"
version = "0.1.0"
description = "FCP connector for Intercom customer messaging (contacts, conversations, messages, tags)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"
status = "ready"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores access token and pagination cursors."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "intercom.contacts.write",
    "intercom.contacts.read",
    "intercom.contacts.delete",
    "intercom.conversations.read",
    "intercom.conversations.write",
    "intercom.tags.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."intercom.contacts.create"]
description = "Create a contact (lead or user)"
capability = "intercom.contacts.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"
revocation_freshness = "safe"

[provides.operations."intercom.contacts.create".rate_limit]
max = 100
per_ms = 60000
burst = 15
pool_name = "intercom.contacts.write"

[provides.operations."intercom.contacts.create".input_schema]
required = ["role"]
type = "object"

[provides.operations."intercom.contacts.create".input_schema.properties.email]
type = "string"

[provides.operations."intercom.contacts.create".input_schema.properties.name]
type = "string"

[provides.operations."intercom.contacts.create".input_schema.properties.role]
description = "lead or user"
type = "string"

[provides.operations."intercom.contacts.create".output_schema]
required = ["id"]
type = "object"

[provides.operations."intercom.contacts.create".output_schema.properties.id]
type = "string"

[provides.operations."intercom.contacts.create".network_constraints]
host_allow = ["api.intercom.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."intercom.contacts.create".ai_hints]
when_to_use = "Create a new contact."
common_mistakes = [
    "Not specifying the role field — Intercom requires 'lead' or 'user' and they have different lifecycle behaviors.",
    "Creating duplicate contacts by not checking for an existing contact with the same email first.",
]
examples = ['{"role": "user", "email": "alice@example.com", "name": "Alice Smith"}']
related = [
    "intercom.contacts.list",
    "intercom.contacts.delete",
]

[provides.operations."intercom.contacts.delete"]
description = "Delete a contact"
capability = "intercom.contacts.delete"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."intercom.contacts.delete".rate_limit]
max = 100
per_ms = 60000
burst = 15
pool_name = "intercom.contacts.delete"

[provides.operations."intercom.contacts.delete".input_schema]
required = ["contact_id"]
type = "object"

[provides.operations."intercom.contacts.delete".input_schema.properties.contact_id]
type = "string"

[provides.operations."intercom.contacts.delete".output_schema]
type = "object"

[provides.operations."intercom.contacts.delete".network_constraints]
host_allow = ["api.intercom.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."intercom.contacts.delete".ai_hints]
when_to_use = "Delete a contact. Cannot be undone."
common_mistakes = [
    "Using an external_id or email instead of the Intercom-assigned contact_id.",
    "Deleting a contact with open conversations — their conversation history will become orphaned.",
]
examples = ['{"contact_id": "abc123"}']
related = ["intercom.contacts.list"]

[provides.operations."intercom.contacts.list"]
description = "List or search contacts"
capability = "intercom.contacts.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."intercom.contacts.list".rate_limit]
max = 500
per_ms = 60000
burst = 50
pool_name = "intercom.contacts.read"

[provides.operations."intercom.contacts.list".input_schema]
required = []
type = "object"

[provides.operations."intercom.contacts.list".input_schema.properties.per_page]
maximum = 150
type = "integer"

[provides.operations."intercom.contacts.list".input_schema.properties.starting_after]
description = "Cursor for the next page of results"
type = "string"

[provides.operations."intercom.contacts.list".input_schema.properties.query]
description = "Search query object"
type = "object"

[provides.operations."intercom.contacts.list".output_schema]
required = ["data"]
type = "object"

[provides.operations."intercom.contacts.list".output_schema.properties.data]
type = "array"

[provides.operations."intercom.contacts.list".network_constraints]
host_allow = ["api.intercom.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."intercom.contacts.list".ai_hints]
when_to_use = "List or search Intercom contacts."
common_mistakes = [
    "Not using cursor-based pagination for large contact lists — the default page size is 50 and max is 150.",
    "Constructing search query objects incorrectly — the Intercom search syntax requires field/operator/value triples.",
]
examples = ['{"per_page": 50}']
related = [
    "intercom.contacts.create",
    "intercom.conversations.list",
]

[provides.operations."intercom.conversations.list"]
description = "List conversations"
capability = "intercom.conversations.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."intercom.conversations.list".rate_limit]
max = 500
per_ms = 60000
burst = 50
pool_name = "intercom.conversations.read"

[provides.operations."intercom.conversations.list".input_schema]
required = []
type = "object"

[provides.operations."intercom.conversations.list".input_schema.properties.per_page]
maximum = 150
type = "integer"

[provides.operations."intercom.conversations.list".output_schema]
required = ["conversations"]
type = "object"

[provides.operations."intercom.conversations.list".output_schema.properties.conversations]
type = "array"

[provides.operations."intercom.conversations.list".network_constraints]
host_allow = ["api.intercom.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."intercom.conversations.list".ai_hints]
when_to_use = "List conversations."
common_mistakes = [
    "Expecting conversation body/messages in the list response — only metadata is returned; use a separate fetch for full conversation parts.",
    "Not handling pagination — large workspaces may have thousands of conversations.",
]
examples = ['{"per_page": 50}']
related = ["intercom.conversations.reply"]

[provides.operations."intercom.conversations.reply"]
description = "Reply to a conversation"
capability = "intercom.conversations.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"
revocation_freshness = "safe"

[provides.operations."intercom.conversations.reply".rate_limit]
max = 100
per_ms = 60000
burst = 15
pool_name = "intercom.conversations.write"

[provides.operations."intercom.conversations.reply".input_schema]
required = [
    "conversation_id",
    "body",
    "message_type",
]
type = "object"

[provides.operations."intercom.conversations.reply".input_schema.properties.body]
type = "string"

[provides.operations."intercom.conversations.reply".input_schema.properties.conversation_id]
type = "string"

[provides.operations."intercom.conversations.reply".input_schema.properties.message_type]
description = "comment or note"
type = "string"

[provides.operations."intercom.conversations.reply".output_schema]
required = ["id"]
type = "object"

[provides.operations."intercom.conversations.reply".output_schema.properties.id]
type = "string"

[provides.operations."intercom.conversations.reply".network_constraints]
host_allow = ["api.intercom.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."intercom.conversations.reply".ai_hints]
when_to_use = "Reply to an existing conversation."
common_mistakes = [
    "Using message_type 'note' when intending to send a customer-visible reply — notes are internal-only.",
    "Replying to a closed or snoozed conversation without reopening it first, which silently fails.",
]
examples = ['{"conversation_id": "abc123", "body": "Thanks for reaching out!", "message_type": "comment"}']
related = ["intercom.conversations.list"]

[provides.operations."intercom.tags.list"]
description = "List tags"
capability = "intercom.tags.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"
revocation_freshness = "safe"

[provides.operations."intercom.tags.list".rate_limit]
max = 100
per_ms = 60000
burst = 10
pool_name = "intercom.tags.read"

[provides.operations."intercom.tags.list".input_schema]
required = []
type = "object"

[provides.operations."intercom.tags.list".output_schema]
required = ["data"]
type = "object"

[provides.operations."intercom.tags.list".output_schema.properties.data]
type = "array"

[provides.operations."intercom.tags.list".network_constraints]
host_allow = ["api.intercom.io"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."intercom.tags.list".ai_hints]
when_to_use = "List available tags."
common_mistakes = ["Assuming tag names are unique — Intercom allows duplicate tag names; always use the tag ID for subsequent operations."]
examples = ["{}"]
related = ["intercom.contacts.list"]

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "intercom.contacts.read"
requests = 500
window_ms = 60000
burst = 50
scope = "instance"

[[rate_limits.pools]]
id = "intercom.contacts.write"
requests = 100
window_ms = 60000
burst = 15
scope = "instance"

[[rate_limits.pools]]
id = "intercom.contacts.delete"
requests = 100
window_ms = 60000
burst = 15
scope = "instance"

[[rate_limits.pools]]
id = "intercom.conversations.read"
requests = 500
window_ms = 60000
burst = 50
scope = "instance"

[[rate_limits.pools]]
id = "intercom.conversations.write"
requests = 100
window_ms = 60000
burst = 15
scope = "instance"

[[rate_limits.pools]]
id = "intercom.tags.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"intercom.conversations.list" = ["intercom.conversations.read"]
"intercom.contacts.delete" = ["intercom.contacts.delete"]
"intercom.conversations.reply" = ["intercom.conversations.write"]
"intercom.contacts.create" = ["intercom.contacts.write"]
"intercom.tags.list" = ["intercom.tags.read"]
"intercom.contacts.list" = ["intercom.contacts.read"]
