[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:a9fc858e7558691b35ade5a4cf440778b9b77bb31c7200f29c4de50ce6f1a9d7"

[connector]
id = "fcp.stripe"
name = "Stripe Connector"
version = "0.1.0"
description = "FCP connector for Stripe (payments, customers, subscriptions, invoices, refunds)"
archetypes = [
    "operational",
    "streaming",
]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:private"
allowed_sources = [
    "z:owner",
    "z:private",
]
allowed_targets = ["z:private"]
forbidden = [
    "z:public",
    "z:work",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "stripe.write",
    "stripe.read",
    "stripe.payment",
    "stripe.webhook",
]
forbidden = [
    "system.exec",
    "network.listen",
]

