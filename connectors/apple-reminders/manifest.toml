[provides.operations."apple_reminders.list_reminders".output_schema.properties.reminders.items.properties.id]
type = "string"

[provides.operations."apple_reminders.list_reminders".output_schema.properties.reminders.items.properties.title]
type = "string"

[provides.operations."apple_reminders.list_reminders".output_schema.properties.reminders.items.properties.list]
type = "string"

[provides.operations."apple_reminders.list_reminders".output_schema.properties.reminders.items.properties.completed]
