[provides.operations."apple_reminders.list_reminders".output_schema.properties.reminders.items.properties.due]
type = "string"

[provides.operations."apple_reminders.create_reminder"]
description = "Create a reminder"
capability = "apple_reminders.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."apple_reminders.create_reminder".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
