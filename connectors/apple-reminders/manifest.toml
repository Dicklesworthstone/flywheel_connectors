port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 65536

[provides.operations."apple_reminders.complete_reminder".ai_hints]
when_to_use = "Use this after listing reminders and selecting the exact reminder identifier that the user wants marked complete."
common_mistakes = [
    "Completing by title text instead of the stable reminder_id returned from list_reminders.",
    "Reusing a reminder_id from another account, host, or stale list snapshot.",
    "Skipping confirmation when multiple reminders have similar titles.",
]
