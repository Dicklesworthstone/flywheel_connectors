connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 65536

[provides.operations."apple_reminders.create_reminder".ai_hints]
when_to_use = "Use this only after the user asks the agent to add a specific reminder to the local macOS Reminders app."
common_mistakes = [
    "Creating duplicate reminders after a retry because this operation is not idempotent.",
    "Putting sensitive task details into the reminder title without confirming they belong in the user-visible Reminders app.",
    "Assuming macOS automation permission has already been granted; first use may require user approval.",
]
examples = ['{"title":"Review deployment notes","list_name":"Work"}']
related = ["apple_reminders.list_lists", "apple_reminders.list_reminders"]

[provides.operations."apple_reminders.create_reminder".input_schema]
