[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:e8964d7b0a349020cb296fadf90ecbadabefdc11ad3ae207b818d24eb0e9edb1"

[connector]
id = "fcp.apple-reminders"
name = "Apple Reminders"
version = "0.1.0"
description = "macOS-local Apple Reminders connector for list inventory, reminder inventory, reminder creation, and completion"
archetypes = ["knowledge", "operational"]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "Apple Reminders state remains inside the macOS Reminders app; the connector keeps no durable local state."

[zones]
home = "z:owner"
allowed_sources = ["z:owner", "z:private"]
allowed_targets = ["z:owner", "z:private"]
forbidden = ["z:public", "z:community", "z:work"]

[capabilities]
required = ["apple_reminders.read", "apple_reminders.write"]
optional = []
# Raw ambient exec remains forbidden; the connector runtime only launches a
# validated absolute osascript binary with static AppleScript and argv payloads.
forbidden = ["network.listen", "network.outbound", "system.exec", "system.privileged"]

[provides.operations."apple_reminders.health"]
description = "Report Apple Reminders connector health and platform support"
capability = "apple_reminders.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_reminders.health".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 65536

[provides.operations."apple_reminders.health".ai_hints]
when_to_use = "Use this before any Apple Reminders read or write operation to confirm the host is macOS and the connector is configured."
common_mistakes = [
    "Treating a passing health check as proof that the user has already granted Reminders automation permission; macOS can still prompt on first write.",
    "Running this on non-macOS hosts and interpreting the unsupported-platform response as a connector outage.",
]
examples = ['{"check":"platform_and_configuration"}']
related = ["apple_reminders.list_lists", "apple_reminders.list_reminders"]

[provides.operations."apple_reminders.health".input_schema]
type = "object"
properties = {}

[provides.operations."apple_reminders.health".output_schema]
type = "object"

[provides.operations."apple_reminders.health".output_schema.properties.status]
type = "string"

[provides.operations."apple_reminders.health".output_schema.properties.platform]
type = "string"

[provides.operations."apple_reminders.health".output_schema.properties.manifest_hash]
type = "string"

[provides.operations."apple_reminders.list_lists"]
description = "List reminder lists"
capability = "apple_reminders.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_reminders.list_lists".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 65536

[provides.operations."apple_reminders.list_lists".ai_hints]
when_to_use = "Use this when an agent needs the exact reminder-list names before listing or creating reminders."
common_mistakes = [
    "Assuming default list names such as Reminders or Work exist on every account.",
    "Creating a reminder in a guessed list instead of listing available lists first.",
]
examples = ['{}']
related = ["apple_reminders.list_reminders", "apple_reminders.create_reminder"]

[provides.operations."apple_reminders.list_lists".input_schema]
type = "object"
properties = {}

[provides.operations."apple_reminders.list_lists".output_schema]
type = "object"

[provides.operations."apple_reminders.list_lists".output_schema.properties.lists]
type = "array"

[provides.operations."apple_reminders.list_lists".output_schema.properties.lists.items]
type = "object"

[provides.operations."apple_reminders.list_lists".output_schema.properties.lists.items.properties.id]
type = "string"

[provides.operations."apple_reminders.list_lists".output_schema.properties.lists.items.properties.name]
type = "string"

[provides.operations."apple_reminders.list_reminders"]
description = "List reminders in a list or across all lists"
capability = "apple_reminders.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."apple_reminders.list_reminders".network_constraints]
host_allow = ["none.invalid"]
port_allow = [0]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = false
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 0
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 65536

[provides.operations."apple_reminders.list_reminders".ai_hints]
when_to_use = "Use this to inspect open reminder inventory in a known list or across all lists before deciding what to create or complete."
common_mistakes = [
    "Passing a display list name that was not returned by list_lists; macOS list names are user-controlled.",
    "Treating returned reminder identifiers as portable across devices or accounts.",
]
examples = ['{"list_name":"Work"}']
related = ["apple_reminders.list_lists", "apple_reminders.complete_reminder"]

[provides.operations."apple_reminders.list_reminders".input_schema]
