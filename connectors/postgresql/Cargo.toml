[package]
name = "fcp-postgresql"
description = "PostgreSQL connector for the Flywheel Connector Protocol (Supabase/PostgREST-compatible)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_postgresql"
path = "src/lib.rs"

[[bin]]
name = "fcp-postgresql"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
async-trait.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Integration-testcontainer deps — only pulled in when the
# `integration-testcontainer` feature is enabled. Kept in
# `[dependencies]` (not `[dev-dependencies]`) because Cargo disallows
# `optional = true` on dev-dependencies; they are feature-gated so
# default builds stay offline-friendly and docker-less.
testcontainers = { version = "0.23", optional = true }
tokio = { workspace = true, optional = true }
tokio-postgres = { version = "0.7", optional = true }
axum = { version = "0.8", optional = true }

[dev-dependencies]
fcp-testkit.workspace = true
wiremock.workspace = true

[features]
default = []
# Enable real-Postgres testcontainer integration tests. Requires a
# running Docker daemon. See tests/transaction_integration.rs.
integration-testcontainer = ["dep:testcontainers", "dep:tokio", "dep:tokio-postgres", "dep:axum"]
