# ---------- Sandbox ----------

[sandbox]
profile = "strict"
memory_mb = 512
cpu_percent = 75
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ---------- Rate Limits ----------

[[rate_limits.pools]]
id = "pg.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "pg.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[rate_limits.operation_pools]
"pg.query" = ["pg.read"]
"pg.explain" = ["pg.read"]
"pg.schema.tables" = ["pg.read"]
"pg.schema.columns" = ["pg.read"]
"pg.schema.indexes" = ["pg.read"]
"pg.health" = ["pg.read"]
"pg.execute" = ["pg.write"]
"pg.transaction.begin" = ["pg.write"]
"pg.transaction.commit" = ["pg.write"]
"pg.transaction.rollback" = ["pg.write"]
"pg.batch" = ["pg.write"]
"pg.prepared" = ["pg.write"]
