[package]
name = "fcp-azure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Azure connector for subscriptions, resource groups, blob storage, and Key Vault"

[[bin]]
name = "fcp-azure"
path = "src/main.rs"

[lib]
name = "fcp_azure"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk.workspace = true
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
percent-encoding.workspace = true
quick-xml = { version = "0.39.2", features = ["serialize"] }

[dev-dependencies]
ciborium.workspace = true
chrono.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
serde_urlencoded = "0.7"
wiremock.workspace = true

[lints]
workspace = true
