[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:13a8da0d12b5288e56e7271cc2f0fd3948afeb61918069e5ce7567dbd4f93bc7"

[connector]
id = "fcp.asana"
name = "Asana Connector"
version = "0.1.0"
description = "FCP connector for Asana project management (workspaces, projects, tasks)"
archetypes = [
    "knowledge",
    "operational",
]
format = "wasi"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores personal access token."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
]
optional = [
    "asana.projects.read",
    "asana.tasks.write",
    "asana.tasks.delete",
    "asana.tasks.read",
    "asana.workspaces.read",
    "asana.sections.read",
]
forbidden = [
    "system.exec",
    "network.listen",
    "media.upload",
    "media.download",
]

[provides.operations."asana.projects.list"]
description = "List projects in a workspace"
capability = "asana.projects.read"
risk_level = "low"
safety_tier = "safe"
requires_approval = "none"
idempotency = "strict"

[provides.operations."asana.projects.list".input_schema]
required = ["workspace_gid"]
type = "object"

[provides.operations."asana.projects.list".input_schema.properties.workspace_gid]
description = "Workspace GID"
type = "string"

[provides.operations."asana.projects.list".output_schema]
required = ["data"]
type = "object"

[provides.operations."asana.projects.list".output_schema.properties.data]
type = "array"

[provides.operations."asana.projects.list".network_constraints]
host_allow = ["app.asana.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 10485760

[provides.operations."asana.projects.list".ai_hints]
when_to_use = "List projects in an Asana workspace."
common_mistakes = ["Passing a project GID instead of a workspace GID; the workspace_gid parameter must be the workspace's numeric GID, not a project identifier."]
examples = ['{"workspace_gid": "1234567890"}']
related = [
    "asana.workspaces.list",
    "asana.tasks.list",
]

[provides.operations."asana.tasks.create"]
description = "Create a task"
capability = "asana.tasks.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"

[provides.operations."asana.tasks.create".input_schema]
required = [
    "workspace",
    "name",
]
type = "object"

[provides.operations."asana.tasks.create".input_schema.properties.name]
type = "string"

[provides.operations."asana.tasks.create".input_schema.properties.notes]
type = "string"

[provides.operations."asana.tasks.create".input_schema.properties.workspace]
type = "string"

[provides.operations."asana.tasks.create".output_schema]
required = ["data"]
type = "object"

[provides.operations."asana.tasks.create".output_schema.properties.data]
type = "object"

[provides.operations."asana.tasks.create".network_constraints]
host_allow = ["app.asana.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 3
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."asana.tasks.create".ai_hints]
when_to_use = "Create a new task."
common_mistakes = ["Creating a task with only workspace and name places it in no project; add a projects or memberships field to assign it to a specific project."]
examples = ['{"workspace": "1234567890", "name": "Fix login timeout", "notes": "Users report 30s timeouts"}']
related = [
    "asana.tasks.list",
    "asana.tasks.delete",
]

[provides.operations."asana.tasks.update"]
description = "Update an existing task"
capability = "asana.tasks.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
