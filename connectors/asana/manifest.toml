[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 300000
fs_readonly_paths = [
    "/usr",
    "/lib",
]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

[[rate_limits.pools]]
id = "asana.workspaces.read"
requests = 100
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "asana.projects.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "asana.tasks.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[[rate_limits.pools]]
id = "asana.tasks.write"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "asana.tasks.delete"
requests = 50
window_ms = 60000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "asana.sections.read"
requests = 200
window_ms = 60000
burst = 20
scope = "instance"

[rate_limits.operation_pools]
"asana.tasks.list" = ["asana.tasks.read"]
"asana.workspaces.list" = ["asana.workspaces.read"]
"asana.tasks.create" = ["asana.tasks.write"]
"asana.tasks.update" = ["asana.tasks.write"]
"asana.tasks.delete" = ["asana.tasks.delete"]
"asana.projects.list" = ["asana.projects.read"]
"asana.projects.get" = ["asana.projects.read"]
"asana.tasks.get" = ["asana.tasks.read"]
"asana.sections.list" = ["asana.sections.read"]
"asana.tasks.search" = ["asana.tasks.read"]
