[provides.operations."youtube.upload_video".input_schema]
required = ["title", "description", "video_data_base64"]
type = "object"
[provides.operations."youtube.upload_video".input_schema.properties.title]
type = "string"
minLength = 1
maxLength = 100
[provides.operations."youtube.upload_video".input_schema.properties.description]
type = "string"
description = "Video description, at most 5000 UTF-8 bytes"
[provides.operations."youtube.upload_video".input_schema.properties.video_data_base64]
type = "string"
minLength = 4
maxLength = 22369624
description = "Canonical standard padded base64 for 1 byte to 16 MiB of video data"
[provides.operations."youtube.upload_video".input_schema.properties.privacy]
type = "string"
enum = ["private", "unlisted", "public"]
[provides.operations."youtube.upload_video".input_schema.properties.tags]
type = "array"
maxItems = 100
[provides.operations."youtube.upload_video".input_schema.properties.tags.items]
type = "string"
minLength = 1
[provides.operations."youtube.upload_video".input_schema.properties.category_id]
type = "string"
pattern = "^[0-9]{1,64}$"

[provides.operations."youtube.upload_video".output_schema]
required = ["videoId", "title", "privacyStatus", "uploadStatus"]
type = "object"
[provides.operations."youtube.upload_video".output_schema.properties.videoId]
type = "string"
[provides.operations."youtube.upload_video".output_schema.properties.title]
type = "string"
[provides.operations."youtube.upload_video".output_schema.properties.privacyStatus]
type = "string"
[provides.operations."youtube.upload_video".output_schema.properties.uploadStatus]
type = "string"

[provides.operations."youtube.upload_video".network_constraints]
host_allow = ["www.googleapis.com", "upload.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 600000
max_response_bytes = 10485760

[provides.operations."youtube.upload_video".ai_hints]
when_to_use = "Publish a new video to the authenticated YouTube channel."
common_mistakes = ["Video uploads require user-authorized OAuth and interactive approval", "video_data_base64 must decode to 1 byte through 16 MiB", "Inspect the channel before resubmitting an unknown upload outcome"]
examples = ['{"title": "Launch demo", "description": "Demo video", "video_data_base64": "<base64 mp4>", "privacy": "private"}']
related = ["youtube.get_video", "youtube.get_analytics"]

# ────────────────────────────────────────────────────────────────

# ── Sandbox ─────────────────────────────────────────────────────

[sandbox]
profile = "strict"
memory_mb = 256
cpu_percent = 50
wall_clock_timeout_ms = 660000
fs_readonly_paths = ["/usr", "/lib"]
fs_writable_paths = ["$CONNECTOR_STATE"]
deny_exec = true
deny_ptrace = true

# ── Rate Limits ─────────────────────────────────────────────────

[[rate_limits.pools]]
id = "youtube.read"
requests = 100
window_ms = 1000
burst = 10
scope = "instance"

[[rate_limits.pools]]
id = "youtube.write"
requests = 50
window_ms = 1000
burst = 5
scope = "instance"

[rate_limits.operation_pools]
"youtube.search" = ["youtube.read"]
"youtube.get_video" = ["youtube.read"]
"youtube.list_videos" = ["youtube.read"]
"youtube.get_channel" = ["youtube.read"]
"youtube.list_playlists" = ["youtube.read"]
"youtube.list_playlist_items" = ["youtube.read"]
"youtube.list_comments" = ["youtube.read"]
"youtube.post_comment" = ["youtube.write"]
"youtube.get_captions" = ["youtube.read"]
"youtube.get_caption_transcript" = ["youtube.read"]
"youtube.get_transcript" = ["youtube.read"]
"youtube.upload_caption" = ["youtube.write"]
"youtube.get_analytics" = ["youtube.read"]
"youtube.upload_video" = ["youtube.write"]
