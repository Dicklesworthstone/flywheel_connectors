[provides.operations."youtube.upload_caption"]
description = "Upload a UTF-8 timed caption file as a new video caption track (OAuth required, up to 5 MiB)"
capability = "youtube.write"
risk_level = "high"
safety_tier = "dangerous"
requires_approval = "interactive"
idempotency = "none"

[provides.operations."youtube.upload_caption".input_schema]
required = ["video_id", "language", "transcript"]
type = "object"
[provides.operations."youtube.upload_caption".input_schema.properties.video_id]
type = "string"
minLength = 1
maxLength = 128
pattern = "^[A-Za-z0-9_-]+$"
[provides.operations."youtube.upload_caption".input_schema.properties.language]
type = "string"
minLength = 1
maxLength = 255
pattern = "^[A-Za-z]{1,8}(-[A-Za-z0-9]{1,8})*$"
[provides.operations."youtube.upload_caption".input_schema.properties.transcript]
type = "string"
minLength = 1
maxLength = 5242880
description = "UTF-8 contents of a supported timed caption file, such as SRT or WebVTT; at most 5 MiB of bytes. No automatic synchronization."
[provides.operations."youtube.upload_caption".input_schema.properties.name]
type = "string"
maxLength = 150
default = "Uploaded transcript"

[provides.operations."youtube.upload_caption".output_schema]
required = ["caption"]
type = "object"
[provides.operations."youtube.upload_caption".output_schema.properties.caption]
type = "object"

[provides.operations."youtube.upload_caption".network_constraints]
host_allow = ["www.googleapis.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 120000
max_response_bytes = 5242880

[provides.operations."youtube.upload_caption".ai_hints]
when_to_use = "Create a new timed caption track on a video with user-authorized OAuth."
common_mistakes = ["Caption uploads are dangerous side effects and require approval", "Use youtube.force-ssl or youtubepartner scope; youtube.upload alone does not authorize captions", "Supply a timed caption file, not an untimed transcript; this operation inserts a new track and does not replace one"]
examples = ['{"video_id": "dQw4w9WgXcQ", "language": "en", "transcript": "1\n00:00:00,000 --> 00:00:01,000\nHello\n", "name": "English"}']
related = ["youtube.get_caption_transcript", "youtube.get_captions"]

