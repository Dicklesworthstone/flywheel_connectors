[package]
name = "fcp-imessage"
description = "iMessage connector via BlueBubbles REST API for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_imessage"
path = "src/lib.rs"

[[bin]]
name = "fcp-imessage"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
fcp-webhook.workspace = true

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
subtle.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true
