[package]
name = "fcp-whatsapp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP WhatsApp Business API connector"

[[bin]]
name = "fcp-whatsapp"
path = "src/main.rs"

[lib]
name = "fcp_whatsapp"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
fcp-webhook.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
hmac.workspace = true
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
ciborium.workspace = true
chrono.workspace = true
fcp-e2e = { path = "../../crates/fcp-e2e" }
fcp-crypto.workspace = true
fcp-testkit.workspace = true
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true

[lints]
workspace = true
