[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:381ffe6ff8fb60ead8f442188b1ec435c31bdffdccf2935ad54f655717aa8f92"

[connector]
id = "fcp.feishu"
name = "Feishu/Lark"
version = "0.1.0"
description = "Tenant-scoped Feishu/Lark connector for bot messaging, chat discovery, directory reads, known docs and sheets reads, calendar reads, host-forwarded webhook ingestion, document-comment automation, and connectivity verification"
archetypes = ["operational"]
format = "native"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "2"
migration_hint = "One connector instance binds to one installed Feishu/Lark tenant app via runtime-injected app_id, app_secret, base_url, retry, request_timeout_ms, optional webhook_state.dedupe_state_path, and optional webhook_ingress host-forwarded request-region settings."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = [
    "z:community",
    "z:public",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "feishu.messages.write",
    "feishu.messages.read",
    "feishu.chats.read",
    "feishu.users.read",
    "feishu.docs.read",
    "feishu.calendar.read",
    "feishu.webhook.ingest",
    "feishu.comments.read",
    "feishu.comments.write",
]
forbidden = [
    "system.exec",
    "system.privileged",
    "network.listen",
]

