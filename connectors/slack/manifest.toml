[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:465bcd3768e237219ee05f9bfeb616589fd0ba695399a70fdb3c27f85de231ff"

[connector]
id = "fcp.slack"
name = "Slack Connector"
version = "0.1.0"
description = "FCP connector for Slack (channels, messages, users, files, reactions, policy-gated Socket Mode events)"
archetypes = ["operational", "streaming", "bidirectional"]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "socket-mode monitor policy defaults to bot-mention gating for public channel messages"

[zones]
home = "z:work"
allowed_sources = ["z:owner", "z:private", "z:work"]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = [
    "media.download",
    "media.upload",
    "slack.read",
    "slack.write",
    "slack.files.read",
    "slack.files.write",
]
forbidden = ["system.exec", "network.listen"]

# ── Operations ──────────────────────────────────────────────────

[provides.operations."slack.post_message"]
description = "Post a message to a Slack channel"
capability = "slack.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "policy"
idempotency = "none"
revocation_freshness = "risky"

[provides.operations."slack.post_message".input_schema]
required = ["channel", "text"]
type = "object"
[provides.operations."slack.post_message".input_schema.properties.channel]
type = "string"
[provides.operations."slack.post_message".input_schema.properties.text]
type = "string"

[provides.operations."slack.post_message".output_schema]
required = ["message"]
type = "object"
[provides.operations."slack.post_message".output_schema.properties.message]
type = "object"
[provides.operations."slack.post_message".output_schema.properties.coordination]
description = "Redacted chat coordination audit records"
type = "array"
[provides.operations."slack.post_message".output_schema.properties.coordination.items]
type = "object"

[provides.operations."slack.post_message".network_constraints]
host_allow = ["slack.com", "*.slack.com"]
port_allow = [443]
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."slack.post_message".ai_hints]
when_to_use = "Send a message to a Slack channel."
common_mistakes = ["Using channel name instead of channel ID"]
examples = ['{"channel": "C01234567", "text": "Hello from FCP!"}']
related = ["slack.get_channel_history", "slack.reply_thread"]

