[package]
name = "fcp-slack"
description = "Slack workspace connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_slack"
path = "src/lib.rs"

[[bin]]
name = "fcp-slack"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }
fcp-streaming = { path = "../../crates/fcp-streaming" }
asupersync = { version = "=0.3.4", default-features = false, features = ["tls", "tls-native-roots"] }

anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
percent-encoding.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
ciborium.workspace = true
wiremock.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
fcp-webhook = { path = "../../crates/fcp-webhook" }
