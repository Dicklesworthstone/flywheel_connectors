[package]
name = "fcp-google-ai"
description = "Google AI (Gemini) generative models connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_google_ai"
path = "src/lib.rs"

[[bin]]
name = "fcp-google-ai"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk" }
fcp-google-discovery = { path = "../../crates/fcp-google-discovery" }
fcp-streaming = { workspace = true }

anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
asupersync = { version = "=0.3.4", default-features = false }
ciborium.workspace = true
wiremock.workspace = true
futures-util.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
