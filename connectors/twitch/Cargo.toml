[package]
name = "fcp-twitch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP Twitch Helix API connector"

[[bin]]
name = "fcp-twitch"
path = "src/main.rs"

[lib]
name = "fcp_twitch"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true

[lints]
workspace = true
