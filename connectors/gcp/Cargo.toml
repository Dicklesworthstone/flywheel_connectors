[package]
name = "fcp-gcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP GCP connector for Compute Engine, Cloud Storage, Cloud Run, and Projects"

[[bin]]
name = "fcp-gcp"
path = "src/main.rs"

[lib]
name = "fcp_gcp"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
rsa.workspace = true
base64.workspace = true
rand.workspace = true

[dev-dependencies]
chrono.workspace = true
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-e2e = { path = "../../crates/fcp-e2e" }
fcp-testkit.workspace = true
wiremock.workspace = true

[lints]
workspace = true
