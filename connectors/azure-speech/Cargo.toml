[package]
name = "fcp-azure-speech"
description = "Azure Speech REST connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_azure_speech"
path = "src/lib.rs"

[[bin]]
name = "fcp-azure-speech"
path = "src/main.rs"

[lints]
