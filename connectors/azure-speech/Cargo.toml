[dependencies]
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-sdk = { path = "../../crates/fcp-sdk" }

anyhow.workspace = true
base64.workspace = true
hex.workspace = true
quick-xml = "0.41"
reqwest = { workspace = true, features = ["json", "multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
ciborium.workspace = true
fcp-crypto = { workspace = true }
fcp-testkit = { path = "../../crates/fcp-testkit" }
chrono.workspace = true
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true
