[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:123fdf64dcf4d1cb9a75415d165198d282fad420b2c3fb9ac8ff7eff9d310dfe"

[connector]
id = "fcp.azure-speech"
name = "Azure Speech"
version = "0.1.0"
description = "Azure Speech REST connector for regional voice discovery, text-to-speech synthesis, host-brokered Microsoft Entra handoff, and 2025-10-15 fast, batch, and custom speech lifecycle surfaces"
archetypes = [
    "operational",
    "streaming",
]
format = "native"
status = "proven"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "This slice supports REST token exchange, Microsoft Entra external-token handoff, host credential references, voices.list, REST TTS synthesis, fast STT transcription, 2025-10-15 batch STT submit/status/files, and 2025-10-15 custom speech project/dataset/model/endpoint create/list/get/delete lifecycle operations. Realtime WebSocket remains an explicit follow-up surface. Connector-local IMDS/MSAL acquisition is intentionally host-token-broker-only because FCP runtime network policy cannot safely mix link-local IMDS and external Speech egress in every provider operation."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = []

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "azure.speech.voices",
    "azure.speech.tts",
    "azure.speech.stt",
]
forbidden = [
    "network.listen",
    "system.exec",
]

