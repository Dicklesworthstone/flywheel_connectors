[package]
name = "fcp-nostr"
description = "Nostr relay connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_nostr"
path = "src/lib.rs"

[[bin]]
name = "fcp-nostr"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-async-core.workspace = true
fcp-sdk.workspace = true
fcp-streaming.workspace = true

anyhow.workspace = true
aes = "0.8"
async-trait.workspace = true
base64.workspace = true
bech32 = "0.11.1"
cbc = "0.2"
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
secp256k1 = { version = "0.29", features = ["rand", "hashes", "global-context"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
jsonschema.workspace = true
sha1 = "0.10"
toml.workspace = true
wiremock.workspace = true
