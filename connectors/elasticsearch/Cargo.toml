[package]
name = "fcp-elasticsearch"
description = "Elasticsearch connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_elasticsearch"
path = "src/lib.rs"

[[bin]]
name = "fcp-elasticsearch"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# Integration-testcontainer deps - only pulled in when the
# `integration-testcontainer` feature is enabled. Kept in
# `[dependencies]` (not `[dev-dependencies]`) because Cargo disallows
# `optional = true` on dev-dependencies; they are feature-gated so
# default builds stay offline-friendly and docker-less.
testcontainers = { version = "0.23", optional = true }

[dev-dependencies]
wiremock.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }

[features]
default = []
# Enable real-Elasticsearch testcontainer acceptance tests. Requires a
# running Docker daemon. See tests/local_non_mock.rs.
integration-testcontainer = ["dep:testcontainers"]
