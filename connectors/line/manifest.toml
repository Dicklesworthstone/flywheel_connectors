[provides.operations."line.messages.reply".input_schema.properties.reply_token]
description = "Fresh reply token from an external LINE webhook event."
type = "string"

[provides.operations."line.messages.reply".input_schema.properties.messages]
description = "Array of LINE Messaging API message objects. LINE allows at most 5 messages per request."
type = "array"

[provides.operations."line.messages.reply".input_schema.properties.messages.items]
type = "object"

[provides.operations."line.messages.reply".output_schema]
type = "object"

[provides.operations."line.messages.reply".output_schema.properties.sent_messages]
type = "array"

[provides.operations."line.messages.reply".output_schema.properties.coordination]
description = "Redaction-safe chat thread ownership audit records for claim attempt, outcome, and send execution."
type = "array"

[provides.operations."line.messages.reply".output_schema.properties.coordination.items]
type = "object"

[provides.operations."line.messages.reply".ai_hints]
when_to_use = "Use immediately after a webhook event when you must answer with the one-time reply token."
common_mistakes = [
    "Using a reply token after it expires or after it has already been consumed.",
    "Treating reply like push; this operation depends on webhook state outside the connector.",
]
examples = []
related = ["line.messages.push"]

[provides.operations."line.messages.reply".network_constraints]
host_allow = ["api.line.me"]
