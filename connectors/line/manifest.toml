[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:fcd3a138d8ac30cb9635167954af73eef1268bdbf5b36a3b2d9cc3e6972b00e8"

[connector]
id = "fcp.line"
name = "LINE Messaging"
version = "0.1.0"
description = "One-channel LINE Messaging API connector for outbound messages, profile or group lookups, rich-menu metadata management, and health verification"
archetypes = ["operational"]
format = "native"
status = "proven"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "One channel access token plus retry and timeout settings are injected at runtime; the connector keeps no durable local state."

# Auth and scope model:
# - One connector instance is bound to one LINE Messaging API channel.
# - Authentication is one injected bearer channel access token.
# - Webhook receipt, signature verification, token issuance, and token rotation are out of scope.
# - Production traffic targets `https://api.line.me`; localhost mock servers are verifier
#   harness-only and are denied by the graduated operation network policy.

[zones]
home = "z:private"
allowed_sources = ["z:private"]
allowed_targets = ["z:private"]

[capabilities]
required = ["network.dns", "network.egress", "network.tls.sni"]
optional = [
    "line.messages.write",
    "line.profile.read",
    "line.menu.read",
    "line.menu.write",
]
forbidden = ["system.exec", "system.privileged", "network.listen"]

[provides.operations."line.messages.push"]
description = "Push a message to one LINE recipient ID."
capability = "line.messages.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "best_effort"

[provides.operations."line.messages.push".input_schema]
type = "object"
required = ["to", "messages"]

[provides.operations."line.messages.push".input_schema.properties.to]
description = "LINE recipient ID. This connector accepts any valid LINE recipient ID string already known to the caller."
type = "string"

[provides.operations."line.messages.push".input_schema.properties.messages]
description = "Array of LINE Messaging API message objects. LINE allows at most 5 messages per request."
type = "array"

[provides.operations."line.messages.push".input_schema.properties.messages.items]
type = "object"

[provides.operations."line.messages.push".output_schema]
type = "object"

[provides.operations."line.messages.push".output_schema.properties.sent_messages]
type = "array"

[provides.operations."line.messages.push".output_schema.properties.coordination]
description = "Redaction-safe chat thread ownership audit records for claim attempt, outcome, and send execution."
type = "array"

[provides.operations."line.messages.push".output_schema.properties.coordination.items]
type = "object"

[provides.operations."line.messages.push".ai_hints]
when_to_use = "Use for proactive outbound messages when the recipient ID is already known and a live side effect is intended."
common_mistakes = [
    "Assuming push is limited to user IDs; LINE also accepts other recipient identifiers where permitted.",
    "Sending more than 5 messages in one request.",
]
examples = []
related = ["line.messages.reply", "line.messages.multicast"]

[provides.operations."line.messages.push".network_constraints]
host_allow = ["api.line.me"]
port_allow = [443]
ip_allow = []
cidr_deny = []
require_sni = true
spki_pins = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 0
connect_timeout_ms = 10000
total_timeout_ms = 30000
max_response_bytes = 1048576

[provides.operations."line.messages.reply"]
description = "Reply to an inbound LINE webhook event using a reply token."
capability = "line.messages.write"
risk_level = "medium"
safety_tier = "risky"
requires_approval = "none"
idempotency = "none"

[provides.operations."line.messages.reply".input_schema]
type = "object"
