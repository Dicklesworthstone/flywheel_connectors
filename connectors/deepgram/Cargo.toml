[package]
name = "fcp-deepgram"
description = "Deepgram transcription connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_deepgram"
path = "src/lib.rs"

[[bin]]
name = "fcp-deepgram"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-sdk = { path = "../../crates/fcp-sdk" }
fcp-streaming = { path = "../../crates/fcp-streaming" }

anyhow.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
asupersync = { version = "=0.3.4", default-features = false, features = ["tls", "tls-native-roots"] }
fcp-e2e = { path = "../../crates/fcp-e2e", default-features = false }
fcp-testkit = { path = "../../crates/fcp-testkit" }
jsonschema.workspace = true
toml.workspace = true
wiremock.workspace = true
