[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:ad94fa16e986b112b6c7a34c6a7b35d0977a5e87a06bdb4286a89ed7facc5b3a"

[connector]
id = "fcp.openai"
name = "OpenAI Connector"
version = "0.1.0"
description = "FCP connector for OpenAI chat completion API with streaming support"
archetypes = [
    "operational",
    "streaming",
]
format = "native"

[connector.state]
model = "stateless"
state_schema_version = "1"
migration_hint = "init"

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = ["z:work"]
forbidden = ["z:public"]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
]
optional = [
    "openai.chat",
    "openai.embeddings",
    "openai.images",
    "openai.videos",
    "openai.audio.transcribe",
    "openai.realtime.transcribe",
    "openai.realtime.voice",
    "openai.realtime.browser_session",
    "openai.audio.tts",
    "openai.finetune.create",
    "openai.finetune.list",
    "openai.finetune.get",
    "openai.finetune.cancel",
    "openai.finetune.events",
    "openai.assistants.create",
    "openai.assistants.list",
    "openai.assistants.get",
    "openai.assistants.delete",
    "openai.threads.create",
    "openai.threads.get",
    "openai.threads.messages.create",
    "openai.threads.messages.list",
    "openai.threads.runs.create",
    "openai.threads.runs.get",
    "openai.threads.runs.cancel",
]
forbidden = [
    "system.exec",
    "network.listen",
    "storage.state",
]

# -----------------------------------------------------------------------------
# Operations
# -----------------------------------------------------------------------------

[provides.operations."openai.chat"]
description = "Send a chat completion request to OpenAI models"
capability = "openai.chat"
risk_level = "medium"
safety_tier = "safe"
requires_approval = "none"
idempotency = "none"
revocation_freshness = "safe"

[provides.operations."openai.chat".rate_limit]
max = 100
per_ms = 60000

[provides.operations."openai.chat".input_schema]
required = ["messages"]
type = "object"

[provides.operations."openai.chat".input_schema.properties.model]
description = "OpenAI model to use"
default = "gpt-4o"
enum = [
    "gpt-4o",
    "gpt-4o-mini",
    "gpt-4-turbo",
    "gpt-4",
    "gpt-3.5-turbo",
]
type = "string"

[provides.operations."openai.chat".input_schema.properties.messages]
description = "Array of chat messages"
type = "array"
minItems = 1

[provides.operations."openai.chat".input_schema.properties.messages.items]
type = "object"
required = ["role"]
anyOf = [
    { required = ["content"], properties = { content = { type = ["string", "array"] } } },
    { required = ["tool_calls"], properties = { role = { const = "assistant" }, tool_calls = { type = "array", minItems = 1 } } },
]
allOf = [
    { if = { properties = { role = { const = "tool" } } }, then = { required = ["tool_call_id"] } },
]

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.role]
type = "string"
enum = ["system", "user", "assistant", "tool"]

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.content]
description = "Text, multimodal content parts, or null for an assistant tool-call message"
type = ["string", "array", "null"]

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.content.items]
type = "object"

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.tool_calls]
description = "Tool calls from an assistant message, preserved when continuing the conversation"
type = "array"

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.tool_calls.items]
type = "object"
required = ["id", "type", "function"]

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.tool_calls.items.properties.id]
type = "string"

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.tool_calls.items.properties.type]
const = "function"

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.tool_calls.items.properties.function]
type = "object"
required = ["name", "arguments"]

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.tool_calls.items.properties.function.properties.name]
type = "string"

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.tool_calls.items.properties.function.properties.arguments]
type = "string"

[provides.operations."openai.chat".input_schema.properties.messages.items.properties.tool_call_id]
description = "Required non-empty tool call ID for a tool result message"
type = "string"
minLength = 1

[provides.operations."openai.chat".input_schema.properties.max_tokens]
description = "Maximum tokens to generate"
type = "integer"
default = 4096
minimum = 1
maximum = 128000

[provides.operations."openai.chat".input_schema.properties.temperature]
description = "Sampling temperature (0-2)"
type = "number"
minimum = 0
maximum = 2

[provides.operations."openai.chat".input_schema.properties.tools]
description = "Tool definitions for function calling"
type = "array"

[provides.operations."openai.chat".input_schema.properties.tool_choice]
description = "Controls how the model uses tools"
oneOf = [
    { type = "string", enum = ["none", "auto", "required"] },
    { type = "object", required = ["type", "function"], properties = { type = { const = "function" }, function = { type = "object", required = ["name"], properties = { name = { type = "string" } } } } },
]

[provides.operations."openai.chat".output_schema]
required = ["id", "content", "tool_calls"]
type = "object"

[provides.operations."openai.chat".output_schema.properties.id]
description = "Response ID from OpenAI"
type = "string"

[provides.operations."openai.chat".output_schema.properties.content]
description = "Generated response content"
type = "string"

[provides.operations."openai.chat".output_schema.properties.model]
description = "Model used for generation"
type = "string"

[provides.operations."openai.chat".output_schema.properties.finish_reason]
description = "Reason generation stopped, if reported by the provider"
oneOf = [
    { type = "string", enum = ["stop", "length", "tool_calls", "content_filter"] },
    { type = "null" },
]

[provides.operations."openai.chat".output_schema.properties.tool_calls]
description = "Function calls requested by the assistant; empty when no tool is requested"
type = "array"

[provides.operations."openai.chat".output_schema.properties.tool_calls.items]
type = "object"
required = ["id", "type", "function"]

[provides.operations."openai.chat".output_schema.properties.tool_calls.items.properties.id]
type = "string"

[provides.operations."openai.chat".output_schema.properties.tool_calls.items.properties.type]
const = "function"

[provides.operations."openai.chat".output_schema.properties.tool_calls.items.properties.function]
type = "object"
required = ["name", "arguments"]

[provides.operations."openai.chat".output_schema.properties.tool_calls.items.properties.function.properties.name]
type = "string"

[provides.operations."openai.chat".output_schema.properties.tool_calls.items.properties.function.properties.arguments]
type = "string"

[provides.operations."openai.chat".output_schema.properties.usage]
type = "object"

[provides.operations."openai.chat".output_schema.properties.usage.properties.prompt_tokens]
type = "integer"

[provides.operations."openai.chat".output_schema.properties.usage.properties.completion_tokens]
type = "integer"

[provides.operations."openai.chat".output_schema.properties.usage.properties.total_tokens]
type = "integer"

[provides.operations."openai.chat".output_schema.properties.cost_usd]
description = "Estimated cost in USD"
type = "number"

[provides.operations."openai.chat".network_constraints]
host_allow = ["api.openai.com", "api.deepseek.com"]
port_allow = [443]
ip_allow = []
cidr_deny = []
deny_localhost = true
deny_private_ranges = true
deny_tailnet_ranges = true
require_sni = true
spki_pins = []
deny_ip_literals = true
require_host_canonicalization = true
dns_max_ips = 16
max_redirects = 5
connect_timeout_ms = 10000
total_timeout_ms = 120000
max_response_bytes = 10485760

[provides.operations."openai.chat".ai_hints]
when_to_use = "Send a chat completion request to OpenAI models. Supports multi-turn conversations and function calling."
common_mistakes = [
    "Not providing messages array.",
    "Exceeding model context length.",
    "Using wrong model name.",
    "Accumulating long conversation histories without truncation — count tokens first and prune older messages to stay within context window.",
    "Not consuming SSE stream chunks incrementally — each chunk contains a delta, not the full response.",
]
examples = [
    '{"messages": [{"role": "user", "content": "Hello!"}]}',
    '{"model": "gpt-4o-mini", "messages": [{"role": "system", "content": "You are helpful."}, {"role": "user", "content": "Hi"}]}',
]
related = ["openai.simple_chat"]

