[package]
name = "fcp-openai"
description = "OpenAI API connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_openai"
path = "src/lib.rs"

[[bin]]
name = "fcp-openai"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
fcp-streaming = { path = "../../crates/fcp-streaming" }

anyhow.workspace = true
async-stream = "0.3"
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["multipart", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
asupersync = { version = "=0.3.4", default-features = false, features = ["tls", "tls-native-roots"] }
ciborium.workspace = true
base64.workspace = true
wiremock.workspace = true
futures-util.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
