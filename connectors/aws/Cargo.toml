[package]
name = "fcp-aws"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FCP AWS connector for S3, EC2, Lambda, and STS"

[[bin]]
name = "fcp-aws"
path = "src/main.rs"

[lib]
name = "fcp_aws"
path = "src/lib.rs"

[dependencies]
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-sdk = { workspace = true, features = ["connector-http"] }
fcp-async-core.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
quick-xml = { version = "0.39.2", features = ["serialize"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
async-trait.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
url.workspace = true

[dev-dependencies]
chrono.workspace = true
ciborium.workspace = true
fcp-crypto.workspace = true
fcp-testkit.workspace = true
percent-encoding.workspace = true
wiremock.workspace = true
