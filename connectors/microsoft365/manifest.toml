[manifest]
format = "fcp-connector-manifest"
schema_version = "2.1"
min_mesh_version = "2.0.0"
min_protocol = "fcp2-sym/2.0"
protocol_features = []
max_datagram_bytes = 65000
interface_hash = "blake3-256:fcp.interface.v2:9aae062c5066538b78e6c901db0adb9e124cbcb8972319535563835f440a4877"

[connector]
id = "fcp.microsoft365"
name = "Microsoft 365 Connector"
version = "0.1.0"
description = "FCP connector for Microsoft 365 via Microsoft Graph API (Outlook mail, OneDrive files, Calendar events, To Do tasks, OneNote notes, Excel/Word Online)"
archetypes = [
    "knowledge",
    "operational",
    "streaming",
    "storage",
]
format = "wasi"
status = "proven"

[connector.state]
model = "singleton_writer"
state_schema_version = "1"
migration_hint = "Stores Graph API delta tokens for incremental sync, webhook subscription IDs with clientState/expiry metadata, replay keys, and per-resource change cursors."

[zones]
home = "z:work"
allowed_sources = [
    "z:owner",
    "z:private",
    "z:work",
]
allowed_targets = [
    "z:work",
    "z:private",
]
forbidden = [
    "z:public",
    "z:community",
]

[capabilities]
required = [
    "network.dns",
    "network.egress",
    "network.tls.sni",
    "storage.state",
    "media.download",
    "media.upload",
]
optional = [
    "network.tls.mtls",
    "m365.calendar.write",
    "m365.calendar.read",
    "m365.delta.read",
    "m365.files.write",
    "m365.files.read",
    "m365.notifications.ingest",
    "m365.mail.write",
    "m365.mail.send",
    "m365.mail.read",
    "m365.onenote.write",
    "m365.onenote.read",
    "m365.subscriptions.write",
    "m365.tasks.write",
    "m365.tasks.read",
    "m365.word.write",
    "m365.word.read",
]
forbidden = [
    "system.exec",
    "network.listen",
]

