[package]
name = "fcp-google-docs"
description = "Google Docs connector for the Flywheel Connector Protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "fcp_google_docs"
path = "src/lib.rs"

[[bin]]
name = "fcp-google-docs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fcp-core = { path = "../../crates/fcp-core" }
fcp-prelude = { path = "../../crates/fcp-prelude" }
fcp-async-core = { path = "../../crates/fcp-async-core" }
fcp-sdk = { path = "../../crates/fcp-sdk", features = ["connector-http"] }
fcp-google-discovery = { path = "../../crates/fcp-google-discovery" }

anyhow.workspace = true
async-trait.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
wiremock.workspace = true
chrono.workspace = true
ciborium.workspace = true
fcp-crypto = { path = "../../crates/fcp-crypto" }
fcp-e2e = { path = "../../crates/fcp-e2e" }
fcp-manifest = { path = "../../crates/fcp-manifest" }
fcp-testkit = { path = "../../crates/fcp-testkit" }
