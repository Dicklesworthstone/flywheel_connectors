[[targets]]
target_id = "blake3_avx512_statpack"
title = "BLAKE3 AVX-512 and aarch64 throughput StatPack"
blocked_beads = ["flywheel_connectors-angoc.14.2"]
artifact_schema = "fcp.crypto-throughput-statpack.v1"
artifact_root = "artifacts/perf/crypto_dispatch"
artifact_globs = ["artifacts/perf/crypto_dispatch/blake3-avx512-*.json", "artifacts/perf/crypto_dispatch/blake3-aarch64-*.json"]
freshness_days = 30
machine_classes = ["x86_64-avx512", "aarch64-neon"]
host_roles = []
required_artifact_fields = ["schema_version", "algorithm", "backend", "machine_class", "git_sha", "throughput_summary"]
command_template = "cargo bench -p fcp-crypto --bench blake3_dispatch -- --statpack-out artifacts/perf/crypto_dispatch/blake3-<machine-class>-<date>-<sha>.json"
redaction_policy = ["no_raw_hostnames", "no_private_ips", "no_tokens", "no_user_home_paths"]
evidence_notes = ["Label-only dispatch evidence is insufficient; throughput artifact must identify the backend actually measured."]

