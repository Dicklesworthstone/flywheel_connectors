schema_version = "fcp.fwc.proof-readiness-targets.v1"

[[targets]]
target_id = "pq_signing_csd"
title = "PQ signing overhead StatPack for csd class"
blocked_beads = ["flywheel_connectors-angoc.8.3"]
artifact_schema = "fcp.pq-signing-overhead.v1"
artifact_root = "artifacts/perf/pq_signing"
artifact_globs = ["artifacts/perf/pq_signing/csd-*.json"]
freshness_days = 30
machine_classes = ["csd"]
host_roles = []
required_artifact_fields = ["schema_version", "machine_class", "git_sha", "sample_count", "summary"]
command_template = "cargo bench -p fcp-crypto --bench hybrid_verify -- --samples 10000 --machine-class csd --statpack-out artifacts/perf/pq_signing/csd-<date>-<sha>.json"
redaction_policy = ["no_raw_hostnames", "no_private_ips", "no_tokens", "no_user_home_paths"]
evidence_notes = ["Committed artifact must include machine_class=csd and a repository git SHA."]

