[package]
name = "fcp-conformance"
description = "FCP conformance tooling: golden vectors, interop helpers, and harness glue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
semver.workspace = true
chrono.workspace = true
uuid.workspace = true
jsonschema.workspace = true
clap = { workspace = true, features = ["derive"] }
ciborium.workspace = true
rand.workspace = true
rand_chacha = "0.3"
toml.workspace = true

# FCP crates (for types and encoding)
fcp-core = { path = "../fcp-core" }
fcp-prelude = { path = "../fcp-prelude" }
fcp-protocol = { path = "../fcp-protocol" }
fcp-crypto = { path = "../fcp-crypto" }
fcp-auth-schema = { path = "../fcp-auth-schema" }
fcp-cbor = { path = "../fcp-cbor" }
fcp-manifest = { path = "../fcp-manifest" }
fcp-mesh = { path = "../fcp-mesh" }
fcp-store = { path = "../fcp-store" }
fcp-tailscale = { path = "../fcp-tailscale" }
fcp-webhook = { path = "../fcp-webhook" }

[[bin]]
name = "fcp-vecgen"
path = "src/bin/vecgen.rs"

[[bin]]
name = "fcp-reqcheck"
path = "src/bin/reqcheck.rs"

[[bin]]
name = "fcp-manifest-ops-audit"
path = "src/bin/manifest_ops_audit.rs"

[dev-dependencies]
pretty_assertions.workspace = true
regex.workspace = true
proptest.workspace = true
fcp-async-core = { path = "../fcp-async-core" }
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
sha2.workspace = true
axum = { version = "0.8", features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }
fcp-manifest = { path = "../fcp-manifest" }
fcp-evidence = { path = "../fcp-evidence" }
fcp-ratelimit = { path = "../fcp-ratelimit" }
fcp-registry = { path = "../fcp-registry" }
fcp-raptorq = { path = "../fcp-raptorq" }
fcp-host = { path = "../fcp-host" }
fcp-oauth = { path = "../fcp-oauth" }
fcp-sandbox = { path = "../fcp-sandbox" }
fcp-streaming = { path = "../fcp-streaming" }
fcp-sdk = { path = "../fcp-sdk" }
fcp-provider-auth = { path = "../fcp-provider-auth" }
fcp-audit = { path = "../fcp-audit" }
fcp-policy = { path = "../fcp-policy" }
fcp-kernel = { path = "../fcp-kernel" }
fcp-bench = { path = "../fcp-bench" }
fcp-chaos = { path = "../fcp-chaos" }
fwc = { workspace = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
futures-util = { workspace = true }
url.workspace = true
criterion.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[[bench]]
name = "cutover_harness"
harness = false
