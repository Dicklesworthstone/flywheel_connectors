[package]
name = "fcp-sdk"
description = "FCP3 connector authoring SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
fcp-async-core = { path = "../fcp-async-core" }
fcp-core = { path = "../fcp-core" }
fcp-prelude = { path = "../fcp-prelude" }
fcp-evidence = { path = "../fcp-evidence" }
fcp-kernel = { path = "../fcp-kernel" }
fcp-cbor = { path = "../fcp-cbor", optional = true }
fcp-manifest = { path = "../fcp-manifest" }
fcp-policy = { path = "../fcp-policy" }
fcp-store = { path = "../fcp-store", optional = true }
jsonschema.workspace = true
reqwest = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde.workspace = true
percent-encoding = "2"
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
cursor-store-object-store = ["dep:fcp-store", "dep:fcp-cbor", "dep:semver"]
connector-http = ["dep:reqwest"]

[dev-dependencies]
asupersync = { version = "=0.3.4", default-features = false, features = ["tracing-integration", "tls", "tls-native-roots"] }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
fcp-cbor = { path = "../fcp-cbor" }
fcp-crypto = { path = "../fcp-crypto" }
semver = { workspace = true }
reqwest = { workspace = true }
wiremock = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
ciborium = { workspace = true }
