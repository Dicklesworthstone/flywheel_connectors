[package]
name = "fcp-bootstrap"
description = "FCP bootstrap and genesis: first-run workflow, owner key ceremony, enrollment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Internal crates
fcp-crypto.workspace = true
fcp-core.workspace = true
fcp-prelude.workspace = true

# Async runtime
fcp-async-core = { path = "../fcp-async-core" }
async-trait.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ciborium.workspace = true

# Cryptography (for threshold signing and key derivation)
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
blake3.workspace = true
cryptoki.workspace = true
frost-ed25519 = "2.2"
hkdf.workspace = true
sha2.workspace = true
zeroize = { workspace = true, features = ["derive"] }
rand.workspace = true
rand_core.workspace = true
subtle.workspace = true

# BIP39 mnemonics for recovery phrases.
# The `zeroize` feature makes `bip39::Mnemonic` derive `ZeroizeOnDrop`, which is
# load-bearing: `Mnemonic` holds the authoritative 24-word secret (`[u16; 24]`)
# from which the owner signing key is derived. Without this feature the secret
# survives drop even though `RecoveryPhrase` wipes its redundant entropy copy,
# breaking the crate's "all cryptographic material is zeroized on drop" contract.
bip39 = { version = "2.1", features = ["zeroize"] }

# Time handling
chrono.workspace = true

# Error handling
thiserror.workspace = true

# Logging/tracing
tracing.workspace = true

# Bytes
bytes.workspace = true
hex.workspace = true
base64.workspace = true
x509-parser = { version = "0.18.1", features = ["verify"] }

[target.'cfg(unix)'.dependencies]
# NTP client for time validation (Unix systems)
rsntp = "4.1"

[target.'cfg(windows)'.dependencies]
# Windows time APIs
windows = { version = "0.62", features = ["Win32_System_Time"] }

[dev-dependencies]
# Testing
criterion.workspace = true
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
pretty_assertions.workspace = true
rand_chacha = "0.3"
tempfile = "3.15"
rcgen = "0.14.7"
time = "0.3"

[[bench]]
name = "certificate_selection"
harness = false

[[bench]]
name = "hardware_token"
harness = false
