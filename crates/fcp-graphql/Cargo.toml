[package]
name = "fcp-graphql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "Typed GraphQL client infrastructure for FCP connectors"

[lints]
# Inherit [workspace.lints.clippy]; without this the crate silently opted out of
# the workspace lint policy, allows included.
workspace = true

[dependencies]
fcp-async-core = { workspace = true }
fcp-core = { workspace = true }
fcp-prelude = { workspace = true }
fcp-streaming = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
asupersync = { version = "=0.3.4", default-features = false }
criterion = { workspace = true }
fcp-testkit = { workspace = true }
pretty_assertions = { workspace = true }
wiremock = { workspace = true }
insta.workspace = true

[[bench]]
name = "graphql_hot_paths"
harness = false
