[package]
name = "fcp-crypto"
description = "FCP crypto primitives and helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
test-utils = []

[dependencies]
# Shared auth-claim schema (single source of truth for label layout)
fcp-auth-schema = { path = "../fcp-auth-schema" }
fcp-cbor = { path = "../fcp-cbor" }

# Signatures
ed25519-dalek.workspace = true
curve25519-dalek = { version = "4.1", features = ["group"] }
frost-ed25519 = "2.2"

# BLS12-381 threshold-aggregate quorum signatures (br-angoc.17.4).
# Pure-Rust zkcrypto implementation. `experimental` gates the
# draft-irtf-cfrg-hash-to-curve XMD:SHA-256 hash-to-curve module;
# `zeroize` lets `BlsSecretKey` wipe its scalar on drop. `ff`/`group`
# provide the field/group traits (Field::is_zero, Curve::to_affine,
# Group::identity) for the same 0.13 trait generation bls12_381 0.8 uses.
bls12_381 = { version = "0.8", features = ["experimental", "zeroize"] }
ff = "0.13"
group = "0.13"
# bls12_381 0.8's `experimental` hash-to-curve is written against digest 0.9
# trait names (Update/BlockInput/FixedOutputDirty), so the ExpandMsgXmd
# hasher must be a digest-0.9 sha2. Scoped alias; everything else in this
# crate stays on workspace sha2 0.10.
sha2_09 = { package = "sha2", version = "0.9" }

# Post-quantum signatures (FIPS 204 ML-DSA-65, br-kyopb.1.1.3)
# `signature` is re-exported by `ml-dsa` so we do NOT pull our own; pulling
# both produces two incompatible versions of `signature::Verifier`.
ml-dsa = { version = "=0.1.0-rc.11", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
# Post-quantum KEM hybrid (X-Wing draft-06, X25519 + ML-KEM-768) for V4
# zone-key sealing (br-kyopb.1.2.1).
x-wing = { version = "0.1.0-rc.0", default-features = false, features = ["zeroize"] }
# `getrandom` v0.3 backs the rand_core v0.10 RNG adapter we wrap for ml-dsa's
# randomized signing path (br-kyopb.1.1.3).
getrandom = "0.3"
rand_core_pq = { package = "rand_core", version = "0.10" }

# Key exchange
x25519-dalek.workspace = true

# Hashing
blake3.workspace = true
sha2.workspace = true

# Key derivation
hkdf.workspace = true

# AEAD
chacha20poly1305.workspace = true

# HPKE (RFC 9180)
hpke.workspace = true

# COSE/CWT
coset.workspace = true

# Serialization (for COSE/CBOR)
ciborium.workspace = true
serde.workspace = true
serde_bytes = "0.11"

# Memory safety
zeroize.workspace = true
subtle.workspace = true

# Randomness
rand.workspace = true
rand_core.workspace = true

# Bytes
bytes.workspace = true
hex.workspace = true

# Error handling
thiserror.workspace = true

# Time (for token validation)
chrono.workspace = true

# Structured logging — fail-safe paths (br-zp1xx) warn on malformed
# inputs instead of panicking.
tracing.workspace = true

# Async-trait support for AsyncSecretFetchHook companion trait (br-e99o6.1.1
# round-2 follow-on). The canonical SecretFetchHook stays sync to keep the
# WASI host integration sync; AsyncSecretFetchHook is for backends with
# native async I/O (Vault, AWS Secrets Manager).
async-trait.workspace = true
# Minimal Tokio surface (`rt` only) so AsyncToSyncSecretFetchHook can hold a
# runtime handle for `block_on`. We pull only the runtime feature; no I/O,
# no time, no signal — fcp-crypto is otherwise runtime-agnostic.
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
# Testing
serde_json.workspace = true
bincode = "1.3.3"
rand_chacha = "0.3"
proptest.workspace = true
tracing-subscriber.workspace = true
criterion.workspace = true
fcp-bench.workspace = true
# Async runtime for AsyncSecretFetchHook tests
fcp-async-core.workspace = true
# Self-audit metamorphic harness (6po63.1)
semver.workspace = true
# Integration tests compare FCP X-Wing bytes against the upstream component
# algorithms directly.
ml-kem = "0.3.0"
sha3 = "0.11.0"
x25519-dalek-v3 = { package = "x25519-dalek", version = "3.0.0-pre.6", features = ["static_secrets"] }

[[bench]]
name = "bls_aggregate"
harness = false

[[bench]]
name = "vector_commit"
harness = false

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "canonicalize_map_throughput"
harness = false

[[bench]]
name = "hybrid_verify"
harness = false
