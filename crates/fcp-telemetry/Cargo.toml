[package]
name = "fcp-telemetry"
description = "Unified metrics, logging, and tracing for FCP connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
otlp = [
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tonic",
]

[dependencies]
fcp-core = { path = "../fcp-core" }
fcp-prelude = { path = "../fcp-prelude" }
fcp-async-core = { path = "../fcp-async-core" }
asupersync = { version = "=0.3.4", default-features = false }

# Tracing
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }

# OpenTelemetry
opentelemetry = "0.31"
opentelemetry-appender-tracing = { version = "0.31.1", optional = true }
opentelemetry_sdk = { version = "0.31", optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "logs", "trace"], optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"], optional = true }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
chrono.workspace = true

# Error handling
thiserror.workspace = true

# Identifiers
uuid.workspace = true

# Utilities
once_cell = "1.21"
parking_lot = "0.12"
hex = "0.4"
rand = "0.9"

# Trace capture (CBOR serialization + hashing)
ciborium = "0.2"
sha2 = "0.10"

[dev-dependencies]
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic", "logs", "trace", "metrics"] }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
