[package]
name = "fcp-sandbox"
description = "FCP sandbox enforcement (OS sandbox profiles + egress guard)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Inherit the workspace lint policy wholesale (allow entries included).
# The unsafe_code carve-out lives as a crate-root attribute in src/lib.rs
# because Cargo forbids combining `lints.workspace = true` with overrides.
[lints]
workspace = true
[features]
default = []
windows-appcontainer = []

[dependencies]
anyhow.workspace = true
fcp-async-core.workspace = true
fcp-core.workspace = true
fcp-crypto.workspace = true
fcp-manifest.workspace = true
idna = "1.0"
ipnet = "2.9"
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
rand.workspace = true

# WASI runtime
wasmtime.workspace = true
wasmtime-wasi.workspace = true

# Async runtime
async-trait.workspace = true
bytes.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pretty_assertions.workspace = true
reqwest.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true
