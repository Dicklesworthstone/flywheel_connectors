[package]
name = "fwc"
description = "Standalone Flywheel connectors CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
otlp = ["fcp-telemetry/otlp"]

[lib]
name = "fwc"
path = "src/lib.rs"

[[bin]]
name = "fwc"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
ciborium.workspace = true
fcp-audit.workspace = true
fcp-async-core.workspace = true
fcp-bootstrap.workspace = true
fcp-core.workspace = true
fcp-prelude.workspace = true
fcp-cbor.workspace = true
fcp-crypto.workspace = true
fcp-evidence.workspace = true
fcp-host.workspace = true
fcp-kernel = { path = "../fcp-kernel" }
fcp-raptorq.workspace = true
fcp-manifest.workspace = true
fcp-migrate.workspace = true
fcp-mesh.workspace = true
fcp-policy.workspace = true
fcp-registry.workspace = true
fcp-sandbox.workspace = true
fcp-telemetry.workspace = true
fcp-testkit.workspace = true
handlebars.workspace = true
jaq-core = "2.2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
jaq-std = "2.1.2"
chacha20poly1305.workspace = true
rand.workspace = true
base64.workspace = true
blake3.workspace = true
hex.workspace = true
ipnet = "2.9"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
semver.workspace = true
toml.workspace = true
tracing.workspace = true
toon = { package = "tru", version = "0.2.3" }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
criterion = { workspace = true }
jsonschema.workspace = true
tempfile = "3"

[[bench]]
name = "cual_bench"
harness = false
