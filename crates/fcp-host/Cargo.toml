[package]
name = "fcp-host"
version = "0.2.1"
edition = "2024"
description = "FCP Host - Node Gateway/Orchestrator for the Flywheel Connector Protocol"
license = "Apache-2.0"
repository = "https://github.com/flywheel-ai/flywheel_connectors"
keywords = ["fcp", "host", "gateway", "orchestrator"]
categories = ["network-programming", "asynchronous"]

[lints.rust]
unsafe_code = "deny"

[features]
default = []
otlp = ["fcp-telemetry/otlp"]

[dependencies]
# Core FCP types
fcp-audit = { path = "../fcp-audit" }
fcp-core = { path = "../fcp-core" }
# Canonical type-import surface (orw5s migration target).
fcp-prelude = { path = "../fcp-prelude" }
fcp-evidence = { path = "../fcp-evidence" }
fcp-kernel = { path = "../fcp-kernel" }
fcp-manifest = { path = "../fcp-manifest" }
fcp-mesh = { path = "../fcp-mesh" }
fcp-policy = { path = "../fcp-policy" }
fcp-async-core = { path = "../fcp-async-core" }
fcp-provider-auth = { path = "../fcp-provider-auth" }
fcp-cbor = { path = "../fcp-cbor" }
fcp-crypto = { path = "../fcp-crypto" }
fcp-ratelimit = { path = "../fcp-ratelimit" }
fcp-store = { path = "../fcp-store" }
fcp-tailscale = { path = "../fcp-tailscale" }
fcp-telemetry.workspace = true

# Async runtime
async-trait = "0.1"
futures-util = { workspace = true }
asupersync = { version = "=0.3.4" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
ciborium = { workspace = true }
subtle = { workspace = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Tracing
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# Semver for version comparison
semver = { version = "1", features = ["serde"] }

# HTTP server (doctor endpoint)
axum = { version = "0.8", features = ["json"] }
hyper = "1.8.1"
hyper-util = { version = "0.1.20", features = ["server", "service", "http1", "http2"] }
reqwest = { workspace = true, features = ["blocking", "form"] }
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.6.2"
tower = { version = "0.5.3", features = ["util"] }
fcp-sandbox = { version = "0.2.1", path = "../fcp-sandbox" }
url.workspace = true
x509-parser = "0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
fcp-raptorq = { path = "../fcp-raptorq" }
mach2 = "0.4"

[dev-dependencies]
fcp-testkit = { path = "../fcp-testkit" }
fcp-crypto-pq = { path = "../fcp-crypto-pq" }
fcp-browser = { path = "../../connectors/browser", features = ["test-support"] }
fcp-telegram = { path = "../../connectors/telegram", features = ["test-support"] }
tempfile = "3"
rcgen = "0.14.7"
insta.workspace = true
criterion.workspace = true
proptest = { workspace = true }
uuid = { workspace = true }

[[bench]]
name = "cold_start"
harness = false

[[bench]]
name = "memory_overhead"
harness = false

[[bench]]
name = "local_invoke"
harness = false

[[bench]]
name = "tailnet_invoke"
harness = false

[[bench]]
name = "cpu_overhead"
harness = false

[[bench]]
name = "invoke_audit_throughput"
harness = false

[[bench]]
name = "batch_scheduler"
harness = false

[[bench]]
name = "supply_chain_cache"
harness = false
