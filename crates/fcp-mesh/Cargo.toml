[package]
name = "fcp-mesh"
description = "FCP mesh node orchestration (routing, admission, gossip, leases)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
constant_time_eq = "0.4"
fcp-core = { path = "../fcp-core" }
fcp-cbor = { path = "../fcp-cbor" }
fcp-prelude = { path = "../fcp-prelude" }
fcp-crypto = { path = "../fcp-crypto" }
fcp-policy = { path = "../fcp-policy" }
fcp-protocol = { path = "../fcp-protocol" }
fcp-raptorq = { path = "../fcp-raptorq" }
fcp-store = { path = "../fcp-store" }
fcp-telemetry = { path = "../fcp-telemetry" }
fcp-tailscale = { path = "../fcp-tailscale" }
hex.workspace = true
hkdf = "0.12"
hmac = "0.12"
ciborium.workspace = true
rand.workspace = true
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true
xorf.workspace = true
zeroize.workspace = true

[dev-dependencies]
criterion.workspace = true
fcp-async-core = { path = "../fcp-async-core" }
insta = { workspace = true, features = ["json"] }
jsonschema.workspace = true
proptest.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

semver.workspace = true
serde_json.workspace = true

[features]
# Forward `fcp-store`'s `deadlock-detection` feature through the mesh
# dependency graph so runtime audits of mesh+store code paths can
# activate parking_lot's cycle detector with a single feature flag.
# Debug/test-only — see fcp-store/Cargo.toml and the workspace README
# "Deadlock detection" section for usage.
#
# Usage:
#   cargo test -p fcp-mesh --features deadlock-detection
deadlock-detection = ["fcp-store/deadlock-detection"]

[[bench]]
name = "mesh_benchmarks"
harness = false
