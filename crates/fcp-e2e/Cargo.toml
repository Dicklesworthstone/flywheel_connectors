# br-ab8sb: llm_router_compliance_e2e.rs references
# `fcp_sandbox::host_matches_allow_list` at test body scope; without this
# dev-dep the test binary does not compile (pre-existing baseline error,
# unrelated to ab8sb's handshake assertion fix but blocks verification of
# that fix via `cargo test -p fcp-e2e --test llm_router_compliance_e2e`).
fcp-sandbox = { workspace = true }
# Secretless-connectors E2E (e99o6): tracing-capture subscriber for
# verifying that bearer-token bytes never appear in connector log
# events; zeroize for the production ZeroizeOnDrop type-bound proof.
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
# Real-service e2e harnesses (no mocks): tokio for in-process HTTP
# server + concurrent task spawning; tempfile for filesystem
# fault-injection scratch dirs.
tokio = { workspace = true }
tempfile = "3"
bytes = { workspace = true }
fcp-oauth = { workspace = true }
# Capability enforcement concurrent e2e (CrimsonWolf): RevocationObject
# construction needs fcp_cbor::SchemaId + semver::Version directly,
# both referenced by `tests/capability_enforcement_concurrent_e2e.rs`.
fcp-cbor = { workspace = true }
semver = { workspace = true }
br-tools = { path = "../br-tools" }
