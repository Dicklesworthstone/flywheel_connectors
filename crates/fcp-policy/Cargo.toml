[package]
name = "fcp-policy"
version = "0.2.0"
edition = "2024"
description = "FCP policy engine — canonical owner of zone, capability, provenance, and approval semantics"
license = "Apache-2.0"
publish = false

[dependencies]
blake3 = { workspace = true }
fcp-core = { path = "../fcp-core" }
fcp-crypto-pq = { path = "../fcp-crypto-pq" }
fcp-evidence = { path = "../fcp-evidence" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

[dev-dependencies]
fcp-async-core = { path = "../fcp-async-core" }
fcp-cbor = { workspace = true }
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true }
semver = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
