[package]
name = "fcp-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Enable live supply-chain verification using tough/sigstore crates
supply-chain-live = []
# Expose the in-memory Mock*Verifier types (MockTransparencyVerifier,
# MockTufVerifier, MockSigstoreVerifier) through the public API.
#
# These verifiers short-circuit supply-chain trust by returning
# `verified: true` for any allow-listed input. They are intended purely for
# controlled tests and MUST NOT be linked into a production binary. The
# feature is OFF by default so that a downstream `use fcp_registry::Mock...`
# fails to compile unless the consumer explicitly opts in.
test-mocks = []

[lints]
# Inherit [workspace.lints.clippy]; without this the crate silently opts out of the
# workspace lint policy, allow entries included.
workspace = true

[dependencies]
axum = { version = "0.8", features = ["json"] }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
fcp-async-core = { workspace = true }
fcp-cbor = { workspace = true }
fcp-core = { workspace = true }
fcp-prelude = { workspace = true }
fcp-crypto = { workspace = true }
fcp-manifest = { workspace = true }
fcp-raptorq = { workspace = true }
fcp-store = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
hyper = "1.8.1"
hyper-util = { version = "0.1.20", features = ["server", "service", "http1", "http2"] }
tower = { version = "0.5.3", features = ["util"] }
# Supply-chain hardening (optional for live verification)
tough = { workspace = true, optional = true }
sigstore = { workspace = true, optional = true }
sigstore-trust-root = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
tempfile = "3"
tracing.workspace = true
uuid = { workspace = true }

# Integration test that exercises the Mock*Verifier fixtures only runs when
# the `test-mocks` feature is enabled (`cargo test -p fcp-registry --features
# test-mocks` or `--all-features`). See the `test-mocks` feature note above.
[[test]]
name = "no_mock_integration"
path = "tests/no_mock_integration.rs"
required-features = ["test-mocks"]
