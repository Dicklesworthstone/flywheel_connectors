name: Prepare reviewed HTTP batch integration

'on':
  push:
    branches: [main]
    paths: [.github/workflows/http-batch-integration.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-http-batch-integration
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/flywheel_connectors' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          clean: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source and prepare shared-scheduler and mesh wiring
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          REPO = 'Dicklesworthstone/flywheel_connectors'
          PATH = 'crates/fcp-host/src/bin/fcp-host.rs'
          BASE_BLOB = 'a4b34764a741d0dbd5826f45d9d70b6fd459c26e'
          PATCH_SHA256 = '2d63367fae5c64fe2c3b587ef9d431cbcdb851a4bad9afc96d88739be4839caa'
          CHUNKS = ['181f1d7e87bb93050da1d0392297d8ec773cc0f9']
          REQUIRED_BLOBS = {
              'crates/fcp-host/src/batch_async.rs': '3b8564762453e41bef489714b57fe5cebd3e5fcb',
              'crates/fcp-host/src/bin/fcp-host/http_batch.rs': '9e8bd27d33d544c406bec209896da618e0afe57a',
              'crates/fcp-host/src/bin/fcp-host/http_batch_tests.rs': '6f01da93857a56eecb7df480208e537a80462948',
          }

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def api(suffix, data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + suffix,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  method='GET' if data is None else 'POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          if git('branch', '--show-current') != 'main':
              raise SystemExit('Only a main checkout may prepare this integration')
          if git('status', '--porcelain'):
              raise SystemExit('Refusing a dirty checkout')
          original = Path(PATH).read_bytes()
          if blob_sha(original) != BASE_BLOB:
              raise SystemExit('Host source changed; reconcile before preparing another candidate')
          for path, expected in REQUIRED_BLOBS.items():
              if blob_sha(Path(path).read_bytes()) != expected:
                  raise SystemExit('A reviewed integration dependency changed: ' + path)

          compressed = bytearray()
          for sha in CHUNKS:
              obj = api('/git/blobs/' + sha)
              if obj.get('encoding') != 'base64':
                  raise SystemExit('Unexpected Git blob encoding')
              chunk = base64.b64decode(''.join(obj['content'].split()), validate=True)
              if blob_sha(chunk) != sha:
                  raise SystemExit('Patch transport checksum mismatch')
              compressed.extend(chunk)
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != PATCH_SHA256:
              raise SystemExit('Reviewed patch checksum mismatch')
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', '-'], input=patch, check=True)
          if git('diff', '--name-only') != PATH:
              raise SystemExit('Patch changed an unexpected path')
          subprocess.run(['git', 'diff', '--check'], check=True)
          candidate = Path(PATH).read_bytes()
          # Syntax checks only, not a Cargo build or executed Rust tests.
          for path in [PATH, *REQUIRED_BLOBS]:
              subprocess.run(
                  ['rustup', 'run', 'stable', 'rustfmt', '--edition', '2024',
                   '--config', 'skip_children=true', '--emit', 'stdout'],
                  input=Path(path).read_bytes(), check=True, stdout=subprocess.DEVNULL,
              )
          print(patch.decode())
          blob = api('/git/blobs', {'content': candidate.decode(), 'encoding': 'utf-8'})
          if blob['sha'] != blob_sha(candidate):
              raise SystemExit('Prepared source upload checksum mismatch')
          result = {
              'base_commit': git('rev-parse', 'HEAD'),
              'base_tree': git('rev-parse', 'HEAD^{tree}'),
              'path': PATH,
              'old_sha': BASE_BLOB,
              'new_sha': blob['sha'],
              'required_blobs': REQUIRED_BLOBS,
              'patch_sha256': PATCH_SHA256,
              'validation': 'exact patch application, diff whitespace, Rust syntax; Cargo tests not run',
          }
          # No commits or ref updates occur in this job. Reviewed publication
          # happens through the GitHub connector with a main-head lease, no PR.
          print('PREPARED_HTTP_BATCH=' + json.dumps(result, sort_keys=True))
