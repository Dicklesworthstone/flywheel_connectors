name: Prepare reviewed mesh admission integration

'on':
  push:
    branches: [main]
    paths: [.github/workflows/mesh-admission-handler-migration.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-mesh-admission-integration
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/flywheel_connectors' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          clean: false
          fetch-depth: 1
          show-progress: false
      - name: Guard the exact reviewed input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test "$(git hash-object crates/fcp-host/src/bin/fcp-host.rs)" = 27b49f81496a73c321a6d8c5beb1a0827acb70a7
      - name: Apply reviewed live-path patch without committing
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mesh-handler.patch" <<'PATCH'
          diff --git a/crates/fcp-host/src/bin/fcp-host.rs b/crates/fcp-host/src/bin/fcp-host.rs
          --- a/crates/fcp-host/src/bin/fcp-host.rs
          +++ b/crates/fcp-host/src/bin/fcp-host.rs
          @@ -1,1 +1,42 @@
          +#[cfg(test)]
          +#[test]
          +fn mesh_replay_admission_errors_preserve_http_semantics() {
          +    use fcp_mesh::invoke_route::MeshForwardError;
          +    for reason in [
          +        "commit_failed",
          +        "replay_admission_queue_full",
          +        "replay_admission_deadline",
          +        "worker_stopped",
          +        "state_poisoned",
          +    ] {
          +        let error = MeshForwardError::Malformed {
          +            field: "replay_journal",
          +            detail: reason.to_owned(),
          +        };
          +        assert_eq!(mesh_forward_error_status(&error), StatusCode::SERVICE_UNAVAILABLE);
          +    }
          +    assert_eq!(
          +        mesh_forward_error_status(&MeshForwardError::Malformed {
          +            field: "nonce",
          +            detail: "invalid nonce".to_owned(),
          +        }),
          +        StatusCode::BAD_REQUEST
          +    );
          +    assert_eq!(
          +        mesh_forward_error_status(&MeshForwardError::Replayed {
          +            origin: "peer".to_owned(),
          +        }),
          +        StatusCode::CONFLICT
          +    );
          +    assert_eq!(
          +        mesh_forward_error_status(&MeshForwardError::ReplayCacheSaturated { capacity: 1 }),
          +        StatusCode::SERVICE_UNAVAILABLE
          +    );
          +}
          +
           fn mesh_forward_error_status(error: &fcp_mesh::invoke_route::MeshForwardError) -> StatusCode {
          @@ -1,3 +1,7 @@
                   MeshForwardError::Replayed { .. } => StatusCode::CONFLICT,
          -        MeshForwardError::ReplayCacheSaturated { .. } => StatusCode::SERVICE_UNAVAILABLE,
          +        MeshForwardError::ReplayCacheSaturated { .. }
          +        | MeshForwardError::Malformed {
          +            field: "replay_journal",
          +            ..
          +        } => StatusCode::SERVICE_UNAVAILABLE,
                   MeshForwardError::BodyTooLarge { .. } => StatusCode::PAYLOAD_TOO_LARGE,
          @@ -1,2 +1,2 @@
          -    if let Err(error) = router.accept_inbound(&envelope) {
          +    if let Err(error) = router.accept_inbound_async(&envelope).await {
                   tracing::warn!(
          @@ -1,12 +1,12 @@
                   } => match serde_json::from_str::<InvokeRequest>(request_json) {
                       Ok(request) => mesh_reply_body(
          -                Box::pin(execute_local_invoke(
          +                invoke_jobs::execute(
                               &state,
                               request,
                               asserted_principal.clone(),
          -                ))
          -                .await,
          +                    None,
          +                )
          +                .await
          +                .map_err(map_host_error),
                       ),
                       Err(error) => mesh_reply_body::<()>(Err((
                           StatusCode::BAD_REQUEST,
          PATCH
          git apply --recount --check "$RUNNER_TEMP/mesh-handler.patch"
          git apply --recount "$RUNNER_TEMP/mesh-handler.patch"
          git diff --check
          git diff --stat
          git diff -- crates/fcp-host/src/bin/fcp-host.rs
      - name: Parse the candidate and prepare an unreferenced blob
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          path = "crates/fcp-host/src/bin/fcp-host.rs"
          content = Path(path).read_text()
          subprocess.run(
              ["rustup", "run", "stable", "rustfmt", "--edition", "2024",
               "--config", "skip_children=true", "--emit", "stdout"],
              input=content, text=True, check=True, stdout=subprocess.DEVNULL,
          )
          raw = content.encode()
          expected = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          request = urllib.request.Request(
              "https://api.github.com/repos/Dicklesworthstone/flywheel_connectors/git/blobs",
              data=json.dumps({"content": content, "encoding": "utf-8"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          if blob["sha"] != expected:
              raise SystemExit("Uploaded blob does not match the reviewed candidate")
          result = {
              "base_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "files": [{"path": path, "old_sha": "27b49f81496a73c321a6d8c5beb1a0827acb70a7", "new_sha": expected}],
              "validation": "git apply check, whitespace check, Rust parse only; not compilation or tests",
          }
          print("PREPARED_MESH_INTEGRATION=" + json.dumps(result, sort_keys=True))
