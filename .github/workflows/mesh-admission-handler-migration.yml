name: Prepare reviewed mesh admission integration

'on':
  push:
    branches: [main]
    paths: [.github/workflows/mesh-admission-handler-migration.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-mesh-admission-integration
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Dicklesworthstone/flywheel_connectors' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          clean: false
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      - name: Apply reviewed patches and prepare blobs without publishing
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          base = {
              "crates/fcp-host/src/bin/fcp-host.rs": "aa653d02ac51a206e88a5ca9b1fee2557b931925",
              "connectors/discord/src/error.rs": "c85130aed3880544511198e01f4c0c23ff46b30d",
              "crates/fcp-graphql/src/error.rs": "66da0b35275747a6ed3f64b4f5d2d42eb43241f8",
          }
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          if git("branch", "--show-current") != "main":
              raise SystemExit("Only main may prepare the integration")
          evidence = Path("integration-review")
          evidence.mkdir(exist_ok=True)
          for path, expected in base.items():
              raw = Path(path).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Source changed: {path}; review required")
          # A hand-reviewed unified patch, not a regex or source transformation.
          # Zero-context hunks still match exact old text; baseline hashes above
          # prevent application to a different source revision.
          patch = '''diff --git a/connectors/discord/src/error.rs b/connectors/discord/src/error.rs
          --- a/connectors/discord/src/error.rs
          +++ b/connectors/discord/src/error.rs
          @@ -102,1 +102,9 @@
          +            // A deadline can expire after the request body was sent.
          +            // Never authorize replay of a non-idempotent Discord POST.
          +            HttpClientError::DeadlineExceeded => Self {
          +                message: "request deadline exceeded".to_owned(),
          +                status_code: None,
          +                is_timeout: true,
          +                is_connect: false,
          +            },
                       HttpClientError::Cancelled => Self {
          @@ -304,0 +312,28 @@
          +#[cfg(test)]
          +mod native_http_deadline_tests {
          +    use super::*;
          +
          +    #[test]
          +    fn native_http_deadline_never_proves_a_post_was_not_delivered() {
          +        let error = DiscordError::from_http_client_error(HttpClientError::DeadlineExceeded);
          +        let DiscordError::Http(info) = &error else {
          +            panic!("native transport deadline must retain its transport classification");
          +        };
          +        assert!(info.is_timeout);
          +        assert!(!info.is_connect);
          +        assert_eq!(info.status_code, None);
          +        assert!(!error.replay_is_safe());
          +        assert_eq!(error.retry_after(), None);
          +    }
          +
          +    #[test]
          +    fn native_http_deadline_does_not_fabricate_an_http_response() {
          +        let error = DiscordError::from_http_client_error(HttpClientError::DeadlineExceeded);
          +        assert!(matches!(
          +            error.to_fcp_error(),
          +            FcpError::External { status_code: None, retry_after: None, .. }
          +        ));
          +    }
          +}
          +
          diff --git a/crates/fcp-graphql/src/error.rs b/crates/fcp-graphql/src/error.rs
          --- a/crates/fcp-graphql/src/error.rs
          +++ b/crates/fcp-graphql/src/error.rs
          @@ -137,1 +137,10 @@
          +            // No response or pre-delivery guarantee accompanies a deadline.
          +            HttpClientError::DeadlineExceeded => Self {
          +                message: "request deadline exceeded".to_owned(),
          +                status_code: None,
          +                is_timeout: true,
          +                is_connect: false,
          +                is_request: false,
          +            },
                       HttpClientError::Cancelled => Self {
          @@ -53,1 +53,18 @@
          +#[cfg(test)]
          +mod native_http_deadline_tests {
          +    use super::*;
          +
          +    #[test]
          +    fn native_http_deadline_is_not_a_connect_failure_or_http_response() {
          +        let info = HttpErrorInfo::from(HttpClientError::DeadlineExceeded);
          +        assert!(info.is_timeout);
          +        assert!(!info.is_connect);
          +        assert!(!info.is_request);
          +        assert_eq!(info.status_code, None);
          +        let encoded = serde_json::to_vec(&info).unwrap();
          +        assert_eq!(serde_json::from_slice::<HttpErrorInfo>(&encoded).unwrap(), info);
          +    }
          +}
          +
           impl From<HttpClientError> for HttpErrorInfo {
          diff --git a/crates/fcp-host/src/bin/fcp-host.rs b/crates/fcp-host/src/bin/fcp-host.rs
          --- a/crates/fcp-host/src/bin/fcp-host.rs
          +++ b/crates/fcp-host/src/bin/fcp-host.rs
          @@ -1,1 +1,1 @@
          -    if let Err(error) = router.accept_inbound(&envelope) {
          +    if let Err(error) = router.accept_inbound_async(&envelope).await {
          @@ -1,1 +1,5 @@
          -        MeshForwardError::ReplayCacheSaturated { .. } => StatusCode::SERVICE_UNAVAILABLE,
          +        MeshForwardError::ReplayCacheSaturated { .. }
          +        | MeshForwardError::Malformed {
          +            field: "replay_journal",
          +            ..
          +        } => StatusCode::SERVICE_UNAVAILABLE,
          @@ -1,1 +1,21 @@
          +#[cfg(test)]
          +#[test]
          +fn durable_mesh_admission_failures_preserve_http_status_semantics() {
          +    use fcp_mesh::invoke_route::MeshForwardError;
          +    for reason in ["commit_failed", "replay_admission_queue_full", "worker_stopped"] {
          +        assert_eq!(mesh_forward_error_status(&MeshForwardError::Malformed {
          +            field: "replay_journal", detail: reason.to_owned(),
          +        }), StatusCode::SERVICE_UNAVAILABLE);
          +    }
          +    assert_eq!(mesh_forward_error_status(&MeshForwardError::Malformed {
          +        field: "nonce", detail: "invalid nonce".to_owned(),
          +    }), StatusCode::BAD_REQUEST);
          +    assert_eq!(mesh_forward_error_status(&MeshForwardError::Replayed {
          +        origin: "peer".to_owned(),
          +    }), StatusCode::CONFLICT);
          +    assert_eq!(mesh_forward_error_status(&MeshForwardError::ReplayCacheSaturated {
          +        capacity: 1,
          +    }), StatusCode::SERVICE_UNAVAILABLE);
          +}
          +
           fn mesh_forward_error_status(error: &fcp_mesh::invoke_route::MeshForwardError) -> StatusCode {
          '''
          patch_path = evidence / "integration.patch"
          patch_path.write_text(patch)
          subprocess.run(["git", "apply", "--check", "--recount", "--unidiff-zero", str(patch_path)], check=True)
          subprocess.run(["git", "apply", "--recount", "--unidiff-zero", str(patch_path)], check=True)
          subprocess.run(["git", "diff", "--check"], check=True)
          reviewed_diff = subprocess.check_output(["git", "diff", "--", *base], text=True)
          (evidence / "reviewed.diff").write_text(reviewed_diff)
          print(reviewed_diff)
          result = {"base_commit": git("rev-parse", "HEAD"), "base_tree": git("rev-parse", "HEAD^{tree}"), "files": []}
          for path, old_sha in base.items():
              content = Path(path).read_text()
              subprocess.run(["rustup", "run", "stable", "rustfmt", "--edition", "2024", "--config", "skip_children=true", "--emit", "stdout"], input=content, text=True, check=True, stdout=subprocess.DEVNULL)
              request = urllib.request.Request(
                  "https://api.github.com/repos/Dicklesworthstone/flywheel_connectors/git/blobs",
                  data=json.dumps({"content": content, "encoding": "utf-8"}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              result["files"].append({"path": path, "old_sha": old_sha, "new_sha": blob["sha"]})
          (evidence / "prepared.json").write_text(json.dumps(result, indent=2))
          # The complete public host source is needed to review the batch RPC's
          # existing authorization and receipt handling, not just its planner.
          (evidence / "fcp-host.rs").write_bytes(Path("crates/fcp-host/src/bin/fcp-host.rs").read_bytes())
          print("PREPARED_MESH_INTEGRATION=" + json.dumps(result, sort_keys=True))
      - name: Retain exact prepared sources and review evidence
        uses: actions/upload-artifact@v4
        with:
          name: mesh-admission-reviewed-candidates
          path: integration-review/
          retention-days: 7
      - name: Verify native HTTP error classification and live mesh admission
        run: |
          cargo test --locked -p fcp-discord --lib native_http_deadline
          cargo test --locked -p fcp-graphql --lib native_http_deadline
          cargo test --locked -p fcp-host --lib mesh_routing
          cargo test --locked -p fcp-host --bin fcp-host durable_mesh_admission_failures_preserve_http_status_semantics
          cargo test --locked -p fcp-host --test batch_async
