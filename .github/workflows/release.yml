name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Let a fresh manual retry on the same ref cancel a stale queued release run.
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Cross-platform release binaries
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `binary` is the cargo bin name; `bin_file` is the on-disk
        # filename that goes into the tarball/zip (Windows adds .exe).
        # We ship both `fwc` (the agent-facing CLI) and `fcp-host`
        # (the Gateway/Orchestrator that README's Quick Start tells
        # users to run as `fwc --host http://127.0.0.1:8787`). Both
        # share the workspace's dependency graph, so building them
        # back-to-back inside one matrix leg is much cheaper than a
        # parallel matrix that would re-fetch and re-compile every
        # workspace dep twice.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-amd64
            ext: ""
            archive_ext: tar.xz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
            ext: ""
            archive_ext: tar.xz
          - os: macos-14
            target: aarch64-apple-darwin
            asset_suffix: darwin-arm64
            ext: ""
            archive_ext: tar.xz
          - os: macos-14
            target: x86_64-apple-darwin
            asset_suffix: darwin-amd64
            ext: ""
            archive_ext: tar.xz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-amd64
            ext: ".exe"
            archive_ext: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_suffix: windows-arm64
            ext: ".exe"
            archive_ext: zip
    steps:
      - uses: actions/checkout@v7
      - name: Checkout external dependencies
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Dicklesworthstone/asupersync.git "$GITHUB_WORKSPACE/../asupersync"
          git clone --depth 1 https://github.com/Dicklesworthstone/toon_rust.git "$GITHUB_WORKSPACE/../toon_rust"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.8.1
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries (fwc + fcp-host)
        run: |
          cargo build --release --package fwc --bin fwc --target ${{ matrix.target }}
          cargo build --release --package fcp-host --bin fcp-host --target ${{ matrix.target }}

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          for binary in fwc fcp-host; do
            asset="${binary}-${{ matrix.asset_suffix }}.${{ matrix.archive_ext }}"
            tar -cJf "../../../dist/${asset}" "${binary}"
          done
          cd ../../../dist
          for f in *.${{ matrix.archive_ext }}; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          foreach ($binary in @("fwc", "fcp-host")) {
            $exe = "${binary}${{ matrix.ext }}"
            $asset = "${binary}-${{ matrix.asset_suffix }}.${{ matrix.archive_ext }}"
            Compress-Archive -Path "target/${{ matrix.target }}/release/$exe" -DestinationPath "dist/$asset"
            $hash = (Get-FileHash -Algorithm SHA256 "dist/$asset").Hash.ToLower()
            "$hash  $asset" | Out-File -Encoding ASCII "dist/$asset.sha256"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: cli-and-host-${{ matrix.asset_suffix }}
          path: dist/*

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Connectors: Release builds for all connectors
  # ─────────────────────────────────────────────────────────────────────────────
  build-connectors:
    name: Build Connectors (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            suffix: darwin-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-amd64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: windows-arm64
    steps:
      - uses: actions/checkout@v7
      - name: Checkout external dependencies
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Dicklesworthstone/asupersync.git "$GITHUB_WORKSPACE/../asupersync"
          git clone --depth 1 https://github.com/Dicklesworthstone/toon_rust.git "$GITHUB_WORKSPACE/../toon_rust"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.8.1
        with:
          key: connectors-${{ matrix.target }}

      - name: Build connectors
        run: |
          cargo build --release -p fcp-anthropic --target ${{ matrix.target }}
          cargo build --release -p fcp-discord --target ${{ matrix.target }}
          cargo build --release -p fcp-openai --target ${{ matrix.target }}
          cargo build --release -p fcp-telegram --target ${{ matrix.target }}

      - name: Package connectors (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          for connector in fcp-anthropic fcp-discord fcp-openai fcp-telegram; do
            tar -cJf ../../../dist/${connector}-${{ matrix.suffix }}.tar.xz ${connector}
          done
          cd ../../../dist
          for f in *.tar.xz; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Package connectors (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          foreach ($connector in @("fcp-anthropic", "fcp-discord", "fcp-openai", "fcp-telegram")) {
            $exe = "$connector.exe"
            $zip = "${connector}-${{ matrix.suffix }}.zip"
            Compress-Archive -Path "target/${{ matrix.target }}/release/$exe" -DestinationPath "dist/$zip"
            cd dist
            $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
            "$hash  $zip" | Out-File -Encoding ASCII "$zip.sha256"
            cd ..
          }

      - uses: actions/upload-artifact@v7
        with:
          name: connectors-${{ matrix.suffix }}
          path: dist/*

  # ─────────────────────────────────────────────────────────────────────────────
  # Release: Create GitHub release with all artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build, build-connectors]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract version
        id: version
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${RELEASE_INPUT_VERSION}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release version must look like 1.2.3 or 1.2.3-rc.1"
            exit 2
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate combined checksums
        run: |
          cd dist
          # Exclude any pre-existing SHA256SUMS.txt so re-runs don't
          # double-count themselves; the per-asset .sha256 files are the
          # source of truth.
          cat *.sha256 | sort > SHA256SUMS.txt

      - name: Generate GitHub build provenance attestations
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: |
            dist/*.tar.xz
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.5

      - name: Sign release artifacts
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          shopt -s nullglob
          for artifact in *.tar.xz *.zip SHA256SUMS.txt; do
            cosign sign-blob "$artifact" --bundle "${artifact}.sigstore.json" --yes
          done

      - uses: softprops/action-gh-release@v3.0.2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## FCP v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | CLI | Host | Anthropic | Discord | OpenAI | Telegram |
            |----------|-----|------|-----------|---------|--------|----------|
            | Linux (x64) | [fwc](fwc-linux-amd64.tar.xz) | [fcp-host](fcp-host-linux-amd64.tar.xz) | [anthropic](fcp-anthropic-linux-amd64.tar.xz) | [discord](fcp-discord-linux-amd64.tar.xz) | [openai](fcp-openai-linux-amd64.tar.xz) | [telegram](fcp-telegram-linux-amd64.tar.xz) |
            | Linux (ARM64) | [fwc](fwc-linux-arm64.tar.xz) | [fcp-host](fcp-host-linux-arm64.tar.xz) | [anthropic](fcp-anthropic-linux-arm64.tar.xz) | [discord](fcp-discord-linux-arm64.tar.xz) | [openai](fcp-openai-linux-arm64.tar.xz) | [telegram](fcp-telegram-linux-arm64.tar.xz) |
            | macOS (ARM64) | [fwc](fwc-darwin-arm64.tar.xz) | [fcp-host](fcp-host-darwin-arm64.tar.xz) | [anthropic](fcp-anthropic-darwin-arm64.tar.xz) | [discord](fcp-discord-darwin-arm64.tar.xz) | [openai](fcp-openai-darwin-arm64.tar.xz) | [telegram](fcp-telegram-darwin-arm64.tar.xz) |
            | macOS (x64) | [fwc](fwc-darwin-amd64.tar.xz) | [fcp-host](fcp-host-darwin-amd64.tar.xz) | [anthropic](fcp-anthropic-darwin-amd64.tar.xz) | [discord](fcp-discord-darwin-amd64.tar.xz) | [openai](fcp-openai-darwin-amd64.tar.xz) | [telegram](fcp-telegram-darwin-amd64.tar.xz) |
            | Windows (x64) | [fwc](fwc-windows-amd64.zip) | [fcp-host](fcp-host-windows-amd64.zip) | [anthropic](fcp-anthropic-windows-amd64.zip) | [discord](fcp-discord-windows-amd64.zip) | [openai](fcp-openai-windows-amd64.zip) | [telegram](fcp-telegram-windows-amd64.zip) |
            | Windows (ARM64) | [fwc](fwc-windows-arm64.zip) | [fcp-host](fcp-host-windows-arm64.zip) | [anthropic](fcp-anthropic-windows-arm64.zip) | [discord](fcp-discord-windows-arm64.zip) | [openai](fcp-openai-windows-arm64.zip) | [telegram](fcp-telegram-windows-arm64.zip) |

            ### Verification

            ```bash
            # Download and verify checksums
            curl -LO https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt --ignore-missing

            # Verify GitHub build provenance for an artifact
            gh attestation verify fwc-linux-amd64.tar.xz -R ${{ github.repository }}
            ```

            Every archive and checksum manifest also ships with a Sigstore keyless
            bundle (`*.sigstore.json`) generated by this workflow.

    outputs:
      version: ${{ steps.version.outputs.version }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish: Publish to crates.io (optional)
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Checkout external dependencies
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Dicklesworthstone/asupersync.git "$GITHUB_WORKSPACE/../asupersync"
          git clone --depth 1 https://github.com/Dicklesworthstone/toon_rust.git "$GITHUB_WORKSPACE/../toon_rust"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@nightly

      - name: Publish crates (dry-run)
        run: |
          # Dry run to verify everything is ready
          # Uncomment the actual publish when ready:
          # cargo publish -p fcp-cbor
          # cargo publish -p fcp-core
          # cargo publish -p fcp-crypto
          # etc.
          echo "Dry run: would publish crates to crates.io"
          cargo publish -p fcp-cbor --dry-run || true
