name: Formal Models

on:
  pull_request:
    paths:
      - "specs/tla/**"
      - "Makefile"
      - ".github/workflows/formal-models.yml"
      - "crates/fcp-host/src/cutover/**"
      - "crates/fcp-host/src/lib.rs"
      - "crates/fcp-core/src/capability.rs"
      - "crates/fcp-e2e/tests/cutover_tla_model_alignment_e2e.rs"
      - "crates/fcp-e2e/tests/capability_lifecycle_tla_alignment_e2e.rs"
      - "crates/fcp-audit/src/lib.rs"
  push:
    branches:
      - main
    paths:
      - "specs/tla/**"
      - "Makefile"
      - ".github/workflows/formal-models.yml"
      - "crates/fcp-host/src/cutover/**"
      - "crates/fcp-host/src/lib.rs"
      - "crates/fcp-core/src/capability.rs"
      - "crates/fcp-e2e/tests/cutover_tla_model_alignment_e2e.rs"
      - "crates/fcp-e2e/tests/capability_lifecycle_tla_alignment_e2e.rs"
      - "crates/fcp-audit/src/lib.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-models-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_INCREMENTAL: 0
  TLA2TOOLS_VERSION: v1.7.4
  TLA2TOOLS_SHA1: bee4a54f3ee3d4afc347c3240ec2d9e93b075104
  TLA2TOOLS_JAR: tools/tla2tools.jar

jobs:
  cutover-tla:
    name: Cutover TLA+ model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: formal-models-${{ hashFiles('Cargo.lock') }}

      - name: Download TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA2TOOLS_VERSION}/tla2tools.jar" \
            -o "${TLA2TOOLS_JAR}"
          echo "${TLA2TOOLS_SHA1}  ${TLA2TOOLS_JAR}" | sha1sum -c -

      - name: Run cutover TLC gate
        shell: bash
        run: make tla-check TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run broken-spec TLC smoke
        shell: bash
        run: make tla-check-broken TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run capability lifecycle TLC gate
        shell: bash
        run: make tla-check-capability-lifecycle TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run capability lifecycle broken-spec TLC smoke
        shell: bash
        run: make tla-check-capability-lifecycle-broken TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run audit liveness TLC gate
        shell: bash
        run: make tla-check-audit-liveness TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run audit liveness broken-spec TLC smoke
        shell: bash
        run: make tla-check-audit-liveness-broken TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run agent-mail ordering TLC gate
        shell: bash
        run: make tla-check-agent-mail-ordering TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run agent-mail ordering broken-spec TLC smoke
        shell: bash
        run: make tla-check-agent-mail-ordering-broken TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run mesh-admission TLC gate
        shell: bash
        run: make tla-check-mesh-admission TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run mesh-admission broken-spec TLC smoke
        shell: bash
        run: make tla-check-mesh-admission-broken TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run FROST DKG TLC gate
        shell: bash
        run: make tla-check-frost-dkg TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run FROST DKG broken-spec TLC smoke
        shell: bash
        run: make tla-check-frost-dkg-broken TLA2TOOLS_JAR="${TLA2TOOLS_JAR}"

      - name: Run Rust alignment E2E
        shell: bash
        run: |
          cargo test -p fcp-e2e --no-default-features \
            --test cutover_tla_model_alignment_e2e -- --nocapture

      - name: Run capability lifecycle Rust alignment E2E
        shell: bash
        run: |
          cargo test -p fcp-e2e --no-default-features \
            --test capability_lifecycle_tla_alignment_e2e -- --nocapture

      - name: Upload formal-model artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formal-models-${{ github.sha }}
          path: artifacts/formal/tla/
          retention-days: 14
