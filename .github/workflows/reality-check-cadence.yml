name: Reality Check Cadence

on:
  schedule:
    - cron: "5 0 1 * *"
  workflow_dispatch:
    inputs:
      today:
        description: "Override UTC date for cadence replay, formatted YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  monthly-reality-check:
    name: Monthly Reality Check Cadence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Test cadence helper
        run: cargo test -p br-tools --test scheduled_reality_check_filing

      - name: Generate monthly proposal
        run: |
          set -euo pipefail
          today="${{ github.event_name == 'workflow_dispatch' && inputs.today || '' }}"
          if [ -z "$today" ]; then
            today="$(date -u +%F)"
          fi
          mkdir -p artifacts/reality-check
          cargo run -p br-tools --bin scheduled-reality-check -- \
            --today "$today" \
            --reality-dir docs/reality \
            --issues .beads/issues.jsonl \
            --json | tee artifacts/reality-check/proposed-beads.json

      - name: Warn when a bead should be filed
        run: |
          set -euo pipefail
          count="$(jq 'length' artifacts/reality-check/proposed-beads.json)"
          if [ "$count" -gt 0 ]; then
            title="$(jq -r '.[0].title' artifacts/reality-check/proposed-beads.json)"
            echo "::warning title=Monthly reality-check overdue::$title"
          fi

      - name: Install br when filing is needed
        run: |
          set -euo pipefail
          count="$(jq 'length' artifacts/reality-check/proposed-beads.json)"
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          if command -v br >/dev/null 2>&1; then
            br --version
            exit 0
          fi
          cargo install --git https://github.com/Dicklesworthstone/beads_rust.git --tag v0.5.7 --locked
          br --version

      - name: File monthly bead when br is available
        run: |
          set -euo pipefail
          count="$(jq 'length' artifacts/reality-check/proposed-beads.json)"
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          title="$(jq -r '.[0].title' artifacts/reality-check/proposed-beads.json)"
          issue_type="$(jq -r '.[0].issue_type' artifacts/reality-check/proposed-beads.json)"
          priority="$(jq -r '.[0].priority' artifacts/reality-check/proposed-beads.json)"
          description="$(jq -r '.[0].description' artifacts/reality-check/proposed-beads.json)"
          labels="$(jq -r '.[0].labels | join(",")' artifacts/reality-check/proposed-beads.json)"
          if ! br create \
            --title "$title" \
            --type "$issue_type" \
            --priority "P$priority" \
            --description "$description" \
            --labels "$labels" \
            --json | tee artifacts/reality-check/filed-bead.json; then
            echo "::warning title=br filing failed::Cadence proposal generated, but br create failed in this runner"
            exit 0
          fi
          if ! br sync --flush-only --json | tee artifacts/reality-check/br-sync.json; then
            echo "::warning title=br sync failed::Cadence bead was created locally, but br sync failed in this runner"
          fi
      - name: Persist filed bead to main
        if: success()
        run: |
          set -euo pipefail
          if [ ! -s artifacts/reality-check/filed-bead.json ]; then
            exit 0
          fi
          git config user.name "reality-check-cadence-bot"
          git config user.email "actions@github.com"
          git add .beads/
          if git diff --cached --quiet; then
            echo "No beads changes to persist"
            exit 0
          fi
          git commit -m "beads: file monthly reality-check cadence bead (run ${{ github.run_id }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Comment on cadence tracker bead on failure
        if: failure()
        run: |
          set -euo pipefail
          if ! command -v br >/dev/null 2>&1; then
            echo "::error title=cadence failure filing skipped::br unavailable for angoc.5 comment"
            exit 0
          fi
          note="reality-check-cadence run ${{ github.run_id }} failed (event: ${{ github.event_name }}) at $(date -u +%FT%TZ). See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The monthly reality-check artifact is at risk of being silently skipped; backfill via docs/reality/ if the next scheduled run does not cover it."
          if br comments add flywheel_connectors-angoc.5 -m "$note" --json; then
            br sync --flush-only --json || true
            git config user.name "reality-check-cadence-bot"
            git config user.email "actions@github.com"
            git add .beads/
            if ! git diff --cached --quiet; then
              git commit -m "beads: record reality-check cadence failure on angoc.5 (run ${{ github.run_id }})"
              git pull --rebase origin main || true
              git push origin HEAD:main || echo "::error title=cadence failure push failed::could not persist angoc.5 comment to main"
            fi
          else
            echo "::error title=cadence failure filing failed::br comments add on angoc.5 failed"
          fi

      - name: Annotate silent-failure risk
        if: failure()
        run: |
          echo "::error title=Reality-check cadence run failed::The monthly cadence job failed before or during bead proposal/filing. A monthly reality-check artifact may be silently skipped; check docs/reality/ and backfill manually. Tracked in flywheel_connectors-jqx5k."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reality-check-cadence-${{ github.sha }}
          path: artifacts/reality-check/
          retention-days: 30
