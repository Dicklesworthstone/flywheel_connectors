name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: "CI lane to run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - smoke
          - focused
      focus_crate:
        description: "Workspace crate for focused lane (e.g. fcp-conformance)"
        required: false
        default: "fcp-conformance"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  CARGO_INCREMENTAL: 0
  ASUPERSYNC_CI_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # README drift: stale path and symbol guard
  # ─────────────────────────────────────────────────────────────────────────────
  readme-drift:
    name: README Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check README references
        run: bash scripts/ci/readme_drift_check.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Workspace hygiene: fail on ignored backup artifacts in source roots
  # ─────────────────────────────────────────────────────────────────────────────
  source-hygiene:
    name: Source Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check source roots for backup artifacts
        run: bash scripts/ci/workspace_source_hygiene.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint: Format + Clippy
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (workspace with all features)
        run: cargo clippy --workspace --all-features -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────────
  # ASUPERSYNC Guardrails: Tokio prohibition + exception expiry
  # ─────────────────────────────────────────────────────────────────────────────
  asupersync-guardrails:
    name: ASUPERSYNC Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Enforce Tokio guardrail policy
        run: |
          mkdir -p artifacts/asupersync/guardrails
          bash scripts/ci/asupersync_tokio_guard.sh \
            --ledger .config/asupersync/tokio_exception_ledger.json \
            --report artifacts/asupersync/guardrails/tokio_guard_report.json

      - name: Upload ASUPERSYNC guardrail artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asupersync-guardrails
          path: artifacts/asupersync/guardrails/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Formal verification: Lean proof gate for E2E-linked invariants
  # ─────────────────────────────────────────────────────────────────────────────
  formal-verification:
    name: Lean Formal Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false

  # ─────────────────────────────────────────────────────────────────────────────
  # ASUPERSYNC lane: smoke (fast signal for migration churn)
  # ─────────────────────────────────────────────────────────────────────────────
  migration-smoke:
    name: ASUPERSYNC Smoke Lane
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lane == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: asupersync-smoke

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Smoke formatting gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/smoke
          start_epoch="$(date +%s)"
          cargo fmt --all -- --check
          end_epoch="$(date +%s)"
          jq -cn \
            --arg step "smoke_fmt_check" \
            --argjson duration_sec "$((end_epoch - start_epoch))" \
            '{step: $step, duration_sec: $duration_sec}' \
            >> artifacts/asupersync/smoke/step_durations.jsonl

      - name: Smoke compile gate (core)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/smoke
          start_epoch="$(date +%s)"
          cargo check -p fcp-core --all-targets
          end_epoch="$(date +%s)"
          jq -cn \
            --arg step "smoke_check_fcp_core" \
            --argjson duration_sec "$((end_epoch - start_epoch))" \
            '{step: $step, duration_sec: $duration_sec}' \
            >> artifacts/asupersync/smoke/step_durations.jsonl

      - name: Smoke compile gate (conformance)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/smoke
          start_epoch="$(date +%s)"
          cargo check -p fcp-conformance --all-targets
          end_epoch="$(date +%s)"
          jq -cn \
            --arg step "smoke_check_fcp_conformance" \
            --argjson duration_sec "$((end_epoch - start_epoch))" \
            '{step: $step, duration_sec: $duration_sec}' \
            >> artifacts/asupersync/smoke/step_durations.jsonl

      - name: Smoke Tokio guardrail report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/smoke
          start_epoch="$(date +%s)"
          bash scripts/ci/asupersync_tokio_guard.sh \
            --ledger .config/asupersync/tokio_exception_ledger.json \
            --report artifacts/asupersync/smoke/tokio_guard_report.json
          end_epoch="$(date +%s)"
          jq -cn \
            --arg step "smoke_tokio_guardrail" \
            --argjson duration_sec "$((end_epoch - start_epoch))" \
            '{step: $step, duration_sec: $duration_sec}' \
            >> artifacts/asupersync/smoke/step_durations.jsonl

      - name: Smoke throughput metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/smoke
          jq -s \
            --arg generated_at "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              schema_version: 1,
              generated_at: $generated_at,
              lane: "smoke",
              steps: .,
              total_duration_sec: (map(.duration_sec) | add // 0)
            }' \
            artifacts/asupersync/smoke/step_durations.jsonl \
            > artifacts/asupersync/smoke/throughput_metrics.json

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asupersync-smoke
          path: artifacts/asupersync/smoke/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # ASUPERSYNC lane: focused crate validation
  # ─────────────────────────────────────────────────────────────────────────────
  focused-suite:
    name: Focused Suite (${{ inputs.focus_crate }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lane == 'focused' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOCUS_CRATE: ${{ inputs.focus_crate }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: asupersync-focused-${{ inputs.focus_crate }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Validate focused crate input
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FOCUS_CRATE}" ]]; then
            echo "::error::focus_crate input is required for focused lane"
            exit 2
          fi
          if [[ ! "${FOCUS_CRATE}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::focus_crate must be a Cargo package name"
            exit 2
          fi
          echo "Focused crate: ${FOCUS_CRATE}"

      - name: Focused check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/focused
          start_epoch="$(date +%s)"
          cargo check -p "${FOCUS_CRATE}" --all-targets
          end_epoch="$(date +%s)"
          jq -cn \
            --arg step "focused_check" \
            --argjson duration_sec "$((end_epoch - start_epoch))" \
            '{step: $step, duration_sec: $duration_sec}' \
            >> artifacts/asupersync/focused/step_durations.jsonl

      - name: Focused clippy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/focused
          start_epoch="$(date +%s)"
          cargo clippy -p "${FOCUS_CRATE}" --all-targets -- -D warnings
          end_epoch="$(date +%s)"
          jq -cn \
            --arg step "focused_clippy" \
            --argjson duration_sec "$((end_epoch - start_epoch))" \
            '{step: $step, duration_sec: $duration_sec}' \
            >> artifacts/asupersync/focused/step_durations.jsonl

      - name: Focused tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/focused
          start_epoch="$(date +%s)"
          cargo test -p "${FOCUS_CRATE}" --all-targets -- --nocapture
          end_epoch="$(date +%s)"
          jq -cn \
            --arg step "focused_test" \
            --argjson duration_sec "$((end_epoch - start_epoch))" \
            '{step: $step, duration_sec: $duration_sec}' \
            >> artifacts/asupersync/focused/step_durations.jsonl

      - name: Focused throughput metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/asupersync/focused
          jq -s \
            --arg generated_at "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg focus_crate "${{ inputs.focus_crate }}" \
            '{
              schema_version: 1,
              generated_at: $generated_at,
              lane: "focused",
              focus_crate: $focus_crate,
              steps: .,
              total_duration_sec: (map(.duration_sec) | add // 0)
            }' \
            artifacts/asupersync/focused/step_durations.jsonl \
            > artifacts/asupersync/focused/throughput_metrics.json

      - name: Upload focused artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asupersync-focused
          path: artifacts/asupersync/focused/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # ASUPERSYNC migration dashboard artifact
  # ─────────────────────────────────────────────────────────────────────────────
  asupersync-migration-dashboard:
    name: ASUPERSYNC Migration Dashboard
    needs: [asupersync-guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly

      - name: Build dashboard artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/asupersync/dashboard

          bash scripts/ci/asupersync_tokio_guard.sh \
            --ledger .config/asupersync/tokio_exception_ledger.json \
            --report artifacts/asupersync/dashboard/tokio_guard_report.json

          METADATA_JSON="$(mktemp)"
          cargo metadata --format-version 1 --no-deps > "${METADATA_JSON}"

          TOTAL_CRATES="$(jq '[.packages[] | select(.manifest_path | test("/(crates|connectors)/"))] | length' "${METADATA_JSON}")"
          TOKIO_DEP_CRATES="$(jq '[.packages[] | select(.manifest_path | test("/(crates|connectors)/")) | select(any(.dependencies[]?; .name == "tokio"))] | length' "${METADATA_JSON}")"
          TOKIO_FREE_CRATES="$((TOTAL_CRATES - TOKIO_DEP_CRATES))"

          TOKIO_TEST_ANNOTATIONS="$( (rg -n --no-heading '#\\[tokio::test\\]' crates connectors || true) | wc -l | tr -d '[:space:]' )"
          TOKIO_SELECT_USES="$( (rg -n --no-heading 'tokio::select!' crates connectors || true) | wc -l | tr -d '[:space:]' )"
          TOKIO_SPAWN_USES="$( (rg -n --no-heading 'tokio::spawn' crates connectors || true) | wc -l | tr -d '[:space:]' )"

          GUARD_MISSING="$(jq '.summary.missing_dependency_exceptions' artifacts/asupersync/dashboard/tokio_guard_report.json)"
          GUARD_EXPIRED="$(jq '.summary.expired_dependency_exceptions' artifacts/asupersync/dashboard/tokio_guard_report.json)"
          GUARD_FAILED_INVARIANTS="$(jq '.summary.failed_source_invariants' artifacts/asupersync/dashboard/tokio_guard_report.json)"
          GUARD_PASSED="$(jq '.passed' artifacts/asupersync/dashboard/tokio_guard_report.json)"

          GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          LANE="${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}"
          FOCUS_CRATE="${{ github.event_name == 'workflow_dispatch' && inputs.focus_crate || '' }}"

          jq -n \
            --arg generated_at "${GENERATED_AT}" \
            --arg lane "${LANE}" \
            --arg focus_crate "${FOCUS_CRATE}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg sha "${GITHUB_SHA}" \
            --arg ref_name "${GITHUB_REF_NAME}" \
            --argjson total_crates "${TOTAL_CRATES}" \
            --argjson tokio_dependency_crates "${TOKIO_DEP_CRATES}" \
            --argjson tokio_free_crates "${TOKIO_FREE_CRATES}" \
            --argjson tokio_test_annotations "${TOKIO_TEST_ANNOTATIONS}" \
            --argjson tokio_select_uses "${TOKIO_SELECT_USES}" \
            --argjson tokio_spawn_uses "${TOKIO_SPAWN_USES}" \
            --argjson guard_passed "${GUARD_PASSED}" \
            --argjson guard_missing_dependency_exceptions "${GUARD_MISSING}" \
            --argjson guard_expired_dependency_exceptions "${GUARD_EXPIRED}" \
            --argjson guard_failed_source_invariants "${GUARD_FAILED_INVARIANTS}" \
            '{
              schema_version: 1,
              generated_at: $generated_at,
              ci: {
                workflow: $workflow,
                run_id: $run_id,
                run_attempt: $run_attempt,
                sha: $sha,
                ref_name: $ref_name
              },
              lane: {
                selected: $lane,
                focus_crate: $focus_crate
              },
              migration_progress: {
                total_workspace_crates: $total_crates,
                tokio_dependency_crates: $tokio_dependency_crates,
                tokio_free_crates: $tokio_free_crates,
                tokio_test_annotations: $tokio_test_annotations,
                tokio_select_uses: $tokio_select_uses,
                tokio_spawn_uses: $tokio_spawn_uses
              },
              guardrail_status: {
                passed: $guard_passed,
                missing_dependency_exceptions: $guard_missing_dependency_exceptions,
                expired_dependency_exceptions: $guard_expired_dependency_exceptions,
                failed_source_invariants: $guard_failed_source_invariants
              }
            }' > artifacts/asupersync/dashboard/ci_migration_dashboard.json

          {
            echo "## ASUPERSYNC Migration Dashboard"
            echo ""
            echo "- Lane: ${LANE}"
            echo "- Focus crate: ${FOCUS_CRATE:-n/a}"
            echo "- Tokio-free crates: ${TOKIO_FREE_CRATES}/${TOTAL_CRATES}"
            echo "- Tokio test annotations remaining: ${TOKIO_TEST_ANNOTATIONS}"
            echo "- Tokio guardrails passed: ${GUARD_PASSED}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload migration dashboard artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asupersync-migration-dashboard
          path: artifacts/asupersync/dashboard/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Test: Matrix across OS
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Run tests
        run: cargo test --workspace --all-targets -- --nocapture

      - name: Run doc tests
        run: cargo test --doc

  # ─────────────────────────────────────────────────────────────────────────────
  # Golden Vectors Staleness Check
  # ─────────────────────────────────────────────────────────────────────────────
  golden-vectors:
    name: Golden Vectors
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Run tests (may regenerate vectors)
        run: cargo test --workspace

      - name: Check CBOR vectors are up to date
        run: |
          if git diff --name-only | grep -q '\.cbor$'; then
            echo "::error::Golden vectors are stale! The following .cbor files were regenerated by tests:"
            git diff --name-only | grep '\.cbor$'
            echo ""
            echo "Please run 'cargo test' locally and commit the updated vectors."
            exit 1
          fi

      - name: Verify schema hash vectors
        run: |
          mkdir -p artifacts
          cargo run -p fcp-conformance --bin fcp-vecgen -- \
            --verify \
            --baseline tests/vectors/serialization/core_vectors.json \
            --log-jsonl artifacts/schema_vector_verify.jsonl \
            > artifacts/schema_vector_diff.json 2>&1 || {
              echo "::error::Schema hash vectors are stale!"
              cat artifacts/schema_vector_diff.json
              echo ""
              echo "To update baseline, run:"
              echo "  cargo run -p fcp-conformance --bin fcp-vecgen -- --out tests/vectors/serialization"
              exit 1
            }

      - name: Upload vector verification artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vector-verification
          path: artifacts/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Security: cargo-audit + cargo-deny
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        # RUSTSEC-2023-0071: rsa Marvin Attack — no fixed version available
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependencies
        run: cargo deny check || echo "::warning::cargo-deny found issues"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # MSRV: Verify minimum supported Rust version
  # ─────────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.85)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Check MSRV
        run: cargo check --workspace

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: Cross-platform release builds
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    needs: [lint, test, security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Build release (CLI)
        run: cargo build --release --package fwc --bin fwc --target ${{ matrix.target }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: fwc-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/fcp*
            target/${{ matrix.target }}/release/fwc*
            !target/${{ matrix.target }}/release/*.d
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Docs: Build and check documentation
  # ─────────────────────────────────────────────────────────────────────────────
  docs:
    name: Documentation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Build documentation
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Coverage: llvm-cov with Codecov upload
  # ─────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex "(tests/|benches/|fuzz/)" \
            --codecov \
            --output-path codecov.json

      - uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage summary
        run: |
          cargo llvm-cov --workspace --json --output-path cov.json 2>/dev/null || true
          if [[ -f cov.json ]]; then
            COVERAGE=$(jq -r '.data[0].totals.lines.percent // 0' cov.json)
            echo "## Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Connectors: Build and test connector binaries
  # ─────────────────────────────────────────────────────────────────────────────
  connectors:
    name: Connectors
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: connectors

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Build connectors
        run: |
          cargo build --release -p fcp-anthropic
          cargo build --release -p fcp-discord
          cargo build --release -p fcp-openai
          cargo build --release -p fcp-telegram

      - name: Test connectors
        run: |
          cargo test -p fcp-anthropic
          cargo test -p fcp-discord
          cargo test -p fcp-openai
          cargo test -p fcp-telegram

  # ─────────────────────────────────────────────────────────────────────────────
  # Benchmarks: Performance regression gate
  # ─────────────────────────────────────────────────────────────────────────────
  benchmarks:
    name: Benchmarks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: Run core benchmarks
        run: |
          cargo bench -p fcp-mesh --bench mesh_benchmarks -- --output-format bencher 2>&1 | tee bench_mesh.txt || true
          cargo bench -p fcp-core --bench pcs_benchmarks -- --output-format bencher 2>&1 | tee bench_pcs.txt || true
          cargo bench -p fwc --bench cual_bench -- --output-format bencher 2>&1 | tee bench_fwc.txt || true

      - name: Benchmark summary
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in bench_mesh.txt bench_pcs.txt bench_fwc.txt; do
            if [[ -f "$f" ]]; then
              echo "### $(basename "$f" .txt)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "^test " "$f" | head -20 >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary: Final status check
  # ─────────────────────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    needs: [lint, asupersync-guardrails, migration-smoke, focused-suite, asupersync-migration-dashboard, test, golden-vectors, security, msrv, build, docs, connectors, benchmarks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}
          LINT_RESULT: ${{ needs.lint.result }}
          GUARDRAILS_RESULT: ${{ needs.asupersync-guardrails.result }}
          SMOKE_RESULT: ${{ needs.migration-smoke.result }}
          FOCUSED_RESULT: ${{ needs.focused-suite.result }}
          DASHBOARD_RESULT: ${{ needs.asupersync-migration-dashboard.result }}
          TEST_RESULT: ${{ needs.test.result }}
          GOLDEN_RESULT: ${{ needs.golden-vectors.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CONNECTORS_RESULT: ${{ needs.connectors.result }}
          BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
        run: |
          set -euo pipefail

          failure=0
          require_success() {
            local job_name="$1"
            local job_result="$2"
            if [[ "${job_result}" != "success" ]]; then
              echo "::error::Required job '${job_name}' did not succeed (result=${job_result})"
              failure=1
            fi
          }

          case "${LANE}" in
            smoke)
              require_success "asupersync-guardrails" "${GUARDRAILS_RESULT}"
              require_success "migration-smoke" "${SMOKE_RESULT}"
              require_success "asupersync-migration-dashboard" "${DASHBOARD_RESULT}"
              ;;
            focused)
              require_success "asupersync-guardrails" "${GUARDRAILS_RESULT}"
              require_success "focused-suite" "${FOCUSED_RESULT}"
              require_success "asupersync-migration-dashboard" "${DASHBOARD_RESULT}"
              ;;
            full)
              require_success "lint" "${LINT_RESULT}"
              require_success "asupersync-guardrails" "${GUARDRAILS_RESULT}"
              require_success "asupersync-migration-dashboard" "${DASHBOARD_RESULT}"
              require_success "test" "${TEST_RESULT}"
              require_success "golden-vectors" "${GOLDEN_RESULT}"
              require_success "security" "${SECURITY_RESULT}"
              require_success "msrv" "${MSRV_RESULT}"
              require_success "build" "${BUILD_RESULT}"
              require_success "docs" "${DOCS_RESULT}"
              require_success "connectors" "${CONNECTORS_RESULT}"
              require_success "benchmarks" "${BENCHMARKS_RESULT}"
              ;;
            *)
              echo "::error::Unknown lane '${LANE}'"
              exit 2
              ;;
          esac

          if [[ "${failure}" -ne 0 ]]; then
            exit 1
          fi

          echo "All required checks passed for lane '${LANE}'."
