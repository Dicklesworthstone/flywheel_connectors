# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# If true, metadata will be collected with --all-features
all-features = true

[advisories]
# The database of advisories to check
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# How to handle advisories that are not yet assigned a CVE
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
    # rsa crate Marvin Attack (RUSTSEC-2023-0071) — no fixed version available upstream
    "RUSTSEC-2023-0071",
    # sized-chunks panic-safety unsoundness (RUSTSEC-2026-0255) — no upgrade
    # path: `patched = []`, all releases <= 0.7.0 affected, upstream repo
    # archived. Sole chain: sized-chunks <- im-rc 15.1.0 <- wasm-compose
    # 0.243.0 <- wasmtime 41.0.4 <- fcp-sandbox. Not reachable in practice:
    # the only im-rc container in the consumer tree is wasm-compose's
    # HashMap of Copy ID types (no panicking element Drop), and workspace
    # code never touches sized-chunks/im-rc directly.
    "RUSTSEC-2026-0255",
]

[licenses]
# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8
# Allow private/unpublished crates
private = { ignore = true }

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"
# Lint level for crates that are not used
wildcards = "allow"
# Allow dev/build dependencies to have duplicates
workspace-default-features = "allow"
external-default-features = "allow"
# Crates to deny outright
deny = [
    # Add crates to ban here
]
# Crates to skip when checking for multiple versions
skip = [
    # Common crates with version churn
]
skip-tree = [
    # Skip entire dependency trees
]

[sources]
# Allowed source types
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
# Allow crates from these GitHub organizations
github = ["flywheel"]
