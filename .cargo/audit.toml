# cargo-audit configuration
# https://docs.rs/rustsec/latest/rustsec/

[advisories]
ignore = [
    # RUSTSEC-2023-0071: rsa Marvin Attack (timing sidechannel) — no fixed
    # version available upstream. Also passed via --ignore in CI; kept here so
    # local `cargo audit` runs agree with the CI gate.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0255: sized-chunks 0.6.5 panic-safety unsoundness in
    # Chunk::{clear,drop_left,drop_right}, RingBuffer::{clear,drop_left,
    # drop_right}, InlineArray::clear (use-after-free / double-free when an
    # element's Drop panics). No upgrade path exists:
    #   - advisory `patched = []`; every release <= 0.7.0 is affected and the
    #     upstream sized-chunks repo is archived (issues/PRs disabled).
    #   - sole consumer chain: sized-chunks <- im-rc 15.1.0 (^0.6.4 pin)
    #     <- wasm-compose 0.243.0 <- wasmtime 41.0.4 <- fcp-sandbox.
    #   - workspace code never uses sized-chunks/im-rc directly (grep-clean).
    # Exposure analysis: the only im-rc container instantiated by the
    # transitive consumer is wasm-compose's
    # `im_rc::HashMap<ResourceId, (ComponentId, ResourceId)>` (graph.rs).
    # All stored types are Copy ID newtypes with no Drop impls, so the
    # trigger condition (an element Drop panicking during
    # clear/drop_left/drop_right) is unreachable from workspace call sites.
    "RUSTSEC-2026-0255",
    # RUSTSEC-2025-0111: tokio-tar 0.3.1 parses PAX extended headers
    # incorrectly, allowing file smuggling on extraction. No fixed upgrade
    # exists (advisory `patched = []`; crate effectively unmaintained).
    #   - sole consumer chain: tokio-tar <- testcontainers 0.23 <-
    #     optional `integration-testcontainer` feature of the
    #     elasticsearch and postgresql connectors (dev/integration-test
    #     only; not built into any production connector or host binary).
    # Exposure analysis: the smuggle-on-extract path requires extracting an
    # attacker-controlled archive; testcontainers only unpacks images it
    # pulls from the configured container registry inside developer/CI
    # environments, and the workspace ships no archive-extraction code
    # touching this crate. Revisit if testcontainers ships a fixed tokio-tar
    # or the feature is removed.
    "RUSTSEC-2025-0111",
    # RUSTSEC-2026-0292: imbl-sized-chunks 0.1.3 panic-safety in Chunk/InlineArray
    # removal when an element Drop panics. Transitive only via optional
    # `matrix-sdk-crypto-backend` feature in `fcp-matrix` (`imbl-sized-chunks`
    # <- `imbl 6.1.0` <- `matrix-sdk-common 0.16.1` <- `matrix-sdk-crypto 0.16.1`).
    # Default builds of `fcp-matrix` do not enable this feature.
    "RUSTSEC-2026-0292",
    # RUSTSEC-2026-0318: matrix-sdk-crypto 0.16.1 custom to-device message panic.
    # Optional `matrix-sdk-crypto-backend` feature in `fcp-matrix`; `fcp-matrix`
    # does not send custom to-device messages. Upgrading to 0.19 requires a major
    # ruma/matrix-sdk migration tracked separately.
    "RUSTSEC-2026-0318",
    # Wasmtime 46.0.x advisories (require major upgrade to Wasmtime >=48.0.4):
    # - RUSTSEC-2026-0314 / 0324: guest filesystem datetime/timestamp panic (wasip3
    #   or extreme host timestamps; fcp-sandbox uses WASI preview1/preview2 with
    #   read-only or capability-scoped staging dirs).
    # - RUSTSEC-2026-0316 / 0327: component-model dynamic record lifting / async
    #   callback result count (fcp-sandbox executes signed connector modules under
    #   host fuel/memory limits, not untrusted component-model async callbacks).
    # - RUSTSEC-2026-0321 / 0322 / 0323: WASI preview0 poll_oneoff fuel, missing
    #   stdio allocation, and fd_readdir padding (fcp-sandbox always attaches
    #   captured stdio pipes and runs TUF/cosign-verified connector binaries).
    "RUSTSEC-2026-0314",
    "RUSTSEC-2026-0316",
    "RUSTSEC-2026-0321",
    "RUSTSEC-2026-0322",
    "RUSTSEC-2026-0323",
    "RUSTSEC-2026-0324",
    "RUSTSEC-2026-0327",
    # Transitive unsoundness warnings in archived/upstream crates:
    # - RUSTSEC-2025-0167: bitmaps 3.2.1 (via im-rc <- wasm-compose)
    # - RUSTSEC-2026-0306: faster-hex 0.10.0 `hex_decode_unchecked` (via gix;
    #   gix only calls checked hex decoding paths).
    "RUSTSEC-2025-0167",
    "RUSTSEC-2026-0306",
]
