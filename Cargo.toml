[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/flywheel/flywheel_connectors"
authors = ["Flywheel Core Team <core@flywheel.dev>"]

[workspace.dependencies]
async-trait = "0.1"
futures-util = "0.3"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2.2"
semver = { version = "1.0.27", features = ["serde"] }
toml = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
blake3 = "1.8.3"
hmac = "0.12.1"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
hpke = "0.12"
coset = "0.4"
cryptoki = "0.12.0"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
rand = "0.8"
rand_core = "0.6"
rsa = { version = "0.9", features = ["sha2"] }
rayon = "1.12.0"
# matrix-sdk-crypto 0.16 requires Rust 1.88; keep the Matrix E2EE adapter on
# the latest Rust-1.85-compatible release until the workspace MSRV moves.
matrix-sdk-crypto = { version = "0.13.0", default-features = false }

# Identifiers
uuid = { version = "1.21", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Bytes
bytes = "1.11"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22"
bitflags = "2.11"
percent-encoding = "2.3"

# WASI runtime
wasmtime = { version = "41.0", features = ["component-model"] }
wasmtime-wasi = "41.0"

# HTTP client
reqwest = { version = "0.13", features = ["json", "query", "rustls"], default-features = false }

# Probabilistic data structures
xorf = { version = "0.12", features = ["serde"] }

# Testing
wiremock = "0.6"
pretty_assertions = "1.4"
jsonschema = "0.42"
regex = "1.12"
proptest = "1.10"
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1.43", features = ["json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
handlebars = "6.4.0"

# Supply-chain hardening
tough = { version = "0.21.0", features = ["http"] }
sigstore = { version = "0.13.0", default-features = false, features = ["cosign", "verify", "rekor", "sigstore-trust-root", "rustls-tls"] }
sigstore-trust-root = { version = "0.6", features = ["tuf"] }
url = "2.5"

# Internal crates
fcp-async-core = { path = "crates/fcp-async-core" }
fcp-audit = { path = "crates/fcp-audit" }
fcp-auth-schema = { path = "crates/fcp-auth-schema" }
fcp-bench = { path = "crates/fcp-bench" }
fcp-bootstrap = { path = "crates/fcp-bootstrap" }
fcp-cbor = { path = "crates/fcp-cbor" }
fcp-core = { path = "crates/fcp-core" }
fcp-conformance = { path = "crates/fcp-conformance" }
fcp-crypto = { path = "crates/fcp-crypto" }
fcp-crypto-hw = { path = "crates/fcp-crypto-hw" }
fcp-google-discovery = { path = "crates/fcp-google-discovery" }
fcp-graphql = { path = "crates/fcp-graphql" }
fcp-adversarial = { path = "connectors/_adversarial" }
fcp-cerebras = { path = "connectors/cerebras" }
fcp-deepseek = { path = "connectors/deepseek" }
fcp-duckduckgo = { path = "connectors/duckduckgo" }
fcp-fireworks = { path = "connectors/fireworks" }
fcp-glm = { path = "connectors/glm" }
fcp-groq = { path = "connectors/groq" }
fcp-moonshot = { path = "connectors/moonshot" }
fcp-microsoft-foundry = { path = "connectors/microsoft-foundry" }
fcp-host = { path = "crates/fcp-host" }
fcp-nvidia-nim = { path = "connectors/nvidia-nim" }
fcp-qwen = { path = "connectors/qwen" }
fcp-searxng = { path = "connectors/searxng" }
fcp-lm-studio = { path = "connectors/lm-studio" }
fcp-ollama = { path = "connectors/ollama" }
fcp-together = { path = "connectors/together" }
fcp-voyage = { path = "connectors/voyage" }
