[workspace.lints.rust]
# Default deny, but allow override for crates that legitimately need unsafe (e.g., fcp-sandbox)
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# The connector protocol loop awaits every JSON-RPC handler uniformly
# (configure/handshake/health/...), so handlers keep `async fn` signatures
# even when a given handler body has no await points.
unused_async_trait_impl = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Benchmark profile: inherit release settings but optimize for speed, not size.
# `cargo bench` uses this automatically. This prevents benchmarks from measuring
# size-optimized codegen (`opt-level = "z"`) which is 2-5x slower than speed-
# optimized codegen for compute-heavy paths (RaptorQ, crypto, CBOR).
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
